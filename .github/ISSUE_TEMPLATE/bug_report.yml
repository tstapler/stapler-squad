name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please check [open issues](https://github.com/tstapler/stapler-squad/issues) first to avoid duplicates.

        **Security vulnerability?** Don't file it here — see [SECURITY.md](https://github.com/tstapler/stapler-squad/blob/main/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `stapler-squad version` (or `ssq version`)
      placeholder: "v2.2.0"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - Homebrew
        - Pre-built binary (install.sh)
        - Built from source
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux
        - Other / WSL2
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: AI agent CLI involved (if applicable)
      options:
        - Not applicable
        - Claude Code
        - Codex
        - Gemini CLI
        - Aider
        - Amp
        - Other
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `ssq`
        2. Create a session with ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >
        Check `~/.stapler-squad/logs/staplersquad.log` (main log) and
        `~/.stapler-squad/logs/service.log` (if running as a managed service).
        See [docs/how-to/debug-with-logs.md](https://github.com/tstapler/stapler-squad/blob/main/docs/how-to/debug-with-logs.md).
        Please redact anything sensitive.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
    validations:
      required: false
