name: Lint

on:
  push:
    branches: [ main ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'proto/**'
      - 'web-app/**.css'
      - 'web-app/**.ts'
      - 'web-app/**.tsx'
      - 'web-app/src/**'
      - 'web-app/package.json'
      - 'web-app/bun.lock'
      - 'web-app/jest.config.js'
      - 'web-app/jest.setup.js'
      - 'web-app/scripts/**'
      - 'tests/e2e/**'
      - '**.sh'
      - '!third_party/**'
      - 'scripts/ssq-hook-handler'
      - '.github/workflows/lint.yml'
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'proto/**'
      - 'web-app/**.css'
      - 'web-app/**.ts'
      - 'web-app/**.tsx'
      - 'web-app/src/**'
      - 'web-app/package.json'
      - 'web-app/bun.lock'
      - 'web-app/jest.config.js'
      - 'web-app/jest.setup.js'
      - 'web-app/scripts/**'
      - 'tests/e2e/**'
      - '**.sh'
      - '!third_party/**'
      - 'scripts/ssq-hook-handler'
      - '.github/workflows/lint.yml'

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Steps after codegen use `!cancelled()` so one failing linter does not hide the others.
  # One job (was five: lint-prepare, proto-breaking, shell-lint, go-lint, web-lint): every one of them
  # re-checked-out, re-set-up Go/Bun and shared generated code through an artifact. Serial steps add
  # ~4 min versus the old parallel shape, still well under the e2e shards that dominate PR wall time.
  lint:
    name: Lint (Go, web, shell, proto)
    runs-on: ubuntu-latest
    # 60m: Go and web lint plus codegen/buf breaking/ShellCheck in one job (golangci-lint step capped at 16m, ESLint at 16m).
    timeout-minutes: 60
    steps:
      # fetch-depth: 0 (full history, all branches) is required so `origin/main` is
      # resolvable locally for the complexity gate's --new-from-rev=origin/main below —
      # see that step's comment for why.
      #
      # ref: pins the checkout to the PR's actual head commit, not GitHub's synthetic
      # refs/pull/N/merge (actions/checkout's default for pull_request events, which tracks
      # main's current tip independently of base.sha) — see web-lint's identical comment
      # for the full failure mode this avoids (PR #1144's gofmt diff below has the same bug
      # shape as web-lint's file-scoped ESLint diff).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          # Blobless: full commit/tree history (merge-base and origin/main resolve)
          # without the ~16GB of historical blobs; blobs for diffed files fetch lazily.
          filter: blob:none

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      # Generated code is gitignored (see #445): generated inline here (was a separate
      # lint-prepare job + artifact hand-off, i.e. two more checks per run).
      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # web-lint's Jest tests jest.mock() modules under web-app/src/gen/ — module resolution
      # needs the file to exist even for a mocked import. That needs
      # web-app/node_modules/.bin/protoc-gen-es, so web-app deps install before buf generate.
      - name: Install web-app dependencies
        working-directory: web-app
        run: bun install --frozen-lockfile

      - uses: ./.github/actions/prepare-stub
        with:
          buf-template: buf.gen.yaml

      # Folded in from the former proto-breaking and shell-lint jobs. Cheap, but each was a
      # separate runner and a separate check.
      # No separate fetch: this job's fetch-depth: 0 checkout already has origin/main, and a
      # `git fetch --depth=1` here would truncate it and break the complexity gate's merge-base.
      # buf 1.41.0 is already on PATH from prepare-stub above. Compare against a separate shallow
      # clone of main, not '.git#branch=origin/main': this job's checkout is blobless, and buf's
      # internal `git clone file://.git` cannot lazy-fetch main's proto blobs from the promisor remote.
      - name: buf breaking against origin/main
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git clone --quiet --depth=1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" /tmp/main-proto
          buf breaking proto --against '/tmp/main-proto/.git#subdir=proto'

      # ubuntu-latest ships shellcheck; `make lint-shell` is the single source of truth for which
      # scripts are checked (also runnable locally).
      - name: ShellCheck
        if: ${{ !cancelled() }}
        run: make lint-shell

      # Fails if any workflow outside _prepare.yml retypes the generated-files artifact literal
      # (see tools/ci/check-generated-files-literal.sh).
      - name: Guard against stray "generated-files" literal
        if: ${{ !cancelled() }}
        run: tools/ci/check-generated-files-literal.sh

      # Fails when go.mod's tymux client pin and the Makefile's TYMUX_VERSION differ.
      - name: Check tymux client/daemon pin agreement
        if: ${{ !cancelled() }}
        run: tools/ci/check-tymux-pin.sh

      - name: Test tymux pin check
        if: ${{ !cancelled() }}
        run: tools/ci/check-tymux-pin_test.sh

      # Soft-timeout wrapper (16m, below this job's hard timeout-minutes ceiling):
      # golangci-lint-action is a `uses:` step, so it can't be wrapped with the shell
      # `timeout` utility directly — instead this uses GHA's native step-level
      # timeout-minutes (which only kills this one step's process, not the whole job;
      # subsequent steps still run) paired with an always()-guarded follow-up step that
      # emits the marker when — and only when — this step's own outcome is 'cancelled'
      # (a genuine lint failure reports outcome 'failure' instead, so it's never
      # mistaken for a budget breach). This is this job's longest-running step (a full
      # whole-codebase lint pass, unscoped, vs. the new-code-only gate below).
      - name: golangci-lint
        if: ${{ !cancelled() }}
        id: golangci-lint
        timeout-minutes: 16
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          args: --timeout=10m --max-issues-per-linter=0 --max-same-issues=0
          skip-cache: false
          only-new-issues: false

      # keep this marker prefix in sync with ciBudgetExceededMarker in server/services/github_webhook_pr_fix.go
      - name: Report CI budget exceeded (golangci-lint)
        if: always() && steps.golangci-lint.outcome == 'cancelled'
        run: |
          echo "::error::CI-BUDGET-EXCEEDED: 'go-lint' exceeded its 16m budget"
          echo "CI-BUDGET-EXCEEDED: 'go-lint' exceeded its 16m budget" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # gocyclo/gocognit/funlen/revive(file-length-limit) flag files/functions getting too
      # big or too complex — the shape that let session/backlog_lifecycle.go grow to 4930
      # lines before anyone noticed (see the code-hotspot-analysis skill + the split PR that
      # added this step). dupl flags copy-pasted blocks — the "Duplicated/Divergent Logic"
      # failure mode (see quality:reflect-and-fix's Level 0 gate, added 2026-08-24 after a
      # resize fix landed at one call site and silently missed two others). Thresholds live
      # in .golangci.yml's settings block. Run as a separate step (not folded into the block
      # above) because it needs new-issues-only filtering — the repo has pre-existing
      # violations of all 5 of these in files this step doesn't touch, and failing on those
      # would block unrelated PRs. `make lint`/`make ci` are deliberately unaffected (none of
      # these 5 linters are in .golangci.yml's enable: list).
      #
      # Uses golangci-lint's native --new-from-rev (git-based) instead of the action's own
      # only-new-issues: true. only-new-issues fetches the PR diff from the GitHub REST API
      # (pulls.get with the diff media type), which hard-caps at 20000 changed lines — past
      # that it 406s and the action silently falls back to reporting EVERY issue in the
      # whole repo instead of just new ones (see golangci/golangci-lint-action#996). PR #381
      # hit this: a large merge-driven diff (~161k lines, almost entirely from generated
      # session/ent/*.go files this branch has untracked but main still has committed)
      # blew past the cap and flooded the check with ~90 unrelated pre-existing violations.
      # --new-from-rev computes the diff via local git instead (no API, no line cap) —
      # requires fetch-depth: 0 above so origin/main is resolvable.
      # 10m, not 5m: a wide diff (e.g. one touching session/tmux) took ~310s and
      # tripped the 5m limit right after reporting "0 issues" -- a runner-speed
      # timeout, not a finding. Matches the full-lint step's 10m above.
      - name: golangci-lint (complexity/size/duplication gate — new code only)
        if: ${{ !cancelled() }}
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          args: --timeout=10m --max-issues-per-linter=0 --max-same-issues=0 --enable=gocyclo,gocognit,funlen,revive,dupl --new-from-rev=origin/main
          skip-cache: false
          only-new-issues: false

      # Project-specific go/analysis passes in tools/lint (norawexec, notimesleeptest, ...).
      # Not covered by golangci-lint; also runs under `make lint` and `make ci`.
      - name: Custom lint (tools/lint analyzers)
        if: ${{ !cancelled() }}
        run: make lint-custom

      - name: Import cycle check
        if: ${{ !cancelled() }}
        run: go build ./...

      - name: Check formatting (PR-changed files only)
        if: ${{ !cancelled() }}
        run: |
          # Only check files modified in this PR to avoid pre-existing issues in
          # untouched files (which may have been formatted with an older gofmt).
          # On push-to-main (no PR), fall back to full repo check.
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD -- '*.go' 2>/dev/null | grep '\.go$' || true)
          else
            CHANGED=$(gofmt -l .)
          fi
          if [ -z "$CHANGED" ]; then
            echo "No Go files to format-check"
            exit 0
          fi
          UNFORMATTED=$(echo "$CHANGED" | xargs gofmt -l 2>/dev/null || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files modified in this PR are not gofmt formatted:"
            echo "$UNFORMATTED"
            echo ""
            echo "Fix by running: gofmt -w \$(git diff --name-only origin/main...HEAD -- '*.go')"
            exit 1
          fi
          echo "All changed Go files are properly formatted"

      # ── web lint (was the separate web-lint job; same checkout/codegen/bun install as above) ──
      - name: Jest
        if: ${{ !cancelled() }}
        working-directory: web-app
        run: npx jest --ci --maxWorkers=4

      # Codemod liveness tests (node --test, no Jest project yet); needs the pinned ast-grep from bun install.
      - name: Codemod tests
        if: ${{ !cancelled() }}
        working-directory: web-app
        run: bun run test:codemods

      # jscpd (web-app/src duplication) — blocking (2026-08-24). Config lives in
      # web-app/.jscpd.json: minLines/minTokens tuned to 20/200 (empirically verified —
      # every finding at that size across the whole repo was real, actionable duplication,
      # not boilerplate/token noise), plus a 0.1% --threshold. Unlike golangci-lint's
      # --new-from-rev, jscpd has no native git-diff scoping, so this is a ratchet against
      # an absolute threshold rather than new-code-only — the threshold sits just above the
      # ~0.09% baseline that's irreducible (jest.mock(...) registration calls can't be
      # extracted into a shared function; babel-jest hoists them per-file), not at zero.
      # Long-term, true diff-aware cross-file duplicate detection belongs in kibitzer
      # (github.com/tstapler/kibitzer) — see tstapler/kibitzer#28.
      - name: jscpd (web-app duplication)
        if: ${{ !cancelled() }}
        working-directory: web-app
        run: bun run lint:duplicates

      # Soft-timeout wrapper (16m, below this job's hard timeout-minutes ceiling):
      # this is this job's longest-running step. The whole original step body is wrapped
      # unchanged in a function so `timeout` can bound it as a single command.
      # keep this marker prefix in sync with ciBudgetExceededMarker in server/services/github_webhook_pr_fix.go
      - name: ESLint (no-100vh, mobile regression rules)
        if: ${{ !cancelled() }}
        working-directory: web-app
        run: |
          run_eslint() {
            # Only lint files changed by this push/PR, failing on any warning there — so the
            # repo's ~1450 pre-existing warnings do not block unrelated changes. Push events
            # diff against github.event.before (the commit before this push); PRs and
            # pushes share one code path below.
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            if [ -z "$BASE_SHA" ]; then
              CANDIDATE="${{ github.event.before }}"
              # event.before is all-zeros on a new branch's first push (no prior commit to
              # diff against) — fall back to a full scan in that case, same as before.
              if [ -n "$CANDIDATE" ] && [ "$CANDIDATE" != "0000000000000000000000000000000000000000" ] \
                && git cat-file -e "$CANDIDATE" 2>/dev/null; then
                BASE_SHA="$CANDIDATE"
              fi
            fi
            if [ -n "$BASE_SHA" ]; then
              # Pathspecs are resolved relative to cwd (this step's
              # working-directory: web-app), but git diff --name-only always
              # prints repo-root-relative paths -- so 'web-app/**.ts' here
              # looked for web-app/web-app/**.ts and never matched anything,
              # silently no-op'ing this entire step on every run (found
              # 2026-09-04: verified by diffing two real historical commits
              # with 44 actual TS/TSX changes between them -- the old
              # pathspec matched 0, '**.ts'/'**.tsx' matched all 44).
              CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD \
                -- '**.ts' '**.tsx' 2>/dev/null \
                | grep -E '\.(ts|tsx)$' | sed 's|^web-app/||' || true)
              if [ -z "$CHANGED" ]; then
                echo "No TS/TSX files changed — skipping ESLint"
                exit 0
              fi
              # Any warning in a changed file fails (--max-warnings 0, scripts/eslint-gate.sh).
              # Files deleted by the diff are dropped; eslint errors on a missing path.
              FILES=()
              while IFS= read -r f; do
                [ -n "$f" ] && [ -f "$f" ] && FILES+=("$f")
              done <<< "$CHANGED"
              if [ "${#FILES[@]}" -eq 0 ]; then
                echo "Changed TS/TSX files were all deleted — skipping ESLint"
                exit 0
              fi
              bash scripts/eslint-gate.sh "${FILES[@]}"
            else
              # Whole-repo run: errors fail, the ~1450 pre-existing warnings do not.
              bun run lint:eslint
            fi
          }
          export -f run_eslint
          timeout 16m bash -c run_eslint || { echo "::error::CI-BUDGET-EXCEEDED: 'web-lint' exceeded its 16m budget"; echo "CI-BUDGET-EXCEEDED: 'web-lint' exceeded its 16m budget" >> "$GITHUB_STEP_SUMMARY"; exit 1; }

      - name: CSS lint (stylelint + undefined variable check)
        if: ${{ !cancelled() }}
        working-directory: web-app
        run: bun run lint:css

      - name: Validate feature catalog (typed feature registry)
        if: ${{ !cancelled() }}
        working-directory: web-app
        run: |
          # 1. TypeScript compile check on the features catalog — catches unknown FeatureId references
          node_modules/.bin/tsc --noEmit --project tsconfig.node.json
          # 2. Runtime catalog validation — catches features with empty testIds
          bun run validate-catalog
