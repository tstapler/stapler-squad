name: Build

on:
  push:
    branches: [ main ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'install.sh'
      - 'proto/**'
      - 'web-app/src/**'
      - 'web-app/package.json'
      - 'web-app/pnpm-lock.yaml'
      - '.github/workflows/build.yml'
      - '.github/actions/prepare/**'
      - '.gitmodules'
      - 'third_party/tmux/**'
  workflow_dispatch:
  # No paths: filter here (unlike push above) — branch protection requires the
  # "Test" job's status check, and a workflow that never triggers for a given
  # PR never posts ANY status for that check, which leaves GitHub's required-
  # check gate permanently "expected, never reported" instead of skipped-and-
  # passing — blocking merge forever regardless of what else passed (see PR
  # #618/#619). A job *skipped* via `if:` counts as a passing status for
  # required checks (documented GitHub Actions behavior; already relied on by
  # e2e-video.yml's detect-feature-changes gate), so detect-changes below
  # moves the same path-relevance check from the trigger into a job condition
  # instead, preserving "skip the expensive jobs for an irrelevant PR" while
  # still letting the required check resolve to something GitHub can read.
  # push (above) keeps its paths: filter untouched — a push to main that
  # never triggers this workflow at all isn't blocked by anything, since
  # there's no PR being merged for it to gate.
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # detect-changes: PR-only relevance gate — see the pull_request trigger's
  # comment above for why this lives here instead of a paths: filter. Mirrors
  # the same path list the old pull_request paths: filter used to have.
  # ─────────────────────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Relevant Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Go/proto/web-app source or build-tooling changes
        id: detect
        run: |
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '\.go$|^go\.(mod|sum)$|^Makefile$|^install\.sh$|^proto/|^web-app/src/|^web-app/package\.json$|^web-app/pnpm-lock\.yaml$|^\.github/workflows/build\.yml$|^\.github/actions/prepare/|^\.gitmodules$|^third_party/tmux/'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # prepare: generate proto code and build web UI once, share as artifacts.
  # Both test and build matrix download these instead of re-running the pipeline.
  # ─────────────────────────────────────────────────────────────────────────────
  prepare:
    name: Generate & Build Web UI
    runs-on: ubuntu-latest
    needs: detect-changes
    # always() is required, not decorative: a job with `needs:` gets an
    # implicit success()-of-needs check ANDed into ANY if: you write, unless
    # your if: itself calls a status function (always/success/failure/
    # cancelled). detect-changes is *skipped* (not run) on every push/
    # workflow_dispatch event, and skipped fails the implicit success()
    # check — so without always() here, this job (and everything chained
    # off it) would silently skip on every push to main and manual
    # workflow_dispatch, not just irrelevant PRs. Confirmed via GitHub's
    # own docs and multiple actions/runner issues describing this exact
    # gotcha (e.g. actions/runner#2205).
    if: always() && (github.event_name != 'pull_request' || needs.detect-changes.outputs.relevant == 'true')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Generate protos and build web UI
        uses: ./.github/actions/prepare

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: generated-files
          path: |
            gen/
            session/ent/
            server/web/dist/
            session/ent/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # web-build-smoke: proves `make web-build` succeeds standalone on a bare
  # checkout, with none of the manual buf/pnpm pre-steps that `prepare` (above)
  # runs by hand. `prepare` bypasses the Makefile's own dependency graph, so it
  # cannot catch a missing prerequisite there (e.g. `web-app/out` not depending
  # on `proto-gen` — see #144). This job exercises the exact entry point
  # documented in CLAUDE.md/README (`make web-build`) the way a fresh clone
  # actually would.
  # ─────────────────────────────────────────────────────────────────────────────
  web-build-smoke:
    name: make web-build (clean checkout smoke test)
    runs-on: ubuntu-latest
    needs: detect-changes
    # always() is required, not decorative: a job with `needs:` gets an
    # implicit success()-of-needs check ANDed into ANY if: you write, unless
    # your if: itself calls a status function (always/success/failure/
    # cancelled). detect-changes is *skipped* (not run) on every push/
    # workflow_dispatch event, and skipped fails the implicit success()
    # check — so without always() here, this job (and everything chained
    # off it) would silently skip on every push to main and manual
    # workflow_dispatch, not just irrelevant PRs. Confirmed via GitHub's
    # own docs and multiple actions/runner issues describing this exact
    # gotcha (e.g. actions/runner#2205).
    if: always() && (github.event_name != 'pull_request' || needs.detect-changes.outputs.relevant == 'true')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.27.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: web-app/pnpm-lock.yaml

      # See .github/actions/prepare/action.yml's "Cache buf binary" step for
      # why this caches the whole tool-cache "buf" dir rather than a specific
      # .../<version>/<arch> subpath.
      - name: Cache buf binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/buf
          key: buf-1.41.0-${{ runner.os }}-${{ runner.arch }}

      - name: Set up buf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: '1.41.0'
          setup_only: 'true'

      # See .github/actions/prepare/action.yml for why this cache exists.
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: web-app/.next/cache
          key: nextjs-smoke-${{ runner.os }}-${{ hashFiles('web-app/pnpm-lock.yaml') }}-${{ hashFiles('web-app/src/**') }}
          restore-keys: |
            nextjs-smoke-${{ runner.os }}-${{ hashFiles('web-app/pnpm-lock.yaml') }}-
            nextjs-smoke-${{ runner.os }}-

      - name: make web-build (no manual pre-steps)
        run: make web-build

      - name: Verify proto bindings were generated
        run: test -f web-app/src/gen/session/v1/session_pb.ts

  # ─────────────────────────────────────────────────────────────────────────────
  # test: runs on linux/amd64 only. Does NOT gate the build matrix — binaries
  # are published regardless of test failures so the build artifact is always
  # available for manual verification. Lint runs in its own workflow (lint.yml).
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: prepare
    # Many tests across server/services, server/mcp, session, session/git, and
    # session/vc shell out to `git commit` against repos they create in
    # TempDir(). Those tests never set a local git identity (unlike
    # session/git/worktree_creation_test.go's go-git helper, which passes an
    # explicit Author signature), so they rely on the runner's global git
    # config having user.name/user.email set. Local dev machines already have
    # that configured, which is why this only surfaces in CI: GitHub-hosted
    # runners ship with no global git identity, so every such test fails with
    # "fatal: empty ident name ... not allowed". Set it once at the job level
    # rather than patching each test's helper individually.
    env:
      GIT_AUTHOR_NAME: stapler-squad-ci
      GIT_AUTHOR_EMAIL: ci@stapler-squad.invalid
      GIT_COMMITTER_NAME: stapler-squad-ci
      GIT_COMMITTER_EMAIL: ci@stapler-squad.invalid
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          name: generated-files

      - name: Install tmux build dependencies + socat
        # socat is required by server/services' real-shell approval-relay tests
        # (TestRemoteApprovalHookCommand_*) -- these execute the actual
        # generated hook command through a real shell rather than simulating
        # its wire protocol in Go, specifically so a bug in the command
        # itself (as opposed to the Go code that builds it) gets caught.
        # Without socat on PATH, those tests silently skip instead of
        # running -- see remoteApprovalWriteTool's doc comment
        # (server/services/hook_injector.go) for the production bug this
        # class of test exists to catch.
        run: sudo apt-get install -y automake libevent-dev libncurses-dev pkg-config socat

      - name: Cache pinned tmux binary
        uses: actions/cache@v4
        id: tmux-cache
        with:
          path: bin/tmux
          key: tmux-3.4-${{ runner.os }}-v1

      - name: Build pinned tmux 3.4
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-tmux.sh

      - name: Run tests with coverage (pinned tmux 3.4)
        # STAPLER_SQUAD_TMUX_CREATE_TIMEOUT_SECONDS: production default is 10s
        # (session/tmux/tmux.go's sessionCreateTimeoutDefault) -- this only
        # widens the budget for this CI job, where a fully-loaded runner
        # running every package's -race suite concurrently can occasionally
        # exceed 10s of pure CPU-scheduling delay spinning up even an
        # isolated tmux -L server, not lock contention. See tmux.go's
        # sessionCreateTimeout doc comment for the incident this closes.
        env:
          STAPLER_SQUAD_TMUX_CREATE_TIMEOUT_SECONDS: "30"
        run: |
          # -timeout=20m: explicit budget instead of relying on go test's silent 10m
          # default. server/services previously tripped that default timeout with
          # only an opaque "test timed out after 10m0s" — no goroutine/fd context —
          # making it hard to tell a genuine hang apart from cumulative suite
          # duration under -race. See BUG-067 and DeleteSession's cleanup
          # goroutine leak fix (deleteCleanupWG in server/services/session_service.go).
          #
          # Split into two invocations, mirroring the Makefile's test/test-race/
          # test-coverage targets (see BUG-051): session, session/mux, and
          # session/tmux fork real tmux subprocesses at high t.Parallel() fan-out,
          # so they were run separately from the rest of the suite. They no
          # longer need -p 1 against each other: the flake that justified it
          # was TestBuildClaudeCommand_LargePromptUsesTempFileNotInline
          # overriding promptArg's background cleanup delay to 10ms in a test
          # that doesn't exercise cleanup timing, racing its own os.ReadFile
          # against that goroutine under CPU contention (see
          # session/instance_tmux_test.go). Fixed by leaving the real 30s
          # default delay in place; validated with a clean -race run of all
          # three packages together sans -p 1.
          TMUX_TEST_PKGS="./session ./session/mux ./session/tmux"
          REST_TEST_PKGS="$(go list ./server/... ./session/... ./config/... | grep -vE '^github\.com/tstapler/stapler-squad/(session|session/mux|session/tmux)$')"
          TMUX_BIN="$(pwd)/bin/tmux" go test -race -timeout=20m -coverprofile=coverage.tmux.out \
            -covermode=atomic $TMUX_TEST_PKGS \
            || (TMUX_BIN="$(pwd)/bin/tmux" go test -race -timeout=20m -v $TMUX_TEST_PKGS; exit 1)
          TMUX_BIN="$(pwd)/bin/tmux" go test -race -timeout=20m -coverprofile=coverage.rest.out \
            -covermode=atomic $REST_TEST_PKGS \
            || (TMUX_BIN="$(pwd)/bin/tmux" go test -race -timeout=20m -v $REST_TEST_PKGS; exit 1)
          head -n 1 coverage.tmux.out > coverage.out
          tail -q -n +2 coverage.tmux.out coverage.rest.out >> coverage.out
          rm -f coverage.tmux.out coverage.rest.out

      - name: Run scanner unit tests
        run: cd tools/scanner && go test ./...

      - name: Coverage gate
        uses: vladopajic/go-test-coverage@v2
        with:
          profile: coverage.out
          global-threshold: 60
          local-threshold: 0
          badge-file-name: coverage.svg

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.27.0

      - name: Set up Node.js (for coverage report)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run CI comment-gate unit tests
        run: cd tools/ci-gates && pnpm install --silent && pnpm test

      - name: Check new RPCs have tests
        run: |
          make registry-generate
          git diff --exit-code docs/registry/features/ || {
            echo "Registry out of date — run: make registry-generate"
            exit 1
          }
          NEW_FILES=$(git diff --name-only origin/main -- 'docs/registry/features/backend/**' 2>/dev/null || true)
          for f in $NEW_FILES; do
            if [ -f "$f" ] && jq -e '.tested == false' "$f" > /dev/null 2>&1; then
              echo "ERROR: New RPC $f has no test (tested: false). Add a test and set tested: true."
              exit 1
            fi
          done
          # Also validate the typed catalog
          cd web-app && pnpm install --frozen-lockfile --silent && pnpm run validate-catalog

      # Runs after "Check new RPCs have tests" deliberately: that step is what
      # actually generates docs/registry/backend-features.json (via `make
      # registry-generate`, a gitignored artifact — see .gitignore:98). This
      # step used to run before it and always found no registry file,
      # producing "Feature E2E coverage: N/A" on every single run regardless
      # of the actionability gate below — confirmed live via PR #462's first
      # review pass. Root-caused and fixed by reordering rather than papering
      # over the symptom in the gate logic.
      - name: Generate feature E2E coverage report
        id: coverage
        run: |
          cd tools/coverage && pnpm install --silent
          OUTPUT=$(npx ts-node feature-coverage.ts ../../docs/registry/backend-features.json '../../tests/e2e/**/*.spec.ts' 2>&1)
          echo "$OUTPUT"
          SUMMARY=$(echo "$OUTPUT" | grep 'Feature E2E coverage:' | head -1 || echo "Feature E2E coverage: N/A")
          echo "summary=${SUMMARY}" >> $GITHUB_OUTPUT
          PCT=$(SUMMARY="$SUMMARY" node -e "console.log(require('../ci-gates/coverage-delta.js').parseCoveragePct(process.env.SUMMARY) ?? '')")
          echo "pct=${PCT:-}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Post feature coverage PR comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          COVERAGE_SUMMARY: ${{ steps.coverage.outputs.summary }}
          COVERAGE_PCT: ${{ steps.coverage.outputs.pct }}
        with:
          script: |
            const { isActionable, buildMarker, findExisting } = require('./tools/ci-gates/coverage-delta.js');
            const summary = process.env.COVERAGE_SUMMARY || 'Feature coverage report unavailable';
            const currentPct = parseFloat(process.env.COVERAGE_PCT);

            // A NaN currentPct means the tool genuinely couldn't compute a
            // number even with the registry available (a real failure, not
            // "no change yet") — there's nothing actionable to report, so
            // this skips rather than posting an uninformative comment.
            if (isNaN(currentPct)) {
              core.warning('Feature coverage report produced no parseable percentage; skipping comment.');
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Feature E2E Coverage\n${summary}\n`);
              return;
            }

            // Recency guard (resolves adversarial-review Blocker 1 for this
            // workflow): build.yml also runs on push-to-main with 5 unrelated
            // jobs, so it can't take a workflow-level concurrency block the
            // way ux-analysis.yml/e2e-video.yml do without cancelling those
            // too — instead, skip only this mutation if a newer push has
            // already superseded the commit this run was triggered for.
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            if (pr.data.head.sha !== context.payload.pull_request.head.sha) {
              core.info('Skipping feature-coverage comment: a newer push has superseded this run.');
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = findExisting(comments);

            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Feature E2E Coverage\n${summary}\n`);

            if (!isActionable({ existingBody: existing ? existing.body : null, currentPct })) {
              // Unchanged coverage is the steady state, not a resolved
              // problem — left untouched, never deleted (see coverage-delta.js).
              return;
            }

            const marker = buildMarker(currentPct);
            const body = `${marker}\n## 📊 Feature E2E Coverage\n\n${summary}\n\n> Run \`make e2e-report\` locally to view the full Allure report.`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # Benchmark comparison on PRs is handled by benchmark.yml (tier-1 job),
      # which posts a PR comment via benchstat. Removed dead step that ran
      # BenchmarkNavigation (a non-existent benchmark) for 15 min per PR.

  # ─────────────────────────────────────────────────────────────────────────────
  # pty-race-regression: PTY-triple (ptmx/attachCmd/attachCmdWaitOnce) race fix
  # regression gate, split out of the `test` job so it runs in parallel with the
  # main coverage run instead of stacking behind it. These tests were validated
  # locally at -count=20/-count=50 during development (see
  # project_plans/tmux-ptmx-race-fix/), but a plain -race run only executes each
  # test once — not enough repetition to reliably catch a reintroduced race in a
  # timing-sensitive test. Run them amplified here so CI keeps the same
  # confidence level the fix was originally verified with.
  # ─────────────────────────────────────────────────────────────────────────────
  pty-race-regression:
    name: PTY-triple race regression (amplified repetitions)
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          name: generated-files

      - name: Install tmux build dependencies
        run: sudo apt-get install -y automake libevent-dev libncurses-dev pkg-config

      - name: Cache pinned tmux binary
        uses: actions/cache@v4
        id: tmux-cache
        with:
          path: bin/tmux
          key: tmux-3.4-${{ runner.os }}-v1

      - name: Build pinned tmux 3.4
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-tmux.sh

      - name: Install go-stress
        run: go install golang.org/x/tools/cmd/stress@v0.47.0

      - name: Compile PTY-triple regression test binaries
        run: |
          go test -race -c -o server.test ./server
          go test -race -c -o tmux.test ./session/tmux

      - name: PTY-triple race regression (parallel amplification via go-stress)
        # Same tmux-under-CPU-contention rationale as the "test" job's "Run tests
        # with coverage" step -- repeated runs spawn real tmux servers over and
        # over, so it needs the same widened create-timeout headroom.
        #
        # Replaced serial `go test -count=20` with golang.org/x/tools/cmd/stress
        # (github.com/dvyukov's original "stress" tool): it runs the compiled
        # -race test binary in parallel across all CPUs in a loop for a fixed
        # wall-clock budget, printing pass/fail counts and stopping immediately on
        # the first failure. Same goal as -count=20 -- enough repetition to
        # reliably catch a reintroduced race in a timing-sensitive test -- but on
        # a 4-core runner it packs far more total repetitions into the 90s budget
        # below than 20 serial reps took, and it fails fast on the first bad run
        # instead of always waiting for all 20 to finish.
        #
        # 90s budget: chosen as headroom above the ~63s a single ./server/...
        # suite run took after the 2026-08-19 SQLite lock-contention fix (see
        # project_plans/tmux-ptmx-race-fix/) -- comfortably enough time for
        # several full parallel passes per binary. `|| [ $? -eq 124 ]` treats
        # `timeout`'s SIGTERM-at-budget-expiry (exit 124, i.e. "ran clean for the
        # whole budget") as success; any other nonzero exit is a real failure
        # from stress and fails the step.
        env:
          STAPLER_SQUAD_TMUX_CREATE_TIMEOUT_SECONDS: "30"
        run: |
          TMUX_BIN="$(pwd)/bin/tmux" timeout 90s stress ./server.test \
            -test.run='TestServer_should_WriteUnchangedHookURL_When_StartedOnExplicitPort|TestSessionService_CreateThenImmediateDelete_NoDataRace' \
            || [ $? -eq 124 ]
          TMUX_BIN="$(pwd)/bin/tmux" timeout 90s stress ./tmux.test \
            -test.run='TestGetPTY_ClosePTYAndAttachCmd_ConcurrentAccessIsSerialized|TestDetach_ConcurrentWithGetPTY_NoDeadlock|TestDetachSafely_ConcurrentWithGetPTY_NoDeadlock' \
            || [ $? -eq 124 ]

  # ─────────────────────────────────────────────────────────────────────────────
  # integration-coverage: advisory `-tags integration` run, split out of the
  # `test` job so it runs in parallel with the main coverage run instead of
  # stacking behind it. Never gates the build (always continue-on-error) — see
  # server/services' integration test docs for scope.
  #
  # Previously built and launched a separate `stapler-squad-cov` binary under
  # GOCOVERDIR to capture runtime coverage from a live process. Removed
  # 2026-08-22: none of the 4 `//go:build integration` test files actually talk
  # to that background process over HTTP -- server/mcp/server_integration_test.go
  # builds and launches its own binary directly, and the tmux/mcp integration
  # tests shell out to the real `tmux` CLI, not to a live stapler-squad server.
  # The background binary was only ever measuring its own idle startup path.
  # Standard in-process `-coverprofile` (same mechanism the `test` job already
  # uses) captures everything these tests actually exercise, with no live
  # process to launch or reap.
  # ─────────────────────────────────────────────────────────────────────────────
  integration-coverage:
    name: Integration coverage (advisory)
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          name: generated-files

      - name: Install tmux build dependencies + socat
        run: sudo apt-get install -y automake libevent-dev libncurses-dev pkg-config socat

      - name: Cache pinned tmux binary
        uses: actions/cache@v4
        id: tmux-cache
        with:
          path: bin/tmux
          key: tmux-3.4-${{ runner.os }}-v1

      - name: Build pinned tmux 3.4
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-tmux.sh

      - name: Integration coverage (advisory)
        # Same tmux-under-CPU-contention rationale as the "test" job's "Run tests
        # with coverage" step -- this step's `-tags integration` run spawns real
        # tmux servers under the same contention.
        env:
          STAPLER_SQUAD_TMUX_CREATE_TIMEOUT_SECONDS: "30"
        run: |
          TMUX_BIN="$(pwd)/bin/tmux" go test -race -tags integration \
            -coverprofile=integration.out -covermode=atomic ./... || true
        continue-on-error: true

      - name: Upload integration coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage
          path: integration.out
          if-no-files-found: ignore
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # build: cross-compiles for all supported platforms in parallel.
  # Needs only prepare (not test) so binary artifacts are always uploaded.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          name: generated-files

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          CGO_CFLAGS: "-Wno-discarded-qualifiers"
        run: |
          BINARY_NAME=stapler-squad
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME=$BINARY_NAME.exe
          fi
          VERSION=$(git describe --tags --always --dirty 2>/dev/null | sed 's/^v//' || git rev-parse --short HEAD)
          go build -v -ldflags "-X main.version=${VERSION}" -o build/${{ matrix.goos }}_${{ matrix.goarch }}/$BINARY_NAME .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stapler-squad-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/${{ matrix.goos }}_${{ matrix.goarch }}/*
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # install-check: builds the native linux binary and verifies it runs.
  # This mirrors the path taken by `install.sh --from-source` and `make build`.
  # ─────────────────────────────────────────────────────────────────────────────
  install-check:
    name: Install Check
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          name: generated-files

      - name: Build binary (native)
        run: go build -o stapler-squad .

      - name: Verify binary runs
        run: ./stapler-squad version

  # ─────────────────────────────────────────────────────────────────────────────
  # benchmark-gate: runs on main-merge only. Fails if any benchmark regresses
  # more than 20%. PRs get advisory comments only via benchmark.yml (never blocked).
  # 20% threshold is deliberate — tmux-touching benchmarks have 15-25% natural
  # variance on shared runners. count=5 + utest for statistical significance.
  #
  # Baseline persisted via GitHub Actions cache (key "bench-gate-<run_id>",
  # restored by "bench-gate-" prefix match) — not committed to git; a prior
  # version of this job committed the baseline to `benchmarks/` on every
  # push to main, which flooded the commit history for very little value.
  # Uses same concurrency group as benchmark.yml to prevent 5 concurrent
  # runs colliding.
  # ─────────────────────────────────────────────────────────────────────────────
  benchmark-gate:
    name: Benchmark Gate (main only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only depends on `prepare`'s generated-files artifact (downloaded below) --
    # never consumes anything `test` produces, so it runs in parallel with `test`
    # instead of waiting on it.
    needs: prepare
    permissions:
      contents: read
      pull-requests: read
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: baseline-push-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          name: generated-files

      - name: Install tmux build dependencies
        run: sudo apt-get install -y automake libevent-dev libncurses-dev pkg-config

      - name: Cache pinned tmux binary
        uses: actions/cache@v4
        id: tmux-cache
        with:
          path: bin/tmux
          key: tmux-3.4-${{ runner.os }}-v1

      - name: Build pinned tmux 3.4
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-tmux.sh

      - name: Run benchmarks (count=5 for significance)
        env:
          # production default is 10s; CI runners are slower/noisier, and the
          # benchmark job's module cache is cold on first run (never populated
          # by a prior success), so tmux session creation needs more headroom
          STAPLER_SQUAD_TMUX_CREATE_TIMEOUT_SECONDS: "30"
        run: |
          # -run='^$'  benchmarks only (no tests)
          # -short     skip integration benchmarks that spawn real processes
          # -count=5   statistically meaningful for ≥20% regression detection
          # -timeout=10m per package (search/unfinished are legitimately slow)
          # | tee      keeps step output visible live instead of buffered
          #            until completion, so a stall shows its last line
          TMUX_BIN="$(pwd)/bin/tmux" go test -bench=. -benchmem -count=5 \
            -run='^$' -short ./... -timeout=10m | tee bench-current.txt

      - name: Install benchstat (pinned)
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260312031701-16a31bc5fbd0

      - name: Restore benchmark baseline
        uses: actions/cache/restore@v4
        with:
          path: benchmarks/go/benchmark-gate-baseline.txt
          key: bench-gate-
          restore-keys: |
            bench-gate-

      - name: Compare against baseline (20% threshold)
        run: |
          BASELINE=benchmarks/go/benchmark-gate-baseline.txt
          if [ ! -f "$BASELINE" ]; then
            echo "No baseline found — will be established on this run (no regression check)"
            exit 0
          fi
          benchstat -delta-test=utest "$BASELINE" bench-current.txt | tee bench-diff.txt
          # Catch regressions ≥20%: match +20.x through +9999.x (two+ digits, first two ≥ 20)
          if grep -E '\+([2-9][0-9]|[1-9][0-9]{2,})\.' bench-diff.txt | grep -v '±'; then
            echo "Benchmark regression ≥20% detected — see bench-diff.txt above"
            exit 1
          fi

      - name: Save benchmark baseline on success
        run: |
          mkdir -p benchmarks/go
          cp bench-current.txt benchmarks/go/benchmark-gate-baseline.txt

      - name: Persist baseline to cache on success
        uses: actions/cache/save@v4
        with:
          path: benchmarks/go/benchmark-gate-baseline.txt
          key: bench-gate-${{ github.run_id }}
