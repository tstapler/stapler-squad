name: Build

on:
  push:
    branches: [ main ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'install.sh'
      - 'proto/**'
      - 'web-app/src/**'
      - 'web-app/package.json'
      - 'web-app/bun.lock'
      - 'web-app/build/**'
      - 'web-app/index.html'
      - 'web-app/patches/**'
      - 'web-app/bunfig.toml'
      - 'web-app/scripts/ci/**'
      - 'server/middleware/testdata/**'
      - '.bun-version'
      - '.github/workflows/build.yml'
      - '.github/actions/prepare/**'
      - '.gitmodules'
      - 'third_party/tmux/**'
      - 'tests/e2e/**'
      - 'web-app/tests/e2e/**'
  workflow_dispatch:
  # No paths: filter here (unlike push above): detect-changes below moves the
  # path-relevance check from the trigger into a job condition, so an irrelevant
  # PR still gets a resolved (skipped) status for each job instead of none.
  # push (above) keeps its paths: filter; a push to main that never triggers
  # this workflow isn't gating any PR. main has no branch protection, so no
  # check in this file is currently required.
  pull_request:
    branches: [ main ]
    # Docs/planning-only PRs trigger nothing here (a skipped job still shows as a check; the old
    # shape was ~25 skipped checks per docs PR). docs/registry/** JSON is not ignored, but
    # detect-changes does not list it either, so a registry-only PR already skipped test-affected.
    paths-ignore:
      - 'docs/**/*.md'
      - 'docs/*.md'
      - 'project_plans/**'
      - 'website/**'
      - '*.md'

permissions:
  contents: read
  pull-requests: write

# PR runs cancel a superseded commit's in-flight jobs; main-branch runs never
# do, so benchmark-gate's actions/cache/save step is never cancelled mid-write.
# benchmark-gate's own job-level `concurrency: {group: baseline-push-main, ...}`
# (below) is a separate group from this workflow-level one and still applies
# on top of it — a job's own concurrency block doesn't get overridden by the
# workflow-level block, per GitHub's documented precedence.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Single knob for the e2e shard count: e2e-env turns it into the matrix, and every shard passes
# it to `--shard=N/<total>`. Lowering it trades wall time for fewer runner jobs; measured per-shard
# fixed overhead is ~1 min against ~22 min of tests, so total runner-minutes barely move, and the
# slowest shards already run ~30 of their 40 min budget (project_plans/e2e-test-parallelization/decisions/).
env:
  E2E_SHARD_TOTAL: 10

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # detect-changes: PR-only relevance gate — see the pull_request trigger's
  # comment above for why this lives here instead of a paths: filter. Mirrors
  # the same path list the old pull_request paths: filter used to have.
  # ─────────────────────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Relevant Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      # No checkout: this repo's .git pack data is ~16GB (accumulated demo
      # GIFs/videos in history), so the `fetch-depth: 0` full-history clone
      # this job previously did just to diff file paths took ~4.4m on its
      # own -- the dominant cost of this job and the first thing every other
      # job in the workflow waits on. The compare API gives the same
      # three-dot (merge-base) file list with no clone at all.
      - name: Detect Go/proto/web-app source or build-tooling changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHANGED=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '\.go$|^go\.(mod|sum)$|^Makefile$|^install\.sh$|^proto/|^web-app/src/|^web-app/build/|^web-app/index\.html$|^web-app/patches/|^web-app/bunfig\.toml$|^web-app/scripts/ci/|^tests/e2e/|^scripts/e2e-baseline-compare\.ts$|^server/middleware/testdata/|^\.bun-version$|^web-app/package\.json$|^web-app/bun\.lock$|^\.github/workflows/build\.yml$|^\.github/actions/prepare/|^\.gitmodules$|^third_party/tmux/|^web-app/tests/e2e/'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # prepare: generate proto code and build web UI once, share as artifacts.
  # Both test and build matrix download these instead of re-running the pipeline.
  # ─────────────────────────────────────────────────────────────────────────────
  prepare:
    name: Generate & Build Web UI
    needs: detect-changes
    # Deviation from plan.md Task 4.1.1a's note ("workflow_call jobs can carry
    # timeout-minutes: at the calling-job level too"): actionlint (and GitHub's
    # own schema) reject timeout-minutes on a job that calls a reusable
    # workflow via `uses:` — only name/uses/with/secrets/needs/if/permissions
    # are allowed there. _prepare.yml's own `prepare` job has no
    # timeout-minutes either; a runaway here is still bounded by GitHub's
    # default 360m job cap, same as before this epic. No hard ceiling was
    # feasible to add at this call site.
    # always() is required, not decorative: a job with `needs:` gets an
    # implicit success()-of-needs check ANDed into ANY if: you write, unless
    # your if: itself calls a status function (always/success/failure/
    # cancelled). detect-changes is *skipped* (not run) on every push/
    # workflow_dispatch event, and skipped fails the implicit success()
    # check — so without always() here, this job (and everything chained
    # off it) would silently skip on every push to main and manual
    # workflow_dispatch, not just irrelevant PRs. Confirmed via GitHub's
    # own docs and multiple actions/runner issues describing this exact
    # gotcha (e.g. actions/runner#2205).
    if: always() && (github.event_name != 'pull_request' || needs.detect-changes.outputs.relevant == 'true')
    uses: ./.github/workflows/_prepare.yml

  # ─────────────────────────────────────────────────────────────────────────────
  # web-checks: the former web-build-smoke-next, web-build-smoke-bun, built-assets-guard,
  # storybook-build and web-supply-chain jobs run as sequential steps of ONE job (five checks
  # per PR became one). Each phase keeps its original intent:
  #   - smoke-next / smoke-bun prove `make web-build` works on a bare checkout, with none of
  #     the manual buf/bun pre-steps `prepare` runs by hand (a missing Makefile prerequisite,
  #     e.g. `web-app/out` not depending on `proto-gen`, see #144). `git clean -fdx` between the
  #     phases restores the "bare checkout" state; the Bun/Next caches live outside the tree
  #     or are restored per phase, so they are unaffected.
  #   - smoke-next also builds Storybook (webpackFinal needs babel-loader; an undeclared
  #     transitive dep fails here under bunfig's isolated linker). That covers the old
  #     storybook-build job, which only ran a subset of the same build.
  #   - built-assets guard: every file of the Bun build must be auth-exempt or on the public
  #     allowlist (server/middleware/built_assets_test.go); REQUIRE_BUILT_OUT turns a missing
  #     out/ into a failure instead of a skip.
  #   - supply chain: the install must resolve the same screened tree twice, with no github:
  #     source, banned version or no-op trustedDependencies entry (Story 6.10). Runs last, on
  #     the tree the smoke phases built.
  # A failed phase does not hide the later ones (`!cancelled()` + the `ready` gate below).
  # ─────────────────────────────────────────────────────────────────────────────
  web-checks:
    name: Web build checks (smoke next+bun, built-assets, supply chain)
    runs-on: ubuntu-latest
    needs: detect-changes
    timeout-minutes: 45
    # always() for the same reason as `prepare` above (detect-changes is skipped off pull_request).
    if: always() && (github.event_name != 'pull_request' || needs.detect-changes.outputs.relevant == 'true')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      # Pinned by commit SHA inside the composite action; reads .bun-version.
      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # See .github/actions/prepare/action.yml's "Cache buf binary" step for why this caches the
      # whole tool-cache "buf" dir rather than a specific .../<version>/<arch> subpath.
      - name: Cache buf binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/buf
          key: buf-1.41.0-${{ runner.os }}-${{ runner.arch }}

      - name: Set up buf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: '1.41.0'
          setup_only: 'true'

      # Exact key, no restore-keys: a partial restore could keep a stale or unpatched `eval`
      # (oven-sh/bun#33520); the build's guard stage also fails loudly on that.
      - name: Cache shared node_modules
        uses: actions/cache@v4
        with:
          path: ~/.stapler-squad/shared-node-modules
          key: web-node-modules-${{ runner.os }}-${{ hashFiles('web-app/bun.lock', 'web-app/patches/**') }}

      - name: Restore Next.js build cache
        id: ready
        uses: actions/cache@v4
        with:
          path: web-app/.next/cache
          key: nextjs-smoke-${{ runner.os }}-${{ hashFiles('web-app/bun.lock') }}-${{ hashFiles('web-app/src/**') }}
          restore-keys: |
            nextjs-smoke-${{ runner.os }}-${{ hashFiles('web-app/bun.lock') }}-
            nextjs-smoke-${{ runner.os }}-

      # ── phase 1: Next smoke (+ Storybook) ──────────────────────────────────────
      - name: make web-build (no manual pre-steps)
        if: ${{ !cancelled() && steps.ready.conclusion == 'success' }}
        env:
          WEB_BUILD: next
        run: make web-build

      - name: Verify proto bindings were generated (next)
        if: ${{ !cancelled() && steps.ready.conclusion == 'success' }}
        run: test -f web-app/src/gen/session/v1/session_pb.ts

      - name: Build Storybook
        if: ${{ !cancelled() && steps.ready.conclusion == 'success' }}
        working-directory: web-app
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'
        run: bun run build-storybook

      # ── phase 2: Bun smoke, from a clean tree ───────────────────────────────────
      # Single -f: leaves the submodule checkouts alone.
      - name: Reset to a clean tree for the Bun smoke
        if: ${{ !cancelled() && steps.ready.conclusion == 'success' }}
        run: git clean -fdx -e web-app/.next/cache

      # Retried once: wall time is a budget (maxWallMs) and a loaded runner can miss it.
      - name: make web-build (WEB_BUILD=bun, unminified cutover default)
        if: ${{ !cancelled() && steps.ready.conclusion == 'success' }}
        env:
          WEB_BUILD: bun
          WEB_MINIFY: '0'
        run: make web-build || { echo "retrying once (host load)"; rm -rf web-app/out server/web/dist; make web-build; }

      - name: Verify proto bindings were generated (bun)
        if: ${{ !cancelled() && steps.ready.conclusion == 'success' }}
        run: test -f web-app/src/gen/session/v1/session_pb.ts

      # Byte budgets apply to the minified build (ADR-004); it is written outside web-app/out, so
      # it never reaches the embedded server/web/dist. build.ts runs verify-output itself.
      - name: Minified size build and budget check
        if: ${{ !cancelled() && steps.ready.conclusion == 'success' }}
        working-directory: web-app
        run: |
          bun build/build.ts --out .build/out-min --stats .build/stats-minified.json \
            || { echo "retrying once (host load)"; bun build/build.ts --out .build/out-min --stats .build/stats-minified.json; }

      - name: Write build stats to the step summary
        if: ${{ !cancelled() && steps.ready.conclusion == 'success' }}
        working-directory: web-app
        run: bun build/stats-cli.ts .build/stats.json .build/stats-minified.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-bun-stats
          path: |
            web-app/.build/stats.json
            web-app/.build/stats-minified.json
          if-no-files-found: warn

      # ── phase 3: auth-exemption walk of the Bun build (was built-assets-guard) ──
      # The guard tests exactly what would be embedded, read from web-app/out in this workspace.
      - name: Generate protobuf and ent code
        if: ${{ !cancelled() && steps.ready.conclusion == 'success' }}
        uses: ./.github/actions/prepare-stub

      - name: Walk every built file against the auth exemption
        if: ${{ !cancelled() && steps.ready.conclusion == 'success' }}
        env:
          REQUIRE_BUILT_OUT: '1'
        run: go test ./server/middleware -run 'TestBuiltAssets' -count=1 -v

      # ── phase 4: web-app install and dependency screen (was web-supply-chain) ───
      - name: Install (frozen)
        if: ${{ !cancelled() && steps.ready.conclusion == 'success' }}
        working-directory: web-app
        run: bun install --frozen-lockfile

      # bun#44713: a first plain install after a lockfile edit can still rewrite it.
      - name: Lockfile is stable across repeated installs
        if: ${{ !cancelled() && steps.ready.conclusion == 'success' }}
        working-directory: web-app
        run: |
          bun install
          bun install
          git diff --exit-code -- bun.lock

      - name: Dependency screen
        if: ${{ !cancelled() && steps.ready.conclusion == 'success' }}
        working-directory: web-app
        run: bun run check:dependency-screen

  # ─────────────────────────────────────────────────────────────────────────────
  # e2e-next: the full Playwright suite (every spec under tests/e2e/, every project) against
  # the Next build, using the harness's own isolated global-setup (dynamic free port,
  # PID-scoped temp dir -- never :8543). Runs on push to main / workflow_dispatch only, not on
  # pull_request: e2e-bun is the single PR e2e. Uploads its Playwright JSON report with
  # if: always() so e2e-bun's comparator can read it even when this job itself fails (plan
  # Story 0.1's gate rule judges a spec missing from the baseline against this same-run
  # report). Firefox/WebKit coverage lives in nightly.yml.
  # ─────────────────────────────────────────────────────────────────────────────
  # Resolves the Playwright version pinned by tests/e2e/bun.lock so the shards can run in the
  # matching official image (browsers + OS libraries preinstalled) instead of `apt-get` +
  # `playwright install --with-deps` on every shard runner.
  e2e-env:
    name: e2e environment (Playwright image tag)
    runs-on: ubuntu-latest
    needs: detect-changes
    timeout-minutes: 5
    if: always() && (github.event_name != 'pull_request' || needs.detect-changes.outputs.relevant == 'true')
    outputs:
      playwright-version: ${{ steps.pw.outputs.version }}
      shards: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tests/e2e/bun.lock
          sparse-checkout-cone-mode: false

      - name: Read pinned Playwright version
        id: pw
        run: |
          v=$(grep -oE '"@playwright/test@[0-9]+\.[0-9]+\.[0-9]+"' tests/e2e/bun.lock | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          [ -n "$v" ] || { echo "::error::could not read @playwright/test version from tests/e2e/bun.lock" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build shard matrix from E2E_SHARD_TOTAL
        id: shards
        run: |
          case "$E2E_SHARD_TOTAL" in ''|*[!0-9]*|0) echo "::error::E2E_SHARD_TOTAL must be a positive integer, got '$E2E_SHARD_TOTAL'" >&2; exit 1;; esac
          echo "matrix=$(jq -nc --argjson n "$E2E_SHARD_TOTAL" '[range(1; $n + 1)]')" >> "$GITHUB_OUTPUT"

  # Builds the Next-mode e2e binary once; the Next shards download it instead of each running
  # `go build` (prepare's artifact is already a Next-mode build, so a plain `go build` suffices).
  e2e-binary-next:
    name: e2e binary (Next build)
    runs-on: ubuntu-latest
    needs: [detect-changes, prepare]
    timeout-minutes: 20
    if: always() && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact-name }}

      - name: Build binary (Next build, from prepare's shared artifact)
        run: |
          go build -o stapler-squad .
          go build -o seed-demo ./tests/demo/seed
          go build -o seed-hidden ./tests/e2e/seed-hidden

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: e2e-binary-next
          path: |
            stapler-squad
            seed-demo
            seed-hidden
          if-no-files-found: error
          retention-days: 1

  e2e-next-shard:
    name: e2e (Next build) shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: [detect-changes, e2e-env, e2e-binary-next]
    if: always() && github.event_name != 'pull_request'
    timeout-minutes: 50
    # Official Playwright image: browsers and OS libraries are baked in, so there is no
    # apt-get / `playwright install` per shard. The tag comes from bun.lock via e2e-env.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.e2e-env.outputs.playwright-version }}-noble
      options: --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e-env.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Next binary
        uses: actions/download-artifact@v4
        with:
          name: e2e-binary-next

      - name: Make binary executable
        run: chmod +x stapler-squad seed-demo seed-hidden

      # setup-bun unzips its download, the server and some specs shell out to tmux; install only
      # what the image lacks. apt gets its own timeouts: killing a wrapper with `timeout` would
      # orphan apt-get holding the dpkg lock and fail every retry with exit 100.
      - name: Ensure unzip, tmux and git
        timeout-minutes: 10
        shell: bash
        run: |
          missing=()
          for tool in unzip tmux git; do command -v "$tool" >/dev/null || missing+=("$tool"); done
          if [ "${#missing[@]}" -gt 0 ]; then
            apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=60)
            for attempt in 1 2 3; do
              if apt-get "${apt_opts[@]}" update -qq && apt-get "${apt_opts[@]}" install -y -qq --no-install-recommends "${missing[@]}"; then break; fi
              [ "$attempt" = 3 ] && { echo "::error::could not install ${missing[*]}" >&2; exit 1; }
              sleep 10
            done
          fi
          tmux -V; git --version

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Install test dependencies
        run: cd tests/e2e && bun install --frozen-lockfile

      - name: Check Playwright version
        run: npx --prefix tests/e2e playwright --version

      # Report-only: the recorded baseline already holds hundreds of failing specs, so raw
      # Playwright failures must not fail the shard; the merge job / comparator is the verdict.
      # Only a blown budget or a harness crash (no blob report) fails a shard. The soft timeout
      # fires before the job's hard 50m.
      # Firefox/WebKit (desktop-firefox, desktop-webkit, webkit-mobile) moved to the dedicated
      # nightly.yml's secondary-browser jobs — see its header for why.
      - name: Run e2e shard ${{ matrix.shard }}/${{ env.E2E_SHARD_TOTAL }} (Next build)
        env:
          TEST_SERVER_BINARY: ${{ github.workspace }}/stapler-squad
          TEST_SEED_DEMO: ${{ github.workspace }}/seed-demo
          TEST_SEED_HIDDEN: ${{ github.workspace }}/seed-hidden
          WEB_BUILD: next
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/tests/e2e/shard-report.json
        run: |
          cd tests/e2e
          timeout 40m npx playwright test --reporter=list,blob,json --shard=${{ matrix.shard }}/${{ env.E2E_SHARD_TOTAL }} --project=chromium --project=chromium-dom --project=mobile-chromium || {
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 124 ]; then
              echo "::error::CI-BUDGET-EXCEEDED: 'e2e-next' shard ${{ matrix.shard }} exceeded its 40m budget"
              echo "CI-BUDGET-EXCEEDED: 'e2e-next' shard ${{ matrix.shard }} exceeded its 40m budget" >> "$GITHUB_STEP_SUMMARY"
              exit $EXIT_CODE
            fi
            ls blob-report/*.zip > /dev/null
          }

      # The run step above tolerates raw test failures (report-only). A server that never started or a
      # global-setup error leaves a blob report with zero executed tests and used to pass the shard.
      - name: Fail if shard ${{ matrix.shard }} ran no tests or hit a setup error (Next build)
        run: node tests/e2e/scripts/assert-e2e-report.mjs tests/e2e/shard-report.json --label "e2e-next shard ${{ matrix.shard }}"

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-next-blob-${{ matrix.shard }}
          path: tests/e2e/blob-report
          if-no-files-found: error
          retention-days: 1

  e2e-next:
    name: e2e (Next build)
    runs-on: ubuntu-latest
    needs: [detect-changes, e2e-env, e2e-next-shard]
    # e2e-env failing leaves the shards skipped (no matrix); still run so this check goes red.
    if: always() && (needs.e2e-next-shard.result != 'skipped' || needs.e2e-env.result == 'failure')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions
            tests/e2e
            scripts

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        run: cd tests/e2e && bun install --frozen-lockfile

      - name: Download shard blob reports
        if: needs.e2e-next-shard.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-next-blob-*
          path: tests/e2e/all-blobs
          merge-multiple: true

      - name: Merge shards into one Playwright JSON report
        if: needs.e2e-next-shard.result == 'success'
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/tests/e2e/playwright-report/report.json
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/tests/e2e/playwright-report/report.json
        run: cd tests/e2e && npx playwright merge-reports --reporter=json ./all-blobs

      - name: Fail if the merged report is empty or has runner errors
        if: needs.e2e-next-shard.result == 'success'
        run: node tests/e2e/scripts/assert-e2e-report.mjs tests/e2e/playwright-report/report.json --label "merged e2e-next"

      - name: Fail if any shard did not complete
        if: needs.e2e-next-shard.result != 'success'
        run: |
          echo "::error::a Next e2e shard failed or blew its budget (result: ${{ needs.e2e-next-shard.result }})"
          exit 1

      - name: Upload Playwright JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-next-report
          path: tests/e2e/playwright-report/report.json
          if-no-files-found: warn
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # e2e-bun: the single PR e2e. The same full suite against the Bun build, scored against the
  # recorded Next baseline (tests/e2e/baseline/next-e2e-baseline.json, Task 0.1e) and the
  # expected-diff list (tests/e2e/baseline/bun-expected-diff.json, Story 7.11) by
  # scripts/e2e-baseline-compare.ts (Task 7.10c) -- on push/dispatch the job's result is the
  # comparator's verdict, not Playwright's raw exit code. The comparator needs the same-run Next
  # report, which only exists off pull_request, so on PRs it is skipped and the job fails only
  # on a failed/incomplete shard.
  # ─────────────────────────────────────────────────────────────────────────────
  # Builds the Bun-mode e2e binary once (web UI rebuilt for Bun); the Bun shards download it
  # instead of each repeating buf setup, the node_modules restore and `make stapler-squad`.
  e2e-binary-bun:
    name: e2e binary (Bun build)
    runs-on: ubuntu-latest
    needs: [detect-changes, prepare]
    timeout-minutes: 30
    if: always() && (github.event_name != 'pull_request' || needs.detect-changes.outputs.relevant == 'true')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache buf binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/buf
          key: buf-1.41.0-${{ runner.os }}-${{ runner.arch }}

      - name: Set up buf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: '1.41.0'
          setup_only: 'true'

      # proto/ent code generation is not WEB_BUILD-dependent, so this still saves the buf/ent
      # steps below even though the web UI itself is rebuilt for Bun (next step's `make`).
      - name: Download generated files (proto/ent; web UI rebuilt below for Bun)
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact-name }}

      # Exact key, no restore-keys: see web-build-smoke-bun's identical step for why.
      - name: Cache shared node_modules
        uses: actions/cache@v4
        with:
          path: ~/.stapler-squad/shared-node-modules
          key: web-node-modules-${{ runner.os }}-${{ hashFiles('web-app/bun.lock', 'web-app/patches/**') }}

      # The Makefile's WEB_BUILD_STAMP seam (Makefile:228-240) detects the mode flip from
      # prepare's Next-mode artifact and rebuilds web-app/out + server/web/dist for Bun once.
      - name: Build binary (Bun build)
        env:
          WEB_BUILD: bun
        run: make stapler-squad || { echo "retrying once (host load)"; rm -rf web-app/out server/web/dist; make stapler-squad; }

      - name: Build e2e seed tools
        run: |
          go build -o seed-demo ./tests/demo/seed
          go build -o seed-hidden ./tests/e2e/seed-hidden

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: e2e-binary-bun
          path: |
            stapler-squad
            seed-demo
            seed-hidden
          if-no-files-found: error
          retention-days: 1

  e2e-bun-shard:
    name: e2e (Bun build) shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: [detect-changes, e2e-env, e2e-binary-bun]
    if: always() && (github.event_name != 'pull_request' || needs.detect-changes.outputs.relevant == 'true')
    timeout-minutes: 50
    # Official Playwright image: browsers and OS libraries are baked in, so there is no
    # apt-get / `playwright install` per shard. The tag comes from bun.lock via e2e-env.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.e2e-env.outputs.playwright-version }}-noble
      options: --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e-env.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Bun binary
        uses: actions/download-artifact@v4
        with:
          name: e2e-binary-bun

      - name: Make binary executable
        run: chmod +x stapler-squad seed-demo seed-hidden

      # setup-bun unzips its download, the server and some specs shell out to tmux; install only
      # what the image lacks. apt gets its own timeouts: killing a wrapper with `timeout` would
      # orphan apt-get holding the dpkg lock and fail every retry with exit 100.
      - name: Ensure unzip, tmux and git
        timeout-minutes: 10
        shell: bash
        run: |
          missing=()
          for tool in unzip tmux git; do command -v "$tool" >/dev/null || missing+=("$tool"); done
          if [ "${#missing[@]}" -gt 0 ]; then
            apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=60)
            for attempt in 1 2 3; do
              if apt-get "${apt_opts[@]}" update -qq && apt-get "${apt_opts[@]}" install -y -qq --no-install-recommends "${missing[@]}"; then break; fi
              [ "$attempt" = 3 ] && { echo "::error::could not install ${missing[*]}" >&2; exit 1; }
              sleep 10
            done
          fi
          tmux -V; git --version

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Install test dependencies
        run: cd tests/e2e && bun install --frozen-lockfile

      - name: Check Playwright version
        run: npx --prefix tests/e2e playwright --version

      # Report-only: the recorded baseline already holds hundreds of failing specs, so raw
      # Playwright failures must not fail the shard; the merge job / comparator is the verdict.
      # Only a blown budget or a harness crash (no blob report) fails a shard. The soft timeout
      # fires before the job's hard 50m.
      # Firefox/WebKit (desktop-firefox, desktop-webkit, webkit-mobile) moved to the dedicated
      # nightly.yml's secondary-browser jobs — see its header for why.
      - name: Run e2e shard ${{ matrix.shard }}/${{ env.E2E_SHARD_TOTAL }} (Bun build)
        env:
          TEST_SERVER_BINARY: ${{ github.workspace }}/stapler-squad
          TEST_SEED_DEMO: ${{ github.workspace }}/seed-demo
          TEST_SEED_HIDDEN: ${{ github.workspace }}/seed-hidden
          WEB_BUILD: bun
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/tests/e2e/shard-report.json
        run: |
          cd tests/e2e
          timeout 40m npx playwright test --reporter=list,blob,json --shard=${{ matrix.shard }}/${{ env.E2E_SHARD_TOTAL }} --project=chromium --project=chromium-dom --project=mobile-chromium || {
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 124 ]; then
              echo "::error::CI-BUDGET-EXCEEDED: 'e2e-bun' shard ${{ matrix.shard }} exceeded its 40m budget"
              echo "CI-BUDGET-EXCEEDED: 'e2e-bun' shard ${{ matrix.shard }} exceeded its 40m budget" >> "$GITHUB_STEP_SUMMARY"
              exit $EXIT_CODE
            fi
            ls blob-report/*.zip > /dev/null
          }

      # The run step above tolerates raw test failures (report-only). A server that never started or a
      # global-setup error leaves a blob report with zero executed tests and used to pass the shard.
      - name: Fail if shard ${{ matrix.shard }} ran no tests or hit a setup error (Bun build)
        run: node tests/e2e/scripts/assert-e2e-report.mjs tests/e2e/shard-report.json --label "e2e-bun shard ${{ matrix.shard }}"

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-bun-blob-${{ matrix.shard }}
          path: tests/e2e/blob-report
          if-no-files-found: error
          retention-days: 1

  e2e-bun:
    name: e2e (Bun build)
    runs-on: ubuntu-latest
    needs: [detect-changes, e2e-env, e2e-bun-shard, e2e-next]
    # e2e-env failing leaves the shards skipped (no matrix); still run so this check goes red.
    if: >-
      always() && (needs.e2e-bun-shard.result != 'skipped' || needs.e2e-env.result == 'failure') &&
      (github.event_name == 'pull_request' ||
      (needs.e2e-next.result != 'skipped' && needs.e2e-next.result != 'cancelled'))
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions
            tests/e2e
            scripts

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        run: cd tests/e2e && bun install --frozen-lockfile

      - name: Download shard blob reports
        if: needs.e2e-bun-shard.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-bun-blob-*
          path: tests/e2e/all-blobs
          merge-multiple: true

      - name: Merge shards into one Playwright JSON report
        if: needs.e2e-bun-shard.result == 'success'
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/tests/e2e/playwright-report/report.json
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/tests/e2e/playwright-report/report.json
        run: cd tests/e2e && npx playwright merge-reports --reporter=json ./all-blobs

      - name: Fail if the merged report is empty or has runner errors
        if: needs.e2e-bun-shard.result == 'success'
        run: node tests/e2e/scripts/assert-e2e-report.mjs tests/e2e/playwright-report/report.json --label "merged e2e-bun"

      - name: Fail if any shard did not complete
        if: needs.e2e-bun-shard.result != 'success'
        run: |
          echo "::error::a Bun e2e shard failed or blew its budget (result: ${{ needs.e2e-bun-shard.result }})"
          exit 1

      - name: Download e2e-next's Playwright JSON report
        if: always() && github.event_name != 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: e2e-next-report
          path: /tmp/e2e-next-report
        continue-on-error: true

      - name: Run the baseline comparator
        if: always() && github.event_name != 'pull_request'
        # pipefail: without it, the step's exit status is tee's (always 0), masking a
        # comparator failure -- this job's result must be the comparator's verdict.
        run: |
          set -o pipefail
          bun scripts/e2e-baseline-compare.ts \
            --baseline tests/e2e/baseline/next-e2e-baseline.json \
            --expected-diff tests/e2e/baseline/bun-expected-diff.json \
            --next-report /tmp/e2e-next-report/report.json \
            --bun-reports tests/e2e/playwright-report/report.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────────────
  # test-affected: the PR-time Go test gate -- only the packages transitively
  # affected by this PR's changed .go files (scripts/test-affected.py's
  # go-list-based dependency graph), instead of test-tmux/test-rest's full
  # ./... sweep (main-only now, see those jobs' own `if:`). Fast PR
  # verification was the whole point of building this: a global coverage
  # percentage and a full-repo test sweep on every PR were never actually
  # needed to merge safely, only to guard main -- so this job also carries an
  # advisory, incremental coverage report (affected packages only, not a
  # global percentage) plus the registry/RPC-coverage/E2E-coverage checks
  # that used to live in the `test` job and never actually depended on
  # test-tmux/test-rest's coverage profiles.
  # Always posts a status (never skips outright) even when there's nothing
  # to narrow, same reason detect-changes above does -- see its comment.
  # ─────────────────────────────────────────────────────────────────────────────
  test-affected:
    name: Test (affected packages only, fast signal)
    runs-on: ubuntu-latest
    needs: prepare
    # 30m, not 10m: the rare full_suite_fallback path (a PR that can't be
    # safely narrowed) runs ./... under -race -short, plus this job now also
    # carries the registry/RPC-coverage/E2E-coverage checks moved down from
    # `test`. The common case (a real affected-package subset) still
    # finishes in well under this.
    timeout-minutes: 30
    env:
      GIT_AUTHOR_NAME: stapler-squad-ci
      GIT_AUTHOR_EMAIL: ci@stapler-squad.invalid
      GIT_COMMITTER_NAME: stapler-squad-ci
      GIT_COMMITTER_EMAIL: ci@stapler-squad.invalid
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # Full history so BASE_SHA below resolves -- same reason lint.yml's
          # ESLint step needs it (see that file's comment on this exact
          # gotcha with a shallow default checkout).
          fetch-depth: 0
          # Blobless: full commit/tree history (merge-base and origin/main resolve)
          # without the ~16GB of historical blobs; blobs for diffed files fetch lazily.
          filter: blob:none

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      # gotestsum wraps `go test -json` for readable per-test pass/fail output
      # instead of a wall of raw go test stdout -- default test runner for this
      # project (see Makefile's GOTESTSUM_BIN). `go install` results are cached
      # by setup-go's module/build cache above, so this is a no-op restore on
      # a cache hit, not a fresh download every run.
      - name: Install gotestsum
        run: |
          go install gotest.tools/gotestsum@v1.13.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact-name }}

      - name: Build pinned tmux 3.8
        uses: ./.github/actions/build-tmux
        with:
          install-socat: 'true'

      - name: Set up the tymux fidelity oracle (xterm.js via Bun)
        uses: ./.github/actions/setup-fidelity-oracle

      - name: Run affected-package tests
        env:
          STAPLER_SQUAD_TMUX_CREATE_TIMEOUT_SECONDS: "30"
          # session/tymux's xterm.js fidelity corpus must run here, not skip (see setup-fidelity-oracle).
          FIDELITY_REQUIRE_ORACLE: "1"
        run: |
          # On push-to-main/workflow_dispatch, test-tmux/test-rest (below)
          # always run the full suite regardless of what this job does, so
          # falling back to a plain skip here when narrowing isn't possible
          # is fine there -- unlike on a PR, where those two jobs are now
          # skipped entirely (see their own `if:`) and this job is the ONLY
          # Go test signal. A PR that can't be safely narrowed must run the
          # full suite itself instead of silently testing nothing.
          full_suite_fallback() {
            echo "$1"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Running the full suite instead (this job is the only Go test gate on a PR)."
              TMUX_BIN="$(pwd)/bin/tmux" gotestsum --format github-actions -- -race -short -timeout=22m \
                -coverprofile=coverage.affected.out -covermode=atomic ./...
            else
              echo "Nothing to narrow -- test-tmux/test-rest (main-only) already cover the full suite."
            fi
          }

          # Same BASE_SHA resolution as lint.yml's ESLint step: PR base sha,
          # else the commit before this push, else give up cleanly.
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE_SHA" ]; then
            CANDIDATE="${{ github.event.before }}"
            if [ -n "$CANDIDATE" ] && [ "$CANDIDATE" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$CANDIDATE" 2>/dev/null; then
              BASE_SHA="$CANDIDATE"
            fi
          fi
          if [ -z "$BASE_SHA" ]; then
            full_suite_fallback "No resolvable base SHA."
            exit 0
          fi

          PKGS="$(python3 scripts/test-affected.py "$BASE_SHA")"
          if [ -z "$PKGS" ]; then
            echo "No Go packages affected vs $BASE_SHA"
            exit 0
          fi
          if [ "$PKGS" = "__ALL__" ]; then
            full_suite_fallback "Change can't be safely narrowed (proto/go.mod/go.sum/Makefile/.golangci.yml/test-affected.py itself)."
            exit 0
          fi

          echo "Affected packages:"
          echo "$PKGS"
          # 12m, not the original 8m: a change to a foundational, heavily-imported
          # package (e.g. session/tmux) makes test-affected.py conservatively pull
          # in every transitive importer -- observed 2026-09-07 pulling in ~27
          # packages including server/services' ~2857-test suite, which alone
          # already runs at ~84% of an 8m budget in isolation (405s/480s, PR #733).
          # Bundled with 26 sibling packages under -race on a shared runner, that
          # margin reliably tipped over into a whole-run "test timed out after
          # 8m0s" (confirmed twice in a row, PR #735 CI runs 34164579438 attempts
          # 1-2 -- each kill caught an unrelated, normally-fast subtest still
          # "running", not a hang/deadlock, ruling out a real code regression).
          # 15m (was 12m): PR #927 (session/tmux) hit "test timed out after 12m0s"
          # on a normal -race run while only fast tests were still in flight --
          # the same runner-speed tipping point, not a hang. Still below the 22m
          # full-suite fallback and within this job's 30m timeout-minutes.
          # PKGS is deliberately unquoted below: it's a space-separated list
          # of package paths that must word-split into separate `go test`
          # arguments, not one quoted string.
          # shellcheck disable=SC2086
          TMUX_BIN="$(pwd)/bin/tmux" gotestsum --format github-actions -- -race -short -timeout=15m \
            -coverprofile=coverage.affected.out -covermode=atomic $PKGS

      # Advisory only -- a global-threshold-style gate doesn't make sense
      # against a per-PR, per-affected-packages-only profile (it would swing
      # PR-to-PR based on which packages happened to change, not measure
      # anything comparable). Reports the affected packages' own coverage
      # percentage as an incremental signal instead of a pass/fail gate; the
      # real gate (global-threshold: 60) still runs, just main-only now (see
      # the `test` job).
      - name: Incremental coverage report (affected packages, advisory)
        if: always()
        run: |
          if [ ! -f coverage.affected.out ]; then
            echo "No affected-package coverage profile generated this run (nothing narrowed, or the run exited early) -- skipping."
            exit 0
          fi
          go tool cover -func=coverage.affected.out | tee coverage.affected.txt
          {
            echo "## Incremental Coverage (affected packages only)"
            echo '```'
            tail -1 coverage.affected.txt
            echo '```'
            echo "_Advisory only -- not a merge gate. The full-repo coverage gate (global-threshold: 60) runs on merges to main._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Set up Node.js (for coverage report)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run CI comment-gate unit tests
        run: cd tools/ci-gates && bun install --silent && bun run test

      # Subsumes registry-validation.yml's divergence check (removed): that
      # workflow tolerated up to 2% ID-count drift before failing, but
      # `git diff --exit-code` on the regenerated files below is an exact-match
      # check -- strictly stronger, since anything within the 2% tolerance
      # still diffs and fails here. Running both was pure duplicate cost (a
      # second full _prepare.yml + scanner-build cycle for a weaker check).
      - name: Check new RPCs have tests
        run: |
          make registry-generate
          git diff --exit-code docs/registry/features/ || {
            echo "Registry out of date — run: make registry-generate"
            exit 1
          }
          # --diff-filter=A: only files *added* relative to origin/main are a new RPC.
          # Without it, a refactor that only moves a handler to a different file (and so
          # only bumps handlerFile/lastModified on an existing, already-untested feature
          # file) is indistinguishable from a brand-new untested RPC, and blocks on
          # pre-existing debt this PR didn't create.
          NEW_FILES=$(git diff --name-only --diff-filter=A origin/main -- 'docs/registry/features/backend/**' 2>/dev/null || true)
          for f in $NEW_FILES; do
            if [ -f "$f" ] && jq -e '.tested == false' "$f" > /dev/null 2>&1; then
              echo "ERROR: New RPC $f has no test (tested: false). Add a test and set tested: true."
              exit 1
            fi
          done
          # Also validate the typed catalog
          cd web-app && bun install --frozen-lockfile --silent && bun run validate-catalog

      # registry-validation.yml's other unique signal (advisory, not blocking):
      # what fraction of registered features declare testIds at all. Ported
      # here rather than dropped since it's a distinct metric from the E2E
      # spec-coverage report below (declared-test-exists vs. E2E-spec-exists).
      - name: Report registry test-ID coverage (advisory)
        if: always()
        run: |
          python3 tools/scanner/report-coverage.py | tee -a "$GITHUB_STEP_SUMMARY"

      # Runs after "Check new RPCs have tests" deliberately: that step is what
      # actually generates docs/registry/backend-features.json (via `make
      # registry-generate`, a gitignored artifact — see .gitignore:98). This
      # step used to run before it and always found no registry file,
      # producing "Feature E2E coverage: N/A" on every single run regardless
      # of the actionability gate below — confirmed live via PR #462's first
      # review pass. Root-caused and fixed by reordering rather than papering
      # over the symptom in the gate logic.
      - name: Generate feature E2E coverage report
        id: coverage
        run: |
          cd tools/coverage && bun install --silent
          OUTPUT=$(npx ts-node feature-coverage.ts ../../docs/registry/backend-features.json '../../tests/e2e/**/*.spec.ts' 2>&1)
          echo "$OUTPUT"
          SUMMARY=$(echo "$OUTPUT" | grep 'Feature E2E coverage:' | head -1 || echo "Feature E2E coverage: N/A")
          echo "summary=${SUMMARY}" >> "$GITHUB_OUTPUT"
          PCT=$(SUMMARY="$SUMMARY" node -e "console.log(require('../ci-gates/coverage-delta.js').parseCoveragePct(process.env.SUMMARY) ?? '')")
          echo "pct=${PCT:-}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Post feature coverage PR comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          COVERAGE_SUMMARY: ${{ steps.coverage.outputs.summary }}
          COVERAGE_PCT: ${{ steps.coverage.outputs.pct }}
        with:
          script: |
            const { isActionable, buildMarker, findExisting } = require('./tools/ci-gates/coverage-delta.js');
            const summary = process.env.COVERAGE_SUMMARY || 'Feature coverage report unavailable';
            const currentPct = parseFloat(process.env.COVERAGE_PCT);

            // A NaN currentPct means the tool genuinely couldn't compute a
            // number even with the registry available (a real failure, not
            // "no change yet") — there's nothing actionable to report, so
            // this skips rather than posting an uninformative comment.
            if (isNaN(currentPct)) {
              core.warning('Feature coverage report produced no parseable percentage; skipping comment.');
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Feature E2E Coverage\n${summary}\n`);
              return;
            }

            // Recency guard (resolves adversarial-review Blocker 1 for this
            // workflow): build.yml also runs on push-to-main with 5 unrelated
            // jobs, so it can't take a workflow-level concurrency block the
            // way ux-analysis.yml/e2e-video.yml do without cancelling those
            // too — instead, skip only this mutation if a newer push has
            // already superseded the commit this run was triggered for.
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            if (pr.data.head.sha !== context.payload.pull_request.head.sha) {
              core.info('Skipping feature-coverage comment: a newer push has superseded this run.');
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = findExisting(comments);

            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Feature E2E Coverage\n${summary}\n`);

            if (!isActionable({ existingBody: existing ? existing.body : null, currentPct })) {
              // Unchanged coverage is the steady state, not a resolved
              // problem — left untouched, never deleted (see coverage-delta.js).
              return;
            }

            const marker = buildMarker(currentPct);
            const body = `${marker}\n## 📊 Feature E2E Coverage\n\n${summary}\n\n> Run \`make e2e-report\` locally to view the full Allure report.`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ─────────────────────────────────────────────────────────────────────────────
  # go-guards: the former test-delivery-guards, test-oracle, pty-race-regression and
  # install-check jobs as sequential steps of one job (four checks per PR became one). They are
  # independent guards; a failure in one does not stop the rest (`!cancelled()` + `ready` gate).
  #   - delivery guards: the `//go:build sinkguard` type-based guard tests (delivery-gate sinks,
  #     terminal-write callers) are excluded from every other job's default build tags.
  #   - git oracle: the `//go:build gitoracle` differential tests (go-git fork plan Story 1.3.3)
  #     compare a candidate git backend with the real git CLI over temp repositories.
  #   - install check: the native linux binary builds and runs (the `install.sh --from-source`
  #     and `make build` path).
  #   - PTY-triple race regression: ptmx/attachCmd/attachCmdWaitOnce fix gate. A plain -race run
  #     executes each test once, not enough to catch a reintroduced timing-sensitive race, so
  #     they run amplified under golang.org/x/tools/cmd/stress (validated locally at -count=20/50,
  #     see project_plans/tmux-ptmx-race-fix/).
  # ─────────────────────────────────────────────────────────────────────────────
  go-guards:
    name: Go guards (delivery gate, git oracle, install check, PTY race)
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install gotestsum
        run: |
          go install gotest.tools/gotestsum@v1.13.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact-name }}

      - name: Build pinned tmux 3.8
        id: tmux
        uses: ./.github/actions/build-tmux

      - name: Run sinkguard-tagged guard tests
        if: ${{ !cancelled() }}
        run: make test-delivery-guards-run

      - name: Run gitoracle-tagged tests
        if: ${{ !cancelled() }}
        run: make test-oracle

      - name: Build binary (native)
        if: ${{ !cancelled() }}
        run: go build -o stapler-squad .

      - name: Verify binary runs
        if: ${{ !cancelled() }}
        run: ./stapler-squad version

      - name: Install go-stress
        if: ${{ !cancelled() && steps.tmux.conclusion == 'success' }}
        run: go install golang.org/x/tools/cmd/stress@v0.47.0

      - name: Compile PTY-triple regression test binaries
        if: ${{ !cancelled() && steps.tmux.conclusion == 'success' }}
        run: |
          go test -race -c -o server.test ./server
          go test -race -c -o tmux.test ./session/tmux

      # tmux under CPU contention needs the widened create-timeout headroom (repeated runs spawn
      # real tmux servers). `timeout` exit 124 means "ran clean for the whole 90s budget" and is a
      # pass; any other nonzero exit is a real failure from stress.
      - name: PTY-triple race regression (parallel amplification via go-stress)
        if: ${{ !cancelled() && steps.tmux.conclusion == 'success' }}
        env:
          STAPLER_SQUAD_TMUX_CREATE_TIMEOUT_SECONDS: "30"
        run: |
          # keep this marker prefix in sync with ciBudgetExceededMarker in server/services/github_webhook_pr_fix.go
          # Outer 14m soft budget wraps both inner 90s-per-binary stress runs: a backstop for the
          # whole step running away, not a second per-command timeout duplicating the inner ones.
          run_pty_race_regression() {
            TMUX_BIN="$(pwd)/bin/tmux" timeout 90s stress ./server.test \
              -test.run='TestServer_should_WriteUnchangedHookURL_When_StartedOnExplicitPort|TestSessionService_CreateThenImmediateDelete_NoDataRace' \
              || [ $? -eq 124 ]
            TMUX_BIN="$(pwd)/bin/tmux" timeout 90s stress ./tmux.test \
              -test.run='TestGetPTY_ClosePTYAndAttachCmd_ConcurrentAccessIsSerialized|TestDetach_ConcurrentWithGetPTY_NoDeadlock|TestDetachSafely_ConcurrentWithGetPTY_NoDeadlock' \
              || [ $? -eq 124 ]
          }
          export -f run_pty_race_regression
          timeout 14m bash -c run_pty_race_regression || { echo "::error::CI-BUDGET-EXCEEDED: 'pty-race-regression' exceeded its 14m budget"; echo "CI-BUDGET-EXCEEDED: 'pty-race-regression' exceeded its 14m budget" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
