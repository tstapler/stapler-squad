name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Plain GITHUB_TOKEN is fine here: the release build (job below)
          # runs in THIS SAME workflow run, triggered by the original
          # `push: branches: [main]` event and gated on the
          # `release_created` output — it does not depend on a second,
          # separately-triggered workflow run. GitHub's anti-recursion rule
          # ("pushes/tags made with the default GITHUB_TOKEN do not trigger
          # other on:push/on:push-tags workflows") therefore never comes
          # into play, unlike the old approach in release.yml which relied
          # on a `push: tags: v*` trigger firing off of a tag pushed by this
          # action — that never worked and no release binaries were ever
          # published. See release.yml's header comment for that history.
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build Release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      # Only what GoReleaser needs: create the GitHub Release + upload
      # assets, and push a Homebrew formula commit to this same repo's
      # `main` branch (see .goreleaser.yaml `brews:` — repository owner/name
      # resolve to this repo, not an external tap, so no separate
      # cross-repo token is required). No pull-requests/issues access needed
      # here (that's only for the release-please job above).
      contents: write

    steps:
      - name: Check out the tag release-please just created
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      # Was five hand-duplicated steps here (pnpm/node/buf/web-build) that
      # had drifted from .github/actions/prepare's own copy of the same
      # sequence by missing one step entirely — ent ORM code generation.
      # session/ent/*.go is gitignored and only exists after that step (see
      # .gitignore's ent comment, Makefile's ent-gen target); every
      # `make build`/test/lint target depends on ent-gen and so never
      # exercises this path, which is exactly why the gap went unnoticed
      # here. Confirmed this is the actual cause of v1.52.0 shipping a tag
      # with zero attached binaries (run 34077654769: "no required module
      # provides package .../session/ent/backlogstuckstate"). Using the
      # shared action outright, instead of re-adding the missing step
      # in-line a second time, so this exact drift can't recur the next
      # time that sequence changes.
      # Also sets up Go (go-version-file: go.mod) as its first step — no
      # separate setup-go step needed here.
      - name: Generate protos, ent ORM code, and build web UI
        uses: ./.github/actions/prepare

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          # GITHUB_REPOSITORY (owner/repo) is set automatically by GitHub Actions
