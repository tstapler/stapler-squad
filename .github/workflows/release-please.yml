name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Plain GITHUB_TOKEN is fine here: the release build (job below)
          # runs in THIS SAME workflow run, triggered by the original
          # `push: branches: [main]` event and gated on the
          # `release_created` output — it does not depend on a second,
          # separately-triggered workflow run. GitHub's anti-recursion rule
          # ("pushes/tags made with the default GITHUB_TOKEN do not trigger
          # other on:push/on:push-tags workflows") therefore never comes
          # into play, unlike the old approach in release.yml which relied
          # on a `push: tags: v*` trigger firing off of a tag pushed by this
          # action — that never worked and no release binaries were ever
          # published. See release.yml's header comment for that history.
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build Release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      # Only what GoReleaser needs: create the GitHub Release + upload
      # assets, and push a Homebrew formula commit to this same repo's
      # `main` branch (see .goreleaser.yaml `brews:` — repository owner/name
      # resolve to this repo, not an external tap, so no separate
      # cross-repo token is required). No pull-requests/issues access needed
      # here (that's only for the release-please job above).
      contents: write

    steps:
      - name: Check out the tag release-please just created
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.27.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: web-app/pnpm-lock.yaml

      - name: Install web dependencies
        run: cd web-app && pnpm install --frozen-lockfile

      # See .github/actions/prepare/action.yml's "Cache buf binary" step for
      # why this caches the whole tool-cache "buf" dir rather than a specific
      # .../<version>/<arch> subpath.
      - name: Cache buf binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/buf
          key: buf-1.41.0-${{ runner.os }}-${{ runner.arch }}

      - name: Set up buf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: '1.41.0'
          setup_only: 'true'

      - name: Generate protobuf code
        run: buf generate

      - name: Build web UI
        working-directory: web-app
        run: pnpm run build

      - name: Copy web UI to dist
        run: cp -r web-app/out server/web/dist

      - name: Set up Go 1.23.0
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          # GITHUB_REPOSITORY (owner/repo) is set automatically by GitHub Actions
