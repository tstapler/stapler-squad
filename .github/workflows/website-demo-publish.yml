name: Publish Website Demo Clips

# Manually dispatched, separate from demo-publish.yml on purpose (see
# research/architecture.md §2). Records the website's curated clips
# (tests/e2e/website-demos/clips.ts) with scripts/record-website-demos.sh and
# publishes <name>.webm to the website-demo-gifs-latest release, never to
# demo-gifs-latest (owned by demo-publish.yml, which feeds the README).
#
# Trigger discipline mirrors demo-publish.yml and must keep doing so:
# workflow_dispatch only, no push/pull_request/schedule. Both workflows publish
# durable Release assets (unlike e2e-video.yml's ephemeral, retention-limited
# upload-artifact), so neither can be safely triggered by an untrusted push/PR
# event. See research/pitfalls.md §4.
#
# After publishing, the job records each clip's hash in the AssetHealthManifest,
# regenerates features.json (which attaches only manifest-listed clips) and
# starts the site deploy. A push made with GITHUB_TOKEN does not trigger other
# workflows, so the deploy is dispatched explicitly.

on:
  workflow_dispatch:

jobs:
  record-clips:
    name: Record demo clips
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4
        with:
          lfs: true
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # ratchet:actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # ratchet:actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate protos and build web UI
        uses: ./.github/actions/prepare

      - name: Build binary
        run: go build -o stapler-squad .

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # ratchet:actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/bun.lock') }}

      - name: Install Playwright, ffmpeg and librsvg
        run: |
          cd tests/e2e
          bun install --frozen-lockfile
          npx playwright install chromium --with-deps
          sudo apt-get install -y ffmpeg librsvg2-bin jq

      - name: Record, trim and brand the clips
        run: scripts/record-website-demos.sh --out "$RUNNER_TEMP/website-demo-clips"

      - name: Upload clips
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7
        with:
          name: website-demo-clips
          path: ${{ runner.temp }}/website-demo-clips/*.webm
          if-no-files-found: error
          retention-days: 5

  publish-clips:
    name: Publish clips to website-demo-gifs-latest release
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: record-clips
    permissions:
      contents: write
      actions: write

    steps:
      # Checks out main (the dispatch ref), because this job commits the
      # manifest and features.json back to it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4

      - name: Download clips
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # ratchet:actions/download-artifact@v4
        with:
          name: website-demo-clips
          path: /tmp/demo-clips

      - name: Upload clips as website-demo-gifs-latest release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view website-demo-gifs-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create website-demo-gifs-latest \
              --repo "${{ github.repository }}" \
              --title "Website Demo Clips (latest)" \
              --notes "Auto-updated by website-demo-publish.yml. Not a versioned release -- assets are overwritten on every run; link to https://github.com/${{ github.repository }}/releases/download/website-demo-gifs-latest/<name>.webm for a stable URL. Separate from demo-gifs-latest (owned by demo-publish.yml)." \
              --latest=false
          fi
          # --clobber replaces an asset in place, so each clip's URL stays stable across runs.
          gh release upload website-demo-gifs-latest /tmp/demo-clips/*.webm --repo "${{ github.repository }}" --clobber

      # Content-identity check (pre-mortem.md Failure #5): --clobber keeps the
      # URL stable even when the bytes change, so check-asset-health.mjs needs a
      # hash, not just an HTTP status. Recorded right after the upload it describes.
      - name: Record uploaded clip hashes in AssetHealthManifest
        run: |
          set -euo pipefail
          manifest=website/scripts/asset-health-manifest.json
          for clip in /tmp/demo-clips/*.webm; do
            name=$(basename "$clip")
            hash=$(sha256sum "$clip" | cut -d' ' -f1)
            jq --arg k "$name" --arg v "$hash" '.[$k] = $v' "$manifest" > "$manifest.next"
            mv "$manifest.next" "$manifest"
            echo "Recorded $name -> $hash"
          done

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Regenerate features.json (attaches the clips now in the manifest)
        working-directory: website
        run: |
          bun install --frozen-lockfile
          node scripts/build-features.mjs

      # Bot-commit pattern from ci-duration-trend.yml: pull --rebase --autostash
      # && push retry loop so a concurrent push doesn't lose this update.
      - name: Commit manifest and features.json
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add website/scripts/asset-health-manifest.json website/src/content/features.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(website): record published demo clips [skip ci]"
          for _ in 1 2 3; do
            if git pull --rebase --autostash && git push; then exit 0; fi
            sleep 5
          done
          echo "::error::could not push the manifest update" && exit 1

      - name: Deploy the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-website.yml --repo "${{ github.repository }}" --ref main
