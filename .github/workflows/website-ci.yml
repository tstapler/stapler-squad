name: Website CI

# PR gate for the Astro+Starlight site in website/. Runs the same checks as
# deploy-website.yml's build job (everything before "Configure Pages"), so a PR
# that would break the Pages deploy fails here instead of after merge.
# website/tests/unit/workflow-yaml.test.ts fails if the two drift apart.
# Never deploys: the `github-pages` environment only accepts main.
#
# Media: a PR records ONE clip (the dashboard-lifecycle hero clip) and its shots
# against a server binary built from the PR itself (build.yml's e2e-binary-bun
# artifact has 1-day retention and path-filtered triggers, so there is no
# reliably downloadable main binary), then builds the site with
# TOURS_MEDIA_MODE=smoke: tours without recorded media are not built at all.
# Full media, tour-page Lighthouse and every-tour axe run only in deploy-website.yml.
# Recorder contract assumed: record-website-demos.sh --out DIR --only a,b --smoke writes
# DIR/clips, DIR/shots and DIR/media-manifest.json.

on:
  pull_request:
    paths:
      - 'website/**'
      - 'docs/how-to/**'
      - 'docs/features.md'
      - 'README.md'
      - 'tests/e2e/website-demos/**'
      - 'tests/demo/**'
      - 'tests/e2e/website-demos.spec.ts'
      - 'tests/e2e/playwright.website-demos.config.ts'
      - 'scripts/record-website-demos.sh'
      - 'scripts/demo-post-process.sh'
      - '.github/workflows/deploy-website.yml'
      - '.github/workflows/website-ci.yml'
      - '.github/actions/setup-bun/**'

concurrency:
  group: website-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # ratchet:actions/checkout@v6

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # ratchet:actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Unit tests
        working-directory: website
        run: bun run test:unit

      - name: Verify content sync
        working-directory: website
        run: bun run sync-content -- --check

      - name: Verify features.json is current
        working-directory: website
        run: node scripts/build-features.mjs && git diff --exit-code -- src/content/features.json

      # CI-only (deploy-website.yml records full media in its own jobs): smoke-record
      # the hero clip so the site build has a manifest and one tour to render.
      - name: "Smoke: fetch submodules"
        run: git submodule update --init --depth 1

      - name: "Smoke: set up Go"
        uses: ./.github/actions/setup-go-cached
        with:
          go-version-file: 'go.mod'

      # The prepare action sets up Bun and Node itself.
      - name: "Smoke: generate protos and build web UI"
        uses: ./.github/actions/prepare

      - name: "Smoke: build server binary"
        run: go build -o stapler-squad .

      - name: "Smoke: cache Playwright browsers"
        uses: ./.github/actions/cache-main-writes
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/bun.lock') }}

      - name: "Smoke: install recorder dependencies"
        run: |
          cd tests/e2e
          bun install --frozen-lockfile
          npx playwright install chromium --with-deps
          sudo apt-get install -y ffmpeg librsvg2-bin jq tmux webp

      - name: "Smoke: record the dashboard-lifecycle clip"
        env:
          SSQ_BIN: ${{ github.workspace }}/stapler-squad
        run: scripts/record-website-demos.sh --out "$RUNNER_TEMP/smoke-out" --only dashboard-lifecycle --smoke --scenario default,dashboard,approvals

      - name: "Smoke: stage media for the site build"
        run: |
          mkdir -p website/public
          cp -r "$RUNNER_TEMP/smoke-out/clips" website/public/clips
          [ -d "$RUNNER_TEMP/smoke-out/shots" ] && cp -r "$RUNNER_TEMP/smoke-out/shots" website/public/shots
          cp "$RUNNER_TEMP/smoke-out/media-manifest.json" website/public/media-manifest.json
          echo "Smoke media: dashboard-lifecycle only, recorded against a binary built from this PR." >> "$GITHUB_STEP_SUMMARY"

      - name: Build site
        working-directory: website
        env:
          TOURS_MEDIA_MODE: smoke
        run: bun run build

      - name: Check internal links
        working-directory: website
        run: node scripts/check-internal-links.mjs

      - name: Check README links
        working-directory: website
        env:
          TOURS_MEDIA_MODE: smoke
        run: node scripts/check-readme-links.mjs

      # Backgrounded with its output redirected: left attached, the server
      # holds the step's output pipe open and the step never completes.
      - name: Start preview server
        working-directory: website
        run: |
          nohup bun run preview -- --port 4321 > /tmp/preview.log 2>&1 &
          timeout 60 bash -c 'until curl -sf http://localhost:4321/stapler-squad/ > /dev/null; do sleep 1; done' \
            || { cat /tmp/preview.log; exit 1; }

      - name: Lighthouse CI (desktop)
        working-directory: website
        run: bun run lhci:desktop:ci

      - name: Lighthouse CI (mobile)
        working-directory: website
        run: bun run lhci:mobile:ci

      - name: Install Playwright browsers
        working-directory: website
        run: npx playwright install chromium --with-deps

      - name: Accessibility scan (axe-core)
        working-directory: website
        run: bun run test:a11y:ci

      - name: E2E UX acceptance tests
        working-directory: website
        run: bun run test:e2e:ci

      - name: Stop preview server
        working-directory: website
        if: always()
        run: bun run preview:stop
