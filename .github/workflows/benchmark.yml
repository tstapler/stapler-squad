name: Benchmarks

on:
  push:
    branches: [ main ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'web-app/src/**'
      - 'web-app/package.json'
      - 'web-app/pnpm-lock.yaml'
      - '.github/workflows/benchmark.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'web-app/src/**'
      - 'web-app/package.json'
      - 'web-app/pnpm-lock.yaml'
      - '.github/workflows/benchmark.yml'

# Cancel in-progress runs on PRs when a new commit is pushed.
# On main, never cancel — baseline-save steps must be allowed to complete.
#
# Baselines: each job's baseline lives in a GitHub Actions cache entry (key
# "bench-<name>-<run_id>", restored by "bench-<name>-" prefix match), not a
# file committed to git — a prior version of this workflow committed updated
# baselines to `benchmarks/` on every push to main, which flooded the commit
# history with "chore(bench): update ... baseline" noise for very little
# value. Cache gives the same "PRs compare against the latest main baseline"
# behavior without touching git history. See individual job comments for the
# cache key used by that job's baseline file.
concurrency:
  # Shared with build.yml benchmark-gate so runs are serialized (avoids
  # redundant concurrent benchmark runs contending for runner resources).
  group: baseline-push-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Tier 1: Critical-path Go benchmarks — run on every PR and push to main.
  # Regex covers the highest-signal benchmarks across the codebase:
  #   - EventBus (events package)
  #   - DeltaGeneration (terminal package)
  #   - CircularBuffer (scrollback package)
  #   - SessionService_ListSessions, GetSession, StreamTerminal (services package)
  # On push to main: saves updated baseline to the "bench-tier1-" cache.
  # On PR: restores the latest baseline from cache, runs benchstat, posts a comment.
  # ─────────────────────────────────────────────────────────────────────────────
  go-tier1:
    name: Go Benchmarks (Tier 1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # Post PR comments on regression alerts
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260312031701-16a31bc5fbd0

      - name: Run Tier 1 benchmarks
        run: |
          go test \
            -bench='BenchmarkEventBus|BenchmarkDeltaGenerat|BenchmarkCircularBuffer|BenchmarkGetTimeSinceLastMeaningfulOutput|BenchmarkStripANSI|BenchmarkStripANSICodes|BenchmarkIsBanner|BenchmarkProcessOutput|BenchmarkDiffShortstat|BenchmarkReviewQueue|BenchmarkDetectCommandsInText|BenchmarkTokenParser' \
            -run='^$' \
            -benchmem \
            -count=8 \
            -timeout=10m \
            ./server/events ./server/terminal ./session/scrollback \
            ./session ./session/detection/ratelimit ./session/tmux \
            ./session/unfinished ./session/queue ./session/tokens | tee tier1-bench.txt

      - name: Restore benchmark baseline (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: benchmarks/go/tier1-baseline.txt
          key: bench-tier1-
          restore-keys: |
            bench-tier1-

      - name: Compare against baseline (PR only)
        if: github.event_name == 'pull_request'
        id: compare
        run: |
          if [ -f benchmarks/go/tier1-baseline.txt ]; then
            # No -delta-test flag: the pinned benchstat's table-format rewrite
            # dropped it in favor of an automatic alpha=0.05 significance test
            # (insignificant deltas are marked "~" in the output already).
            benchstat benchmarks/go/tier1-baseline.txt tier1-bench.txt > benchstat-tier1.txt 2>&1 || true
            echo "## Go Benchmarks (Tier 1)" >> $GITHUB_STEP_SUMMARY
            cat benchstat-tier1.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "No baseline yet — will be established on next push to main." > benchstat-tier1.txt
          fi
          if node -e "process.exit(require('./tools/ci-gates/benchmark-regression.js').hasGoTier1Regression(require('fs').readFileSync('benchstat-tier1.txt','utf8')) ? 0 : 1)"; then
            echo "has_regression=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_regression=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        continue-on-error: true # advisory comment; never fail the job if posting is denied
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          HAS_REGRESSION: ${{ steps.compare.outputs.has_regression }}
        with:
          script: |
            const marker = '<!-- benchmark-go-tier1 -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (process.env.HAS_REGRESSION !== 'true') {
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                });
              }
              return;
            }
            const fs = require('fs');
            const output = fs.existsSync('benchstat-tier1.txt')
              ? fs.readFileSync('benchstat-tier1.txt', 'utf8').trim()
              : 'No comparison available.';
            const body = `${marker}\n## ⚠️ Go Benchmarks (Tier 1) — Regression Detected\n\`\`\`\n${output}\n\`\`\`\n\n> This comment clears automatically once the regression is resolved.`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Save benchmark baseline (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p benchmarks/go
          cp tier1-bench.txt benchmarks/go/tier1-baseline.txt

      - name: Persist baseline to cache (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: benchmarks/go/tier1-baseline.txt
          key: bench-tier1-${{ github.run_id }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Tier 2: Full Go benchmark suite — push to main only.
  # Baseline persisted to benchmarks/go/tier2-baseline.txt via GitHub Actions
  # cache (not committed — see "Baselines" note at the top of this file).
  # Uses a separate baseline file so it never pollutes the Tier 1 comparison.
  # ─────────────────────────────────────────────────────────────────────────────
  go-tier2:
    name: Go Benchmarks (Tier 2 - Extended)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # Only run on push to main, not on PRs (too slow for per-PR checks)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run full benchmark suite
        run: |
          go test \
            -bench=. \
            -run='^$' \
            -benchmem \
            -count=8 \
            -timeout=30m \
            ./... | tee tier2-bench.txt

      - name: Save benchmark baseline
        run: |
          mkdir -p benchmarks/go
          cp tier2-bench.txt benchmarks/go/tier2-baseline.txt

      - name: Persist baseline to cache
        uses: actions/cache/save@v4
        with:
          path: benchmarks/go/tier2-baseline.txt
          key: bench-tier2-${{ github.run_id }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend: Bundle size gate via size-limit.
  # Blocks PRs where the JS bundle grows by more than 10%.
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-bundle:
    name: Frontend Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.27.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: web-app/pnpm-lock.yaml

      - name: Install dependencies
        run: cd web-app && pnpm install --frozen-lockfile

      - name: Install buf
        run: |
          curl -sSL "https://github.com/bufbuild/buf/releases/download/v1.41.0/buf-Linux-x86_64" \
            -o /usr/local/bin/buf && chmod +x /usr/local/bin/buf

      - name: Generate protobuf code
        run: buf generate proto

      - name: Build Next.js app
        run: cd web-app && pnpm run build

      - name: Check bundle size
        run: cd web-app && npx size-limit

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend: Playwright terminal throughput benchmark.
  # Measures bytes/second rendered by xterm.js under realistic load.
  # On push to main: saves updated baseline to the "bench-frontend-throughput-" cache.
  # On PR: compares against baseline and posts a PR comment.
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-throughput:
    name: Frontend Terminal Throughput
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: frontend-bundle
    permissions:
      contents: read
      pull-requests: write # Post PR comments on regression alerts
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.27.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: web-app/pnpm-lock.yaml

      - name: Install dependencies
        run: cd web-app && pnpm install --frozen-lockfile

      - name: Install buf
        run: |
          curl -sSL "https://github.com/bufbuild/buf/releases/download/v1.41.0/buf-Linux-x86_64" \
            -o /usr/local/bin/buf && chmod +x /usr/local/bin/buf

      - name: Generate protobuf code
        run: buf generate proto

      - name: Install Playwright browsers
        run: cd web-app && npx playwright install --with-deps chromium

      - name: Build Next.js app
        run: cd web-app && pnpm run build

      - name: Run terminal throughput benchmark
        run: |
          set -o pipefail
          cd web-app && npx playwright test tests/e2e/benchmarks/terminal-throughput.spec.ts --reporter=json 2>&1 | tee /tmp/throughput-raw.txt

      - name: Assert benchmark data was produced
        run: |
          if [ ! -f web-app/benchmark-results.json ]; then
            echo "ERROR: benchmark-results.json was not produced — benchmark test failed or was skipped" >&2
            exit 1
          fi
          cat web-app/benchmark-results.json

      - name: Restore benchmark baseline (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: benchmarks/frontend/throughput-baseline.json
          key: bench-frontend-throughput-
          restore-keys: |
            bench-frontend-throughput-

      - name: Compare against baseline (PR only)
        if: github.event_name == 'pull_request'
        id: compare
        run: |
          if [ -f benchmarks/frontend/throughput-baseline.json ]; then
            node -e "
              const gate = require('./tools/ci-gates/benchmark-regression.js');
              const baseline = JSON.parse(require('fs').readFileSync('benchmarks/frontend/throughput-baseline.json', 'utf8'));
              const current  = JSON.parse(require('fs').readFileSync('web-app/benchmark-results.json', 'utf8'));
              const pctNums = [];
              const rows = current.map(c => {
                const b = baseline.find(e => e.name === c.name);
                if (!b) return c.name + ': no baseline';
                const pctNum = (c.value - b.value) / b.value * 100;
                pctNums.push(pctNum);
                const pct = pctNum.toFixed(1);
                const sign = pctNum >= 0 ? '+' : '';
                const arrow = c.value >= b.value ? '▲' : '▼';
                return c.name + ': ' + (c.value/1024).toFixed(0) + ' KB/s ' + arrow + ' ' + sign + pct + '% (baseline: ' + (b.value/1024).toFixed(0) + ' KB/s)';
              });
              require('fs').writeFileSync('throughput-comparison.txt', rows.join('\n'));
              require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'has_regression=' + gate.hasThroughputRegression(pctNums) + '\n');
              console.log(rows.join('\n'));
            "
            echo "## Frontend Terminal Throughput" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat throughput-comparison.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No baseline yet — will be established on next push to main." > throughput-comparison.txt
            echo "has_regression=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        continue-on-error: true # advisory comment; never fail the job if posting is denied
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          HAS_REGRESSION: ${{ steps.compare.outputs.has_regression }}
        with:
          script: |
            const marker = '<!-- benchmark-frontend-throughput -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (process.env.HAS_REGRESSION !== 'true') {
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                });
              }
              return;
            }
            const fs = require('fs');
            const output = fs.existsSync('throughput-comparison.txt')
              ? fs.readFileSync('throughput-comparison.txt', 'utf8').trim()
              : 'No comparison available.';
            const body = `${marker}\n## ⚠️ Frontend Terminal Throughput — Regression Detected\n\`\`\`\n${output}\n\`\`\`\n\n> This comment clears automatically once the regression is resolved.`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Save benchmark baseline (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p benchmarks/frontend
          cp web-app/benchmark-results.json benchmarks/frontend/throughput-baseline.json

      - name: Persist baseline to cache (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: benchmarks/frontend/throughput-baseline.json
          key: bench-frontend-throughput-${{ github.run_id }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Lighthouse CI: Advisory performance audit (non-blocking).
  # Runs Core Web Vitals and performance audits; never blocks merge.
  # ─────────────────────────────────────────────────────────────────────────────
  lighthouse:
    name: Lighthouse CI (Advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: frontend-bundle
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.27.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: web-app/pnpm-lock.yaml

      - name: Install dependencies
        run: cd web-app && pnpm install --frozen-lockfile

      - name: Install buf
        run: |
          curl -sSL "https://github.com/bufbuild/buf/releases/download/v1.41.0/buf-Linux-x86_64" \
            -o /usr/local/bin/buf && chmod +x /usr/local/bin/buf

      - name: Generate protobuf code
        run: buf generate proto

      - name: Build Next.js app
        run: cd web-app && pnpm run build

      - name: Run Lighthouse CI
        run: cd web-app && pnpm dlx @lhci/cli autorun
        continue-on-error: true  # Advisory only — never blocks merge

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lighthouse-results
          path: web-app/.lighthouseci/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # E2E Latency: Playwright RPC timing benchmarks.
  # Measures ListSessions TTFB, total RPC time, and React render time separately.
  # On push to main: saves updated baseline to the "bench-e2e-latency-" cache.
  # On PR: compares against baseline and posts a PR comment.
  # ─────────────────────────────────────────────────────────────────────────────
  e2e-latency:
    name: E2E RPC Latency
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: frontend-bundle
    permissions:
      contents: read
      pull-requests: write # Post PR comments on regression alerts
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.27.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: web-app/pnpm-lock.yaml

      - name: Install dependencies
        run: cd web-app && pnpm install --frozen-lockfile

      - name: Install buf
        run: |
          curl -sSL "https://github.com/bufbuild/buf/releases/download/v1.41.0/buf-Linux-x86_64" \
            -o /usr/local/bin/buf && chmod +x /usr/local/bin/buf

      - name: Generate protobuf code
        run: buf generate proto

      - name: Generate ent ORM code
        run: go run -mod=mod entgo.io/ent/cmd/ent generate --feature sql/upsert ./session/ent/schema

      - name: Build Next.js app
        run: pnpm run build
        working-directory: web-app

      - name: Copy web UI to dist
        run: cp -r web-app/out server/web/dist

      - name: Install Playwright browsers
        run: cd web-app && npx playwright install --with-deps chromium

      - name: Build Go binary
        run: go build -o stapler-squad .

      - name: Start backend server
        run: |
          ./stapler-squad &
          cd web-app && npx wait-on http://localhost:8543 --timeout 30000

      - name: Run E2E latency benchmark
        env:
          TEST_PORT: '8543'
          TEST_REUSE_SERVER: '1'
        run: cd web-app && npx playwright test tests/e2e/benchmarks/rpc-latency.spec.ts

      - name: Assert E2E latency data was produced
        run: |
          if [ ! -f web-app/e2e-latency-results.json ]; then
            echo "ERROR: e2e-latency-results.json was not produced — benchmark test failed or was skipped" >&2
            exit 1
          fi
          cat web-app/e2e-latency-results.json

      - name: Restore benchmark baseline (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: benchmarks/e2e/latency-baseline.json
          key: bench-e2e-latency-
          restore-keys: |
            bench-e2e-latency-

      - name: Compare against baseline (PR only)
        if: github.event_name == 'pull_request'
        id: compare
        run: |
          if [ -f benchmarks/e2e/latency-baseline.json ]; then
            node -e "
              const gate = require('./tools/ci-gates/benchmark-regression.js');
              const baseline = JSON.parse(require('fs').readFileSync('benchmarks/e2e/latency-baseline.json', 'utf8'));
              const current  = JSON.parse(require('fs').readFileSync('web-app/e2e-latency-results.json', 'utf8'));
              const pctNums = [];
              const rows = current.map(c => {
                const b = baseline.find(e => e.name === c.name);
                if (!b) return c.name + ': no baseline';
                const pctNum = (c.value - b.value) / b.value * 100;
                pctNums.push(pctNum);
                const pct = pctNum.toFixed(1);
                const sign = pctNum >= 0 ? '+' : '';
                const arrow = c.value <= b.value ? '▼ faster' : '▲ slower';
                return c.name + ': ' + c.value.toFixed(0) + 'ms (' + arrow + ' ' + sign + pct + '%; baseline: ' + b.value.toFixed(0) + 'ms)';
              });
              require('fs').writeFileSync('latency-comparison.txt', rows.join('\n'));
              require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'has_regression=' + gate.hasLatencyRegression(pctNums) + '\n');
              console.log(rows.join('\n'));
            "
            echo "## E2E RPC Latency" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat latency-comparison.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No baseline yet — will be established on next push to main." > latency-comparison.txt
            echo "has_regression=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        continue-on-error: true # advisory comment; never fail the job if posting is denied
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          HAS_REGRESSION: ${{ steps.compare.outputs.has_regression }}
        with:
          script: |
            const marker = '<!-- benchmark-e2e-latency -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (process.env.HAS_REGRESSION !== 'true') {
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                });
              }
              return;
            }
            const fs = require('fs');
            const output = fs.existsSync('latency-comparison.txt')
              ? fs.readFileSync('latency-comparison.txt', 'utf8').trim()
              : 'No comparison available.';
            const body = `${marker}\n## ⚠️ E2E RPC Latency — Regression Detected\n\`\`\`\n${output}\n\`\`\`\n\n> This comment clears automatically once the regression is resolved.`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Save benchmark baseline (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p benchmarks/e2e
          cp web-app/e2e-latency-results.json benchmarks/e2e/latency-baseline.json

      - name: Persist baseline to cache (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: benchmarks/e2e/latency-baseline.json
          key: bench-e2e-latency-${{ github.run_id }}
