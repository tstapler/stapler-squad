name: Benchmarks

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'web-app/src/**'
      - 'web-app/package.json'
      - 'web-app/bun.lock'
      - '.github/workflows/benchmark.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'web-app/src/**'
      - 'web-app/package.json'
      - 'web-app/bun.lock'
      - '.github/workflows/benchmark.yml'

# Cancel in-progress runs on PRs when a new commit is pushed.
# On main, never cancel — baseline-save steps must be allowed to complete.
#
# Baselines: each job's baseline lives in a GitHub Actions cache entry (key
# "bench-<name>-<run_id>", restored by "bench-<name>-" prefix match), not a
# file committed to git — a prior version of this workflow committed updated
# baselines to `benchmarks/` on every push to main, which flooded the commit
# history with "chore(bench): update ... baseline" noise for very little
# value. Cache gives the same "PRs compare against the latest main baseline"
# behavior without touching git history. See individual job comments for the
# cache key used by that job's baseline file.
concurrency:
  # Shared with build.yml benchmark-gate so runs are serialized (avoids
  # redundant concurrent benchmark runs contending for runner resources).
  group: baseline-push-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Tier 1: Critical-path Go benchmarks — run on every PR and push to main.
  # Regex covers the highest-signal benchmarks across the codebase:
  #   - EventBus (events package)
  #   - DeltaGeneration (terminal package)
  #   - CircularBuffer (scrollback package)
  #   - SessionService_ListSessions, GetSession, StreamTerminal (services package)
  # On push to main: saves updated baseline to the "bench-tier1-" cache.
  # On PR: restores the latest baseline from cache, diffs with benchdiff (sticky PR comment).
  # ─────────────────────────────────────────────────────────────────────────────
  go-tier1:
    name: Go Benchmarks (Tier 1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # Post PR comments on regression alerts
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install buf
        run: |
          curl -sSL "https://github.com/bufbuild/buf/releases/download/v1.41.0/buf-Linux-x86_64" \
            -o /usr/local/bin/buf && chmod +x /usr/local/bin/buf

      - name: Generate protobuf code
        # Go-only template: this job never installs bun/node (it doesn't need
        # a web UI build), so the default buf.gen.yaml's local protoc-gen-es
        # plugin (web-app/node_modules/.bin/protoc-gen-es) isn't present and
        # `buf generate proto` would fail outright. buf.gen.go-only.yaml
        # generates only the Go/ConnectRPC output these target packages need.
        run: buf generate proto --template buf.gen.go-only.yaml

      - name: Generate ent ORM code
        run: go run -mod=mod entgo.io/ent/cmd/ent generate --feature sql/upsert ./session/ent/schema

      - name: Run Tier 1 benchmarks
        run: |
          set -o pipefail
          go test \
            -bench='BenchmarkEventBus|BenchmarkDeltaGenerat|BenchmarkCircularBuffer|BenchmarkGetTimeSinceLastMeaningfulOutput|BenchmarkStripANSI|BenchmarkStripANSICodes|BenchmarkIsBanner|BenchmarkProcessOutput|BenchmarkDiffShortstat$|BenchmarkDiffShortstatCached$|BenchmarkReviewQueue|BenchmarkDetectCommandsInText|BenchmarkTokenParser|BenchmarkListShippedCommitsWithCap|BenchmarkStopController_NoOpFastPath|BenchmarkSetHistoryInfo_NoOpFastPath|BenchmarkWorktreeIsDirty_FastVsGoGit|BenchmarkCountCommitsNotAncestorOf|BenchmarkTrackedFileStat|BenchmarkUntrackedWalk|BenchmarkMultiWorktreeAheadBehind|BenchmarkReachableSetShared|BenchmarkHasUncommittedClean|BenchmarkHeadTreeMapShared|BenchmarkShortstatLines|BenchmarkCommitParents' \
            -run='^$' \
            -benchmem \
            -count=8 \
            -timeout=10m \
            ./server/events ./server/terminal ./session/scrollback \
            ./session ./session/detection/ratelimit ./session/tmux \
            ./session/unfinished ./session/queue ./session/tokens ./session/git | tee tier1-bench.txt

      - name: Restore benchmark baseline (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: benchmarks/go/tier1-baseline.txt
          key: bench-tier1-
          restore-keys: |
            bench-tier1-

      # Same Mann-Whitney test benchstat used (alpha 0.05, count=8). The sticky
      # comment replaces the old hand-written one and stays visible even when
      # nothing regressed. fail-on-regression 20 mirrors the old 20% gate;
      # continue-on-error keeps PRs advisory-only, as before (the step still
      # shows red on a regression).
      - name: Compare against baseline (PR only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: tstapler/benchdiff@3921c948d6d9cbc538a62d3808d979c06cc13a94 # v0.1.0
        with:
          head: tier1-bench.txt
          base: ${{ hashFiles('benchmarks/go/tier1-baseline.txt') != '' && 'benchmarks/go/tier1-baseline.txt' || '' }}
          format: go
          tag: go-tier1
          title: Go Benchmarks (Tier 1)
          fail-on-regression: 20

      - name: Save benchmark baseline (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p benchmarks/go
          cp tier1-bench.txt benchmarks/go/tier1-baseline.txt

      - name: Persist baseline to cache (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: benchmarks/go/tier1-baseline.txt
          key: bench-tier1-${{ github.run_id }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Tier 2: Full Go benchmark suite — push to main only.
  # Baseline persisted to benchmarks/go/tier2-baseline.txt via GitHub Actions
  # cache (not committed — see "Baselines" note at the top of this file).
  # Uses a separate baseline file so it never pollutes the Tier 1 comparison.
  # ─────────────────────────────────────────────────────────────────────────────
  go-tier2:
    name: Go Benchmarks (Tier 2 - Extended)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # Only run on push to main, not on PRs (too slow for per-PR checks)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run full benchmark suite
        run: |
          go test \
            -bench=. \
            -run='^$' \
            -benchmem \
            -count=8 \
            -timeout=30m \
            ./... | tee tier2-bench.txt

      - name: Save benchmark baseline
        run: |
          mkdir -p benchmarks/go
          cp tier2-bench.txt benchmarks/go/tier2-baseline.txt

      - name: Persist baseline to cache
        uses: actions/cache/save@v4
        with:
          path: benchmarks/go/tier2-baseline.txt
          key: bench-tier2-${{ github.run_id }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend: Bundle size gate via size-limit.
  # Blocks PRs where the JS bundle grows by more than 10%.
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-bundle:
    name: Frontend Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # .size-limit.json's 6,349,052B cap (Story 5.9) is calibrated against the
    # Bun build (minified by build.ts's default); building Next here instead
    # measured Next's naturally larger, differently-chunked output against it.
    env:
      WEB_BUILD: bun
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd web-app && bun install --frozen-lockfile

      - name: Install buf
        run: |
          curl -sSL "https://github.com/bufbuild/buf/releases/download/v1.41.0/buf-Linux-x86_64" \
            -o /usr/local/bin/buf && chmod +x /usr/local/bin/buf

      - name: Generate protobuf code
        run: buf generate proto

      # Same pattern as .github/actions/prepare/action.yml's "Cache Next.js
      # build cache" step — see its comment for why the key includes both the
      # lockfile and src hash, with restore-keys fallbacks.
      - name: Cache Next.js build cache
        if: env.WEB_BUILD != 'bun'
        uses: actions/cache@v4
        with:
          path: web-app/.next/cache
          key: nextjs-bundle-${{ runner.os }}-${{ hashFiles('web-app/bun.lock') }}-${{ hashFiles('web-app/src/**') }}
          restore-keys: |
            nextjs-bundle-${{ runner.os }}-${{ hashFiles('web-app/bun.lock') }}-
            nextjs-bundle-${{ runner.os }}-

      - name: Build web UI (Bun, minified)
        run: cd web-app && bun run build

      - name: Check bundle size
        run: cd web-app && npx size-limit

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend: Playwright terminal throughput benchmark.
  # Measures bytes/second rendered by xterm.js under realistic load.
  # On push to main: saves updated baseline to the "bench-frontend-throughput-" cache.
  # On PR: compares against baseline and posts a PR comment.
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-throughput:
    name: Frontend Terminal Throughput
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: frontend-bundle
    permissions:
      contents: read
      pull-requests: write # Post PR comments on regression alerts
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd web-app && bun install --frozen-lockfile

      - name: Install buf
        run: |
          curl -sSL "https://github.com/bufbuild/buf/releases/download/v1.41.0/buf-Linux-x86_64" \
            -o /usr/local/bin/buf && chmod +x /usr/local/bin/buf

      - name: Generate protobuf code
        run: buf generate proto

      # Same pattern as .github/actions/prepare/action.yml's "Cache Next.js
      # build cache" step — see its comment for why the key includes both the
      # lockfile and src hash, with restore-keys fallbacks.
      - name: Cache Next.js build cache
        if: env.WEB_BUILD != 'bun'
        uses: actions/cache@v4
        with:
          path: web-app/.next/cache
          key: nextjs-throughput-${{ runner.os }}-${{ hashFiles('web-app/bun.lock') }}-${{ hashFiles('web-app/src/**') }}
          restore-keys: |
            nextjs-throughput-${{ runner.os }}-${{ hashFiles('web-app/bun.lock') }}-
            nextjs-throughput-${{ runner.os }}-

      - name: Install Playwright browsers
        # apt-get update (invoked internally by --with-deps) has stalled for
        # ~29 minutes against Ubuntu archive mirrors before now — a transient
        # CI network flake unrelated to this repo. Bound each attempt so a
        # stall fails fast and retries against a fresh mirror connection
        # instead of eating the whole job timeout.
        run: |
          cd web-app
          for attempt in 1 2 3; do
            if timeout 8m npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Playwright install attempt $attempt failed or timed out; retrying..."
            sleep 10
          done
          echo "Playwright install failed after 3 attempts" >&2
          exit 1

      - name: Build Next.js app
        run: cd web-app && bun run build

      - name: Run terminal throughput benchmark
        run: |
          set -o pipefail
          cd web-app && npx playwright test tests/e2e/benchmarks/terminal-throughput.spec.ts --reporter=json 2>&1 | tee /tmp/throughput-raw.txt

      - name: Assert benchmark data was produced
        run: |
          if [ ! -f web-app/benchmark-results.json ]; then
            echo "ERROR: benchmark-results.json was not produced — benchmark test failed or was skipped" >&2
            exit 1
          fi
          cat web-app/benchmark-results.json

      - name: Restore benchmark baseline (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: benchmarks/frontend/throughput-baseline.json
          key: bench-frontend-throughput-
          restore-keys: |
            bench-frontend-throughput-

      # benchmark-results.json is github-action-benchmark "customBiggerIsBetter"
      # JSON, which benchdiff reads natively as gab-bigger (no adapter needed).
      # Single sample per metric, so judged by threshold only; fail-on-regression
      # 50 mirrors the old "throughput halved" gate, advisory as before.
      - name: Compare against baseline (PR only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: tstapler/benchdiff@3921c948d6d9cbc538a62d3808d979c06cc13a94 # v0.1.0
        with:
          head: web-app/benchmark-results.json
          base: ${{ hashFiles('benchmarks/frontend/throughput-baseline.json') != '' && 'benchmarks/frontend/throughput-baseline.json' || '' }}
          format: gab-bigger
          tag: frontend-throughput
          title: Frontend Terminal Throughput
          fail-on-regression: 50

      - name: Save benchmark baseline (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p benchmarks/frontend
          cp web-app/benchmark-results.json benchmarks/frontend/throughput-baseline.json

      - name: Persist baseline to cache (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: benchmarks/frontend/throughput-baseline.json
          key: bench-frontend-throughput-${{ github.run_id }}

  # ─────────────────────────────────────────────────────────────────────────────
  # E2E Latency: Playwright RPC timing benchmarks.
  # Measures ListSessions TTFB, total RPC time, and React render time separately.
  # On push to main: saves updated baseline to the "bench-e2e-latency-" cache.
  # On PR: compares against baseline and posts a PR comment.
  # ─────────────────────────────────────────────────────────────────────────────
  e2e-latency:
    name: E2E RPC Latency
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: frontend-bundle
    permissions:
      contents: read
      pull-requests: write # Post PR comments on regression alerts
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd web-app && bun install --frozen-lockfile

      - name: Install buf
        run: |
          curl -sSL "https://github.com/bufbuild/buf/releases/download/v1.41.0/buf-Linux-x86_64" \
            -o /usr/local/bin/buf && chmod +x /usr/local/bin/buf

      - name: Generate protobuf code
        run: buf generate proto

      - name: Generate ent ORM code
        run: go run -mod=mod entgo.io/ent/cmd/ent generate --feature sql/upsert ./session/ent/schema

      # Same pattern as .github/actions/prepare/action.yml's "Cache Next.js
      # build cache" step — see its comment for why the key includes both the
      # lockfile and src hash, with restore-keys fallbacks.
      - name: Cache Next.js build cache
        if: env.WEB_BUILD != 'bun'
        uses: actions/cache@v4
        with:
          path: web-app/.next/cache
          key: nextjs-e2e-latency-${{ runner.os }}-${{ hashFiles('web-app/bun.lock') }}-${{ hashFiles('web-app/src/**') }}
          restore-keys: |
            nextjs-e2e-latency-${{ runner.os }}-${{ hashFiles('web-app/bun.lock') }}-
            nextjs-e2e-latency-${{ runner.os }}-

      - name: Build Next.js app
        run: bun run build
        working-directory: web-app

      - name: Copy web UI to dist
        run: cp -r web-app/out server/web/dist

      - name: Install Playwright browsers
        # apt-get update (invoked internally by --with-deps) has stalled for
        # ~29 minutes against Ubuntu archive mirrors before now — a transient
        # CI network flake unrelated to this repo. Bound each attempt so a
        # stall fails fast and retries against a fresh mirror connection
        # instead of eating the whole job timeout.
        run: |
          cd web-app
          for attempt in 1 2 3; do
            if timeout 8m npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Playwright install attempt $attempt failed or timed out; retrying..."
            sleep 10
          done
          echo "Playwright install failed after 3 attempts" >&2
          exit 1

      - name: Build Go binary
        run: go build -o stapler-squad .

      - name: Start backend server
        run: |
          ./stapler-squad &
          cd web-app && npx wait-on http://localhost:8543 --timeout 30000

      - name: Run E2E latency benchmark
        env:
          TEST_PORT: '8543'
          TEST_REUSE_SERVER: '1'
        run: cd web-app && npx playwright test tests/e2e/benchmarks/rpc-latency.spec.ts

      - name: Assert E2E latency data was produced
        run: |
          if [ ! -f web-app/e2e-latency-results.json ]; then
            echo "ERROR: e2e-latency-results.json was not produced — benchmark test failed or was skipped" >&2
            exit 1
          fi
          cat web-app/e2e-latency-results.json

      - name: Restore benchmark baseline (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: benchmarks/e2e/latency-baseline.json
          key: bench-e2e-latency-
          restore-keys: |
            bench-e2e-latency-

      - name: Compare against baseline (PR only)
        if: github.event_name == 'pull_request'
        id: compare
        run: |
          if [ -f benchmarks/e2e/latency-baseline.json ]; then
            node -e "
              const gate = require('./tools/ci-gates/benchmark-regression.js');
              const baseline = JSON.parse(require('fs').readFileSync('benchmarks/e2e/latency-baseline.json', 'utf8'));
              const current  = JSON.parse(require('fs').readFileSync('web-app/e2e-latency-results.json', 'utf8'));
              const pctNums = [];
              const rows = current.map(c => {
                const b = baseline.find(e => e.name === c.name);
                if (!b) return c.name + ': no baseline';
                const pctNum = (c.value - b.value) / b.value * 100;
                pctNums.push(pctNum);
                const pct = pctNum.toFixed(1);
                const sign = pctNum >= 0 ? '+' : '';
                const arrow = c.value <= b.value ? '▼ faster' : '▲ slower';
                return c.name + ': ' + c.value.toFixed(0) + 'ms (' + arrow + ' ' + sign + pct + '%; baseline: ' + b.value.toFixed(0) + 'ms)';
              });
              require('fs').writeFileSync('latency-comparison.txt', rows.join('\n'));
              require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'has_regression=' + gate.hasLatencyRegression(pctNums) + '\n');
              console.log(rows.join('\n'));
            "
            echo "## E2E RPC Latency" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat latency-comparison.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No baseline yet — will be established on next push to main." > latency-comparison.txt
            echo "has_regression=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        continue-on-error: true # advisory comment; never fail the job if posting is denied
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          HAS_REGRESSION: ${{ steps.compare.outputs.has_regression }}
        with:
          script: |
            const marker = '<!-- benchmark-e2e-latency -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (process.env.HAS_REGRESSION !== 'true') {
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                });
              }
              return;
            }
            const fs = require('fs');
            const output = fs.existsSync('latency-comparison.txt')
              ? fs.readFileSync('latency-comparison.txt', 'utf8').trim()
              : 'No comparison available.';
            const body = `${marker}\n## ⚠️ E2E RPC Latency — Regression Detected\n\`\`\`\n${output}\n\`\`\`\n\n> This comment clears automatically once the regression is resolved.`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Save benchmark baseline (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p benchmarks/e2e
          cp web-app/e2e-latency-results.json benchmarks/e2e/latency-baseline.json

      - name: Persist baseline to cache (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: benchmarks/e2e/latency-baseline.json
          key: bench-e2e-latency-${{ github.run_id }}

  # ─────────────────────────────────────────────────────────────────────────────
  # E2E Perf Budget: frontend-responsiveness Playwright `perf` project (Story 7.1.3).
  # Runs tests/e2e/perf/ against an isolated server (global-setup.ts) with a
  # 20-session tmux fixture, then tools/ci-gates/perf-budget.js compares medians
  # to the baseline and checks per-method request-count budgets.
  # Advisory by default: the check never fails on regressions. Flip
  # PERF_BUDGET_BLOCKING to '1' (Task 7.1.3b, after the soak window and owner
  # sign-off) to make only the count-based subset blocking; timing metrics stay
  # advisory either way. The baseline lives in the "bench-e2e-perf-" cache
  # (saved on push to main, so it is measured on the same runner class); the
  # committed tests/e2e/perf/baseline.json is only a fallback when the cache is
  # empty. With no baseline at all the job still runs and reports count budgets.
  # ─────────────────────────────────────────────────────────────────────────────
  e2e-perf:
    name: E2E Perf Budget
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: frontend-bundle
    permissions:
      contents: read
      pull-requests: write # Post PR comment
    env:
      PERF_BUDGET_BLOCKING: '0'
      PERF_RUNS: '3'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd web-app && bun install --frozen-lockfile
          cd ../tests/e2e && bun install --frozen-lockfile

      - name: Install buf
        run: |
          curl -sSL "https://github.com/bufbuild/buf/releases/download/v1.41.0/buf-Linux-x86_64" \
            -o /usr/local/bin/buf && chmod +x /usr/local/bin/buf

      - name: Generate protobuf code
        run: buf generate proto

      - name: Generate ent ORM code
        run: go run -mod=mod entgo.io/ent/cmd/ent generate --feature sql/upsert ./session/ent/schema

      - name: Build web UI
        run: bun run build
        working-directory: web-app

      - name: Copy web UI to dist
        run: cp -r web-app/out server/web/dist

      - name: Build Go binary
        run: go build -o stapler-squad .

      - name: Install tmux (fixture seeds real sessions)
        run: command -v tmux >/dev/null || sudo apt-get install -y tmux

      - name: Install Playwright browsers
        run: |
          cd tests/e2e
          for attempt in 1 2 3; do
            if timeout 8m npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Playwright install attempt $attempt failed or timed out; retrying..."
            sleep 10
          done
          echo "Playwright install failed after 3 attempts" >&2
          exit 1

      # Never fails the job: the spec hard-fails on its own budgets, but timing is
      # runner-dependent. Blocking decisions are made by perf-budget.js below.
      - name: Run perf project
        id: perf
        continue-on-error: true
        env:
          TEST_SERVER_BINARY: ${{ github.workspace }}/stapler-squad
        run: cd tests/e2e && timeout 35m npx playwright test --project=perf

      - name: Assert perf results exist (blocking mode only)
        if: env.PERF_BUDGET_BLOCKING == '1'
        run: |
          test -f tests/e2e/test-results/perf-results.json || { echo "perf-results.json was not produced" >&2; exit 1; }

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-results
          path: tests/e2e/test-results/perf-results.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Restore perf baseline
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: benchmarks/e2e/perf-baseline.json
          key: bench-e2e-perf-
          restore-keys: |
            bench-e2e-perf-

      - name: Compare against baseline and check count budgets
        id: gate
        run: |
          BASELINE=benchmarks/e2e/perf-baseline.json
          [ -f "$BASELINE" ] || BASELINE=tests/e2e/perf/baseline.json
          [ -f "$BASELINE" ] || BASELINE=""
          node tools/ci-gates/perf-budget.js \
            --results tests/e2e/test-results/perf-results.json \
            ${BASELINE:+--baseline "$BASELINE"} \
            --out-md perf-comment.md >/dev/null
          cat perf-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true # advisory comment; never fail the job if posting is denied
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('perf-comment.md')) return;
            const body = fs.readFileSync('perf-comment.md', 'utf8');
            const marker = '<!-- benchmark-perf-budget -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Save perf baseline (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('tests/e2e/test-results/perf-results.json') != ''
        run: |
          mkdir -p benchmarks/e2e
          cp tests/e2e/test-results/perf-results.json benchmarks/e2e/perf-baseline.json

      - name: Persist perf baseline to cache (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('tests/e2e/test-results/perf-results.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: benchmarks/e2e/perf-baseline.json
          key: bench-e2e-perf-${{ github.run_id }}
