name: Prepare (reusable)

# Reusable workflow wrapping ./.github/actions/prepare so every consumer
# (build.yml, e2e-video.yml, ux-analysis.yml, ...) shares one implementation
# of "generate protos + build the web UI" instead of hand-rolling it per
# workflow file. registry-validation.yml used to be one such consumer; its
# divergence check was folded into build.yml's test-affected job instead
# (strictly subsumed by that job's exact-match registry diff), so the
# workflow file itself was deleted rather than kept as a 5th prepare call.
# See project_plans/ci-speed/implementation/plan.md Epic 3.1 (Story 3.1.1).
#
# Deliberately has no `if:`/`needs:` relevance gate — the calling workflow
# decides whether prepare is relevant (e.g. build.yml's detect-changes job)
# before it calls this one, not this file.

on:
  workflow_call:
    inputs:
      build-web-ui:
        description: >-
          Build the real web UI into server/web/dist. When false, only protos and ent are
          generated and dist is a one-file stub (enough for go:embed). build.yml passes false
          on pull_request: test-affected and go-guards never read the UI bytes, and
          e2e-binary-bun rebuilds it in Bun mode anyway.
        type: boolean
        default: true
    outputs:
      artifact-name:
        description: "Name of the uploaded generated-code artifact"
        value: "generated-files"

jobs:
  prepare:
    name: Generate & Build Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Runner utilization sampler
        uses: ./.github/actions/runner-utilization

      - name: Generate protos and build web UI
        if: ${{ inputs.build-web-ui }}
        uses: ./.github/actions/prepare

      - name: Set up Go (stub mode)
        if: ${{ !inputs.build-web-ui }}
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Generate protos and ent (web UI stubbed)
        if: ${{ !inputs.build-web-ui }}
        uses: ./.github/actions/prepare-stub

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: generated-files
          path: |
            gen/
            session/ent/
            server/web/dist/
            session/ent/
          retention-days: 1

      - name: Runner utilization report
        if: always()
        uses: ./.github/actions/runner-utilization/report
        with:
          label: prepare
