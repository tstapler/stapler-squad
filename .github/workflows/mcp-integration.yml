name: MCP Integration Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'server/mcp/**'
      - 'server/services/**'
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/mcp-integration.yml'
  # No paths: filter here (unlike push above) — branch protection requires
  # this job's "MCP Integration Tests" status check, and a workflow that
  # never triggers for a given PR never posts ANY status for that check,
  # leaving GitHub's required-check gate permanently "expected, never
  # reported" instead of skipped-and-passing — blocking merge forever
  # regardless of what else passed (see PR #618/#619, and build.yml's
  # matching detect-changes gate for the "Test" check hitting the same
  # issue). A job *skipped* via `if:` counts as a passing status for
  # required checks (documented GitHub Actions behavior), so detect-changes
  # below moves the same path-relevance check from the trigger into a job
  # condition instead. push (above) keeps its paths: filter untouched — a
  # push to main that never triggers this workflow isn't blocked by
  # anything, since there's no PR being merged for it to gate.
  pull_request:
    branches: [ main ]

# Cancel a superseded run's in-flight jobs. Applies to both pull_request and
# push-to-main triggers — cancelling a superseded push-to-main run is
# harmless here since this workflow writes no shared state.
concurrency:
  group: mcp-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # PR-only relevance gate — see the pull_request trigger's comment above.
  # Mirrors the same path list the old pull_request paths: filter used to have.
  detect-changes:
    name: Detect Relevant Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      # No checkout: see build.yml's detect-changes job for why -- this
      # repo's ~16GB .git pack makes a `fetch-depth: 0` full-history clone
      # take minutes just to diff file paths. The compare API gives the same
      # three-dot (merge-base) file list with no clone at all.
      - name: Detect server/mcp, server/services, or Go module changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHANGED=$(gh api "repos/${{ github.repository }}/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" --paginate --jq '.files[].filename')
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^server/mcp/|^server/services/|^main\.go$|^go\.(mod|sum)$|^\.github/workflows/mcp-integration\.yml$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  mcp-integration:
    name: MCP Integration Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    # always() is required, not decorative — see build.yml's `prepare` job for
    # the full explanation. Without it, this job silently skips on every push
    # to main/workflow_dispatch (detect-changes is skipped there too, and a
    # skipped needs: job fails the implicit success() check any if: without
    # a status function otherwise gets ANDed with).
    if: always() && (github.event_name != 'pull_request' || needs.detect-changes.outputs.relevant == 'true')
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      # server/mcp and server/services tests don't assert on rendered UI
      # content (neither package imports server/web or its go:embed'd
      # dist/ output) — only go build/go test compiling against the
      # go:embed directive in server/web/embed.go, so a real Next.js
      # build is wasted work here. See plan.md Epic 3.2 Story 3.2.1.
      - name: Generate protos and stub web UI
        uses: ./.github/actions/prepare-stub

      # The integration test (TestMCPHandshakeSubprocess) spawns a real
      # --mcp subprocess and exercises the full MCP stdio handshake.
      # It calls `go build` internally, so the Go toolchain must be present.
      # It's the only file in this job's scope actually gated behind
      # -tags=integration (server/mcp/server_integration_test.go); server/services
      # carries no integration-tagged tests of its own.
      #
      # server/services runs WITHOUT -race here (unlike server/mcp above):
      # the pure-Go sqlite driver (modernc.org/sqlite, see
      # backlog/stapler-squad-fix-cgo-release-sqlite-driver) made
      # session.NewEntRepository()'s ent schema migration measurably more
      # expensive under -race than the old cgo driver (~2.9s/call under
      # -race vs. ~0.77s without, measured locally against this branch),
      # and server/services has 308 call sites of the createTestStorage(t)
      # helper that each pay this cost once — under -race that alone
      # repeatedly blew this job's budget (BUG-083/BUG-099). test-rest
      # (build.yml) already runs server/services under -race unconditionally
      # on every PR (no path filter), so this job doesn't need a second
      # race-instrumented pass — running it here without -race keeps this
      # job's own coverage of server/services (per #616, so a bug here still
      # fails this required check even if only server/services changed)
      # without paying the race tax twice.
      #
      # Soft-timeout wrapper: 25m soft budget below this job's 30m hard
      # timeout-minutes: ceiling, so a budget breach fails this step with
      # a diagnosable marker instead of a bare GHA-killed `timed_out`.
      # keep this marker prefix in sync with ciBudgetExceededMarker in server/services/github_webhook_pr_fix.go
      - name: Run MCP integration tests
        run: |
          timeout 25m bash -c '
            set -e
            go test -tags=integration -timeout=1200s -v -race ./server/mcp/...
            go test -tags=integration -timeout=1200s -v ./server/services/...
          ' || { echo "::error::CI-BUDGET-EXCEEDED: 'mcp-integration' exceeded its 25m budget"; echo "CI-BUDGET-EXCEEDED: 'mcp-integration' exceeded its 25m budget" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
