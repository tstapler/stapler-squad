name: MCP Integration Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'server/mcp/**'
      - 'server/services/**'
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/mcp-integration.yml'
  # Same paths: filter as push. The old design ran every PR through a detect-changes job so a
  # required check always reported; main has no branch protection (no required checks), so a
  # workflow-level filter is safe and avoids a skipped check on every unrelated PR.
  pull_request:
    branches: [ main ]
    paths:
      - 'server/mcp/**'
      - 'server/services/**'
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/mcp-integration.yml'

# Cancel a superseded PR run's in-flight jobs; main-branch runs are never cancelled.
concurrency:
  group: mcp-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # One job, two sequential suites (was a 2-leg matrix + detect-changes + aggregate = 4 checks).
  # Serialized test time is ~290s + ~110s; the setup it no longer repeats is ~1 min.
  mcp-integration:
    name: MCP Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60  # two suites with 25m soft caps each: the hard kill must not pre-empt the CI-BUDGET-EXCEEDED marker
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      # server/mcp and server/services tests don't assert on rendered UI content, only on
      # compiling against the go:embed directive in server/web/embed.go, so a stub dist is enough.
      - name: Generate protos and stub web UI
        uses: ./.github/actions/prepare-stub

      # TestMCPHandshakeSubprocess spawns a real --mcp subprocess and calls `go build` itself.
      #
      # server/services runs WITHOUT -race: the pure-Go sqlite driver made
      # session.NewEntRepository()'s ent schema migration ~2.9s/call under -race (vs ~0.77s
      # without), and server/services has 308 createTestStorage(t) call sites (BUG-083/BUG-099).
      # build.yml's test-affected/test-rest already run server/services under -race.
      #
      # Each suite has a 25m soft budget under the job's 40m hard ceiling, so a breach fails with a
      # diagnosable marker. Both suites always run so one failure does not hide the other.
      - name: Run MCP integration tests (mcp, -race)
        id: suite-mcp
        env:
          SUITE: mcp
          PACKAGES: ./server/mcp/...
          RACE: '-race'
        run: bash .github/scripts/mcp-suite.sh

      - name: Run MCP integration tests (services)
        if: always() && steps.suite-mcp.conclusion != 'skipped'
        env:
          SUITE: services
          PACKAGES: ./server/services/...
          RACE: ''
        run: bash .github/scripts/mcp-suite.sh
