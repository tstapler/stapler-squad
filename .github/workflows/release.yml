name: Release (manual escape hatch)

# This workflow used to also trigger on `push: tags: v*`, on the theory that
# release-please.yml pushing a `vX.Y.Z` tag would kick this off. That never
# worked: release-please.yml authenticates with the default GITHUB_TOKEN
# (no RELEASE_TOKEN secret was ever configured in this repo — verified via
# `gh secret list`), and GitHub Actions deliberately does not let a push/tag
# made by the default GITHUB_TOKEN trigger other workflows (anti-recursion
# protection). Confirmed in practice: `gh run list --workflow=release.yml`
# shows zero runs, ever, and every existing GitHub "release" (v1.35.0,
# v1.37.0, etc.) has no attached binaries and never updated the Homebrew
# formula.
#
# The real release build now happens in `release-please.yml`, as a second
# job in the SAME workflow run that release-please itself runs in (gated on
# its `release_created` output) — no second triggered workflow run is
# involved, so the token-recursion problem is structurally impossible there.
#
# This workflow is kept only as a manual escape hatch: if a release ever
# needs to be rebuilt/republished for an existing tag (e.g. GoReleaser
# failed partway through, or an asset needs regenerating), run it via
# `workflow_dispatch` with the tag to build.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and publish (e.g. v1.37.0)'
        required: true

jobs:
  build:
    permissions:
      contents: write
    name: Build Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out code at the requested tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      # See release-please.yml's identical step for why this replaced eight
      # hand-duplicated steps here (pnpm/node/buf/web-build) rather than
      # patching the missing ent-gen step back in a second time — that
      # duplication is exactly how this workflow drifted from
      # release-please.yml's own copy and ended up missing ent-gen in the
      # first place. Also sets up Go (go-version-file: go.mod).
      - name: Generate protos, ent ORM code, and build web UI
        uses: ./.github/actions/prepare

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          # GITHUB_REPOSITORY (owner/repo) is set automatically by GitHub Actions
