name: Bazel autofix

# Story 7.8 (Task 7.8b). Same-repo PRs only (never forks, never pull_request_target): regenerate BUILD files and
# the module lock and push the result to the PR branch as a normal (never forced) push, then re-run the gate.
# Caveat: this executes the PR branch's own Gazelle with a write token, which is why forks are excluded.
on:
  pull_request:
    types: [ opened, synchronize ]

permissions:
  contents: write
  actions: write

concurrency:
  group: bazel-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.BAZEL_REPAIR_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: 'go.mod'

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Regenerate
        run: |
          bazel run --config=ci //:gazelle
          # `bazel mod` reads only common: rc lines, so --config=ci (a build: config) is rejected.
          bazel mod tidy --lockfile_mode=update

      - name: Push the regenerate commit
        env:
          GH_TOKEN: ${{ secrets.BAZEL_REPAIR_TOKEN || github.token }}
          HAS_REPAIR_TOKEN: ${{ secrets.BAZEL_REPAIR_TOKEN != '' }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Only generated files may differ; anything else means the PR needs a human.
          changed=$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          [ -n "$changed" ] || { echo "PR is fresh"; exit 0; }
          if printf '%s\n' "$changed" | grep -qvE '(^|/)BUILD\.bazel$|^MODULE\.bazel\.lock$'; then
            echo "::error::regeneration touched non-generated files; not pushing:"; printf '%s\n' "$changed"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$changed" | xargs git add --
          git commit -m "chore(build): regenerate BUILD files"
          git push origin "HEAD:$HEAD_REF"
          if [ "$HAS_REPAIR_TOKEN" != "true" ]; then
            gh workflow run bazel.yml --ref "$HEAD_REF"
          fi
