name: Nightly

# Advisory, continue-on-error checks moved off pull_request (they were ~always red or
# coverage-only): Firefox/WebKit e2e on the Next and Bun builds, and the -tags integration
# coverage run. A separate workflow, not a build.yml schedule: a schedule on build.yml would
# rerun every job in it (same reasoning as css-differential.yml). Next/Bun Chromium e2e stays
# in build.yml. Their Playwright blob artifacts are no longer merged into build.yml's reports.
on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  prepare:
    name: Generate & Build Web UI
    uses: ./.github/workflows/_prepare.yml

  # Firefox/WebKit coverage, informational only. webkit-mobile (not mobile-webkit, a separate
  # Files-viewer-mobile project gated by PW_WEBKIT=1) carries 6 next-e2e-baseline.json
  # baseline-"pass" entries; mobile-webkit's coverage is preserved via PW_WEBKIT=1.
  e2e-secondary-browsers-next:
    name: e2e secondary browsers (Next build)
    runs-on: ubuntu-latest
    needs: prepare
    continue-on-error: true
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact-name }}

      # prepare's shared artifact is already a Next-mode build (WEB_BUILD unset there too), so
      # a plain `go build` suffices -- mirrors e2e-next-shard's own build step.
      - name: Build binary (Next build, from prepare's shared artifact)
        run: go build -o stapler-squad .

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-secondary-${{ runner.os }}-${{ hashFiles('tests/e2e/bun.lock') }}

      - name: Install Playwright + test dependencies
        run: |
          cd tests/e2e
          bun install --frozen-lockfile
          npx playwright install firefox webkit --with-deps

      - name: Run e2e secondary browsers (Next build)
        env:
          TEST_SERVER_BINARY: ${{ github.workspace }}/stapler-squad
          WEB_BUILD: next
          # Enables the mobile-webkit project (playwright.config.ts) so its Files-viewer-mobile
          # coverage runs here too, alongside webkit-mobile's baseline-tracked specs.
          PW_WEBKIT: '1'
        run: |
          cd tests/e2e
          timeout 40m npx playwright test --reporter=list,blob --project=desktop-firefox --project=desktop-webkit --project=webkit-mobile --project=mobile-webkit

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-next-blob-secondary
          path: tests/e2e/blob-report
          if-no-files-found: error
          retention-days: 1

  e2e-secondary-browsers-bun:
    name: e2e secondary browsers (Bun build)
    runs-on: ubuntu-latest
    needs: prepare
    continue-on-error: true
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache buf binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/buf
          key: buf-1.41.0-${{ runner.os }}-${{ runner.arch }}

      - name: Set up buf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: '1.41.0'
          setup_only: 'true'

      # proto/ent code generation is not WEB_BUILD-dependent, so this still saves the buf/ent
      # steps below even though the web UI itself is rebuilt for Bun (next step's `make`) --
      # mirrors e2e-bun-shard's own step exactly.
      - name: Download generated files (proto/ent; web UI rebuilt below for Bun)
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact-name }}

      # Exact key, no restore-keys: see web-build-smoke-bun's identical step for why.
      - name: Cache shared node_modules
        uses: actions/cache@v4
        with:
          path: ~/.stapler-squad/shared-node-modules
          key: web-node-modules-${{ runner.os }}-${{ hashFiles('web-app/bun.lock', 'web-app/patches/**') }}

      - name: Build binary (Bun build)
        env:
          WEB_BUILD: bun
        run: make stapler-squad || { echo "retrying once (host load)"; rm -rf web-app/out server/web/dist; make stapler-squad; }

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-secondary-${{ runner.os }}-${{ hashFiles('tests/e2e/bun.lock') }}

      - name: Install Playwright + test dependencies
        run: |
          cd tests/e2e
          bun install --frozen-lockfile
          npx playwright install firefox webkit --with-deps

      - name: Run e2e secondary browsers (Bun build)
        env:
          TEST_SERVER_BINARY: ${{ github.workspace }}/stapler-squad
          WEB_BUILD: bun
          # Enables the mobile-webkit project (playwright.config.ts) so its Files-viewer-mobile
          # coverage runs here too, alongside webkit-mobile's baseline-tracked specs.
          PW_WEBKIT: '1'
        run: |
          cd tests/e2e
          timeout 40m npx playwright test --reporter=list,blob --project=desktop-firefox --project=desktop-webkit --project=webkit-mobile --project=mobile-webkit

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-bun-blob-secondary
          path: tests/e2e/blob-report
          if-no-files-found: error
          retention-days: 1

  # Advisory `-tags integration` coverage run; never gates anything (see the step's continue-on-error).
  integration-coverage:
    name: Integration coverage (advisory)
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact-name }}

      - name: Build pinned tmux 3.8
        uses: ./.github/actions/build-tmux
        with:
          install-socat: 'true'

      - name: Fetch pinned tymuxd binary
        uses: ./.github/actions/fetch-tymuxd

      - name: Set up the tymux fidelity oracle (xterm.js via Bun)
        uses: ./.github/actions/setup-fidelity-oracle

      - name: Integration coverage (advisory)
        # Same tmux-under-CPU-contention rationale as the "test" job's "Run tests
        # with coverage" step -- this step's `-tags integration` run spawns real
        # tmux servers under the same contention.
        env:
          STAPLER_SQUAD_TMUX_CREATE_TIMEOUT_SECONDS: "30"
          # the daemon-backed fidelity corpus (session/tymux) needs the oracle; fail if it's missing
          FIDELITY_REQUIRE_ORACLE: "1"
        run: |
          # keep this marker prefix in sync with ciBudgetExceededMarker in server/services/github_webhook_pr_fix.go
          TMUX_BIN="$(pwd)/bin/tmux" TYMUXD_BIN="$(pwd)/session/tymux/embed/tymuxd" timeout 20m go test -race -tags integration \
            -coverprofile=integration.out -covermode=atomic ./... \
            || { echo "::error::CI-BUDGET-EXCEEDED: 'integration-coverage' exceeded its 20m budget"; echo "CI-BUDGET-EXCEEDED: 'integration-coverage' exceeded its 20m budget" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
        continue-on-error: true

      - name: Upload integration coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage
          path: integration.out
          if-no-files-found: ignore
          retention-days: 30
