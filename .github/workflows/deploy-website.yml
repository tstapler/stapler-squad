name: Deploy Website

# Builds and deploys the Astro+Starlight site in website/ to GitHub Pages.
# Phase 6 (Story 6.3.1) finalized the path filters -- docs/how-to/** and
# docs/features.md are CuratedDoc sources (Epic 2.1's sync-content.mjs /
# content-manifest.json), so a change there without a `website/**` change
# must still trigger a rebuild+resync, not silently drift.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/how-to/**'
      - 'docs/features.md'
      - '.github/workflows/deploy-website.yml'

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # ratchet:actions/checkout@v6

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # ratchet:actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      # Story 6.3.1: catches a committed CuratedDoc that no longer matches
      # what sync-content.mjs would produce from its SourceDoc right now --
      # e.g. someone edited docs/how-to/debug-with-logs.md without re-running
      # `bun run sync-content` and committing the regenerated
      # website/src/content/docs/help/debug-with-logs.md. `--check` runs the
      # same transform in verify-only mode (no writes) and fails the build on
      # any drift; see sync-content.mjs's own module doc comment.
      - name: Verify content sync
        working-directory: website
        run: bun run sync-content -- --check

      - name: Build site
        working-directory: website
        run: bun run build

      - name: Check internal links
        working-directory: website
        run: node scripts/check-internal-links.mjs

      - name: Check demo-asset health
        working-directory: website
        run: node scripts/check-asset-health.mjs

      # Epic 6.1: both configs assert performance/accessibility/best-practices
      # >= 0.90 at error (blocking) level -- see website/lighthouserc.json's
      # and lighthouserc.mobile.json's own comments, and
      # website/tests/unit/lighthouserc.test.ts for the regression guard that
      # these thresholds stay independent of web-app/lighthouserc.json's
      # lower, warn-only ones. The site is already built above; start one
      # `astro preview` server here (it daemonizes itself) and let
      # lhci/a11y/e2e below reuse it via their `:ci` scripts instead of each
      # rebuilding and re-previewing the identical site.
      - name: Start preview server
        working-directory: website
        run: bun run preview -- --port 4321

      - name: Lighthouse CI (desktop)
        working-directory: website
        run: bun run lhci:desktop:ci

      - name: Lighthouse CI (mobile)
        working-directory: website
        run: bun run lhci:mobile:ci

      # Epic 6.2: same @axe-core/playwright library and critical/serious
      # severity gate as tests/e2e/accessibility.spec.ts -- see
      # website/tests/a11y.spec.ts.
      - name: Install Playwright browsers
        working-directory: website
        run: npx playwright install chromium --with-deps

      - name: Accessibility scan (axe-core)
        working-directory: website
        run: bun run test:a11y:ci

      # 19 UX acceptance criteria from design/ux.md §5 / validation.md's
      # "UX Acceptance Tests" table -- website/tests/e2e/*.spec.ts.
      - name: E2E UX acceptance tests
        working-directory: website
        run: bun run test:e2e:ci

      - name: Stop preview server
        working-directory: website
        if: always()
        run: bun run preview:stop

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # ratchet:actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # ratchet:actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # ratchet:actions/deploy-pages@v5
