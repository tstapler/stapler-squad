name: Deploy Website

# Builds and deploys the Astro+Starlight site in website/ to GitHub Pages.
# Phase 6 (Story 6.3.1) finalized the path filters -- docs/how-to/**,
# docs/features.md and README.md are CuratedDoc/features.json sources (Epic 2.1's sync-content.mjs /
# content-manifest.json), so a change there without a `website/**` change
# must still trigger a rebuild+resync, not silently drift.

# `schedule` + `workflow_dispatch` redeploy without a content change, so the
# clips are re-recorded against the current app and a rotted link or a demo
# selector that no longer matches is caught within a week instead of at the
# next unrelated website edit. PRs are gated by website-ci.yml, which
# must keep running the same checks (website/tests/unit/workflow-yaml.test.ts).
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/how-to/**'
      - 'docs/features.md'
      - 'README.md'
      - 'tests/e2e/website-demos/**'
      - 'tests/e2e/playwright.website-demos.config.ts'
      - 'scripts/record-website-demos.sh'
      - 'scripts/demo-post-process.sh'
      - '.github/workflows/deploy-website.yml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Records the demo clips against the current app so they never go stale and
  # nothing is committed: they ship inside the Pages artifact. The build job
  # tolerates this job failing (the site then keeps its screenshots), and
  # `notify` below still reports a failed deploy.
  record-clips:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # ratchet:actions/checkout@v6
        with:
          lfs: true
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # ratchet:actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      # The prepare action sets up Node itself.
      - name: Generate protos and build web UI
        uses: ./.github/actions/prepare

      - name: Build binary
        run: go build -o stapler-squad .

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # ratchet:actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/bun.lock') }}

      - name: Install Playwright, ffmpeg and librsvg
        run: |
          cd tests/e2e
          bun install --frozen-lockfile
          npx playwright install chromium --with-deps
          sudo apt-get install -y ffmpeg librsvg2-bin jq tmux

      - name: Record, trim and brand the clips
        run: scripts/record-website-demos.sh --out "$RUNNER_TEMP/website-demo-clips"

      # Even after a partial failure (the script exits 3): ship the clips that worked.
      - name: Upload clips
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7
        with:
          name: website-demo-clips
          path: ${{ runner.temp }}/website-demo-clips/*.webm
          if-no-files-found: warn
          retention-days: 1

  build:
    needs: record-clips
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # ratchet:actions/checkout@v6

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # ratchet:actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Unit tests
        working-directory: website
        run: bun run test:unit

      # Story 6.3.1: catches a committed CuratedDoc that no longer matches
      # what sync-content.mjs would produce from its SourceDoc right now --
      # e.g. someone edited docs/how-to/debug-with-logs.md without re-running
      # `bun run sync-content` and committing the regenerated
      # website/src/content/docs/help/debug-with-logs.md. `--check` runs the
      # same transform in verify-only mode (no writes) and fails the build on
      # any drift; see sync-content.mjs's own module doc comment.
      - name: Verify content sync
        working-directory: website
        run: bun run sync-content -- --check

      - name: Verify features.json is current
        working-directory: website
        run: node scripts/build-features.mjs && git diff --exit-code -- src/content/features.json

      # Deploy-only (website-ci.yml has no recording): put this run's clips under
      # public/clips/ and regenerate features.json so the cards play them. Neither
      # is committed. A missing artifact (failed recording) leaves the screenshots.
      - name: Download demo clips
        id: clips
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # ratchet:actions/download-artifact@v4
        with:
          name: website-demo-clips
          path: website/public/clips

      # A download that fails after a successful recording would otherwise ship
      # screenshot-only with no signal; fail loudly on the annotation at least.
      - name: Warn when no clips were shipped
        run: |
          if ! ls website/public/clips/*.webm >/dev/null 2>&1; then
            echo "::warning::no demo clips in this build (download outcome: ${{ steps.clips.outcome }}); the site ships screenshots only"
          fi

      - name: Regenerate features.json with the clips
        working-directory: website
        run: node scripts/build-features.mjs

      - name: Build site
        working-directory: website
        run: bun run build

      - name: Check internal links
        working-directory: website
        run: node scripts/check-internal-links.mjs

      - name: Check demo-asset health
        working-directory: website
        run: node scripts/check-asset-health.mjs

      # Epic 6.1: both configs assert performance/accessibility/best-practices
      # >= 0.90 at error (blocking) level -- see website/lighthouserc.json's
      # and lighthouserc.mobile.json's own comments, and
      # website/tests/unit/lighthouserc.test.ts for the regression guard that
      # these thresholds stay independent of web-app/lighthouserc.json's
      # lower, warn-only ones. The site is already built above; start one
      # `astro preview` server here (it daemonizes itself) and let
      # lhci/a11y/e2e below reuse it via their `:ci` scripts instead of each
      # rebuilding and re-previewing the identical site.
      # Backgrounded with its output redirected: left attached, the server
      # holds the step's output pipe open and the step never completes.
      - name: Start preview server
        working-directory: website
        run: |
          nohup bun run preview -- --port 4321 > /tmp/preview.log 2>&1 &
          timeout 60 bash -c 'until curl -sf http://localhost:4321/stapler-squad/ > /dev/null; do sleep 1; done' \
            || { cat /tmp/preview.log; exit 1; }

      - name: Lighthouse CI (desktop)
        working-directory: website
        run: bun run lhci:desktop:ci

      - name: Lighthouse CI (mobile)
        working-directory: website
        run: bun run lhci:mobile:ci

      # Epic 6.2: same @axe-core/playwright library and critical/serious
      # severity gate as tests/e2e/accessibility.spec.ts -- see
      # website/tests/a11y.spec.ts.
      - name: Install Playwright browsers
        working-directory: website
        run: npx playwright install chromium --with-deps

      - name: Accessibility scan (axe-core)
        working-directory: website
        run: bun run test:a11y:ci

      # 19 UX acceptance criteria from design/ux.md §5 / validation.md's
      # "UX Acceptance Tests" table -- website/tests/e2e/*.spec.ts.
      - name: E2E UX acceptance tests
        working-directory: website
        run: bun run test:e2e:ci

      - name: Stop preview server
        working-directory: website
        if: always()
        run: bun run preview:stop

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # ratchet:actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # ratchet:actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # ratchet:actions/deploy-pages@v5

  # Opens (or comments on) one tracking issue when a push/scheduled deploy
  # fails, and closes it on the next success, so a broken site is never silent
  # again (it failed 25 consecutive times unnoticed before this existed).
  notify:
    needs: [record-clips, build, deploy]
    if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DEPLOYED: ${{ needs.deploy.result }}
      RECORDED: ${{ needs.record-clips.result }}
    steps:
      # One tracking issue per problem: opened (or commented on) while it
      # persists, closed on the first healthy run. A failed recording does not
      # block the deploy, so without its own issue it would degrade silently.
      - name: Open, update or close the tracking issues
        run: |
          track() {
            local title="$1" result="$2" body="$3" existing
            existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
            if [ "$result" = "success" ]; then
              if [ -n "$existing" ]; then gh issue close "$existing" --comment "Recovered: $RUN_URL"; fi
            elif [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          }
          # Each call is independent: one gh failure must not skip the other issue.
          failures=0
          track "Website deploy is failing" "$DEPLOYED" "Deploy Website failed (build or deploy job): $RUN_URL" || failures=$((failures + 1))
          track "Website demo clips failed to record" "$RECORDED" "The record-clips job did not succeed, so the site shipped without (some) demo clips: $RUN_URL" || failures=$((failures + 1))
          exit "$failures"
