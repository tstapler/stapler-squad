name: Bazel

# PROVISIONAL (Story 0.14 gate not yet released). `bazel` is the non-blocking soak job;
# `bazel-guards` has no continue-on-error. Action pins are SHAs (version in the trailing comment).
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Separate from any build job so a guard failure is never masked by that job's non-blocking
  # setting. No continue-on-error here; a required-check candidate for Task 7.6.
  bazel-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: 'go.mod'

      # Bazelisk on PATH as `bazel` so check-bazelrc.sh validates flags against `bazel help`.
      - name: Set up Bazelisk
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/bazelbuild/bazelisk@v1.28.1
          ln -s "$RUNNER_TEMP/bin/bazelisk" "$RUNNER_TEMP/bin/bazel"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Guard scripts
        run: |
          bash tools/bzl/check-bazelignore.sh
          bash tools/bzl/check-build-paths.sh
          bash tools/bzl/check-bazelrc.sh
          bash tools/bzl/check-configs.sh
          bash tools/bzl/check-no-force-push.sh
          bash tools/bzl/translate-errors_test.sh
          bash tools/bzl/translate-errors_test.sh --negative
          bash tools/bzl/check-build-fresh-cheap_test.sh
          bash tools/bzl/doctor_test.sh
          bash tools/bzl/check-make-help.sh
          bash tools/bzl/check-test-tags_test.sh
          bash tools/bzl/check-test-tags.sh

      # T5 collector for P10 (Task 7.5g): every seeded failure shows a Remedy: line within 20 lines.
      - name: First-error legibility
        run: bash tools/bzl/check-error-legibility.sh | tee legibility.txt | tail -n 1

      - name: PR title is a Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash tools/bzl/check-pr-title.sh "$PR_TITLE"

  # Soak job: continue-on-error keeps a failure from blocking the PR, and it is not a required check.
  # Holds no write credential, so BEP and the profile are safe to upload (Task 1.3b).
  bazel:
    name: bazel (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: 'go.mod'

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: MODULE.bazel is tidy
        run: |
          bazel mod tidy --config=ci --lockfile_mode=update
          git diff --exit-code MODULE.bazel MODULE.bazel.lock

      - name: Gazelle is up to date
        run: bazel run --config=ci //:gazelle -- -mode=diff

      # Isolated HOME with a git identity: tests that commit must not read the runner's HOME.
      - name: Test HOME fixture
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          printf '[user]\n\tname = Bazel Test\n\temail = test@example.invalid\n' > "$RUNNER_TEMP/home/.gitconfig"

      - name: Build and test the generated-independent subset
        run: |
          sed 's#^#//#;s#$#/...#' tools/bzl/no-gen-packages.txt > "$RUNNER_TEMP/targets.txt"
          bazel test --config=ci --lockfile_mode=error --remote_upload_local_results=false \
            --keep_going --build_event_json_file=bep.json --profile=profile.gz \
            --test_env=HOME="$RUNNER_TEMP/home" --sandbox_writable_path="$RUNNER_TEMP/home" \
            --test_env=GO_TEST_WRAP_TESTV=1 \
            --target_pattern_file="$RUNNER_TEMP/targets.txt"

      - name: Upload BEP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bazel-bep
          path: bep.json
          if-no-files-found: warn

      - name: Upload profile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bazel-profile
          path: profile.gz
          if-no-files-found: warn
