name: Main CI

# Push-to-main / manual-only checks, split out of build.yml so a pull_request run never lists them
# as SKIPPED checks (each skipped job still counts as a check). Contents: the full-suite coverage
# gate (test-tmux + test-rest -> test), the 5-platform cross-compile matrix, and the benchmark gate.
# PRs are gated by build.yml's test-affected + go-guards + web-checks instead.
# Nothing here is a required status check: main has no branch protection (verified via
# `gh api repos/tstapler/stapler-squad/branches/main`: protected=false, no required_status_checks).

on:
  push:
    branches: [ main ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'install.sh'
      - 'proto/**'
      - 'web-app/src/**'
      - 'web-app/package.json'
      - 'web-app/bun.lock'
      - 'web-app/build/**'
      - 'web-app/index.html'
      - 'web-app/patches/**'
      - 'web-app/bunfig.toml'
      - 'web-app/scripts/ci/**'
      - 'server/middleware/testdata/**'
      - '.bun-version'
      - '.github/workflows/main-ci.yml'
      - '.github/actions/prepare/**'
      - '.gitmodules'
      - 'third_party/tmux/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Main-branch runs are never cancelled (benchmark-gate's cache/save must not be cut mid-write).
concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Generate & Build Web UI
    uses: ./.github/workflows/_prepare.yml

  # ─────────────────────────────────────────────────────────────────────────────
  # test-tmux / test-rest: the old single `test` job ran these as two
  # sequential `go test` invocations inside one job (~13.3m combined,
  # 2026-08-28 measurement: TMUX_TEST_PKGS ~6.0m, REST_TEST_PKGS ~7.3m). Split
  # into two parallel jobs instead — full OS-level isolation, not just `-p`
  # concurrency within one invocation, so the fan-out/flake concerns the
  # comment on TMUX_TEST_PKGS below describes don't get worse; if anything
  # they get less contended since REST_TEST_PKGS's -race suite is no longer
  # sharing a runner's CPUs with TMUX_TEST_PKGS's real tmux subprocesses at
  # all. `test` (below) merges both coverage profiles and runs the gate.
  #
  # Merging test/pty-race-regression/integration-coverage (now in nightly.yml) into one job was
  # considered and rejected (plan.md Epic 3.5): they run in parallel today, and
  # merging would serialize their combined runtime, hurting wall-clock
  # time-to-green — this plan's actual success metric — for a total-compute
  # win nobody asked for. Same reasoning applies to keeping test-tmux/test-rest
  # split rather than reverting to one job.
  # ─────────────────────────────────────────────────────────────────────────────
  test-tmux:
    name: Test (session/tmux packages)
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 20
    # Main-only: PRs are gated by test-affected (fast, narrow signal) instead
    # of this full ./session/./session/mux/./session/tmux sweep. See
    # test-affected's own comment for why the full run can't be narrowed
    # there -- it can here, because "PR verification" no longer needs it at
    # all now that the global coverage gate below is also main-only.
    env:
      GIT_AUTHOR_NAME: stapler-squad-ci
      GIT_AUTHOR_EMAIL: ci@stapler-squad.invalid
      GIT_COMMITTER_NAME: stapler-squad-ci
      GIT_COMMITTER_EMAIL: ci@stapler-squad.invalid
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Runner utilization sampler
        uses: ./.github/actions/runner-utilization

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install gotestsum
        run: |
          go install gotest.tools/gotestsum@v1.13.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact-name }}

      - name: Build pinned tmux 3.8
        uses: ./.github/actions/build-tmux

      - name: Run tests with coverage (pinned tmux 3.8)
        # STAPLER_SQUAD_TMUX_CREATE_TIMEOUT_SECONDS: production default is 10s
        # (session/tmux/tmux.go's sessionCreateTimeoutDefault) -- this only
        # widens the budget for this CI job, where a fully-loaded runner
        # running every package's -race suite concurrently can occasionally
        # exceed 10s of pure CPU-scheduling delay spinning up even an
        # isolated tmux -L server, not lock contention. See tmux.go's
        # sessionCreateTimeout doc comment for the incident this closes.
        env:
          STAPLER_SQUAD_TMUX_CREATE_TIMEOUT_SECONDS: "30"
        run: |
          # -timeout=20m: explicit budget instead of relying on go test's silent 10m
          # default (see BUG-067). session, session/mux, and session/tmux fork real
          # tmux subprocesses at high t.Parallel() fan-out, which is why they run as
          # their own job rather than sharing a runner with REST_TEST_PKGS below.
          # They no longer need -p 1 against each other: the flake that justified it
          # was TestBuildClaudeCommand_LargePromptUsesTempFileNotInline overriding
          # promptArg's background cleanup delay to 10ms in a test that doesn't
          # exercise cleanup timing, racing its own os.ReadFile against that
          # goroutine under CPU contention (see session/instance_tmux_test.go).
          # Fixed by leaving the real 30s default delay in place; validated with a
          # clean -race run of all three packages together sans -p 1.
          # keep this marker prefix in sync with ciBudgetExceededMarker in server/services/github_webhook_pr_fix.go
          run_test_suite() {
            TMUX_BIN="$(pwd)/bin/tmux" gotestsum --format github-actions -- -race -timeout=20m -coverprofile=coverage.tmux.out \
              -covermode=atomic ./session ./session/mux ./session/tmux \
              || (TMUX_BIN="$(pwd)/bin/tmux" gotestsum --format standard-verbose -- -race -timeout=20m ./session ./session/mux ./session/tmux; exit 1)
          }
          export -f run_test_suite
          timeout 17m bash -c run_test_suite || { echo "::error::CI-BUDGET-EXCEEDED: 'test-tmux' exceeded its 17m budget"; echo "CI-BUDGET-EXCEEDED: 'test-tmux' exceeded its 17m budget" >> "$GITHUB_STEP_SUMMARY"; exit 1; }

      - name: Upload tmux-group coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-tmux
          path: coverage.tmux.out
          retention-days: 1

      - name: Runner utilization report
        if: always()
        uses: ./.github/actions/runner-utilization/report
        with:
          label: main-test-tmux

  # test-rest's budget was raised 22m->30m (job timeout 25->35) on 2026-09-05
  # (PR #697): the retry-on-any-failure fallback below re-runs the entire
  # -race suite a second time in verbose mode, so a single flaky test hit
  # (BUG-098/BUG-100's documented classes) roughly doubles wall-clock time
  # against the same budget -- 5 consecutive CI-BUDGET-EXCEEDED failures on
  # #697 traced to exactly this, not a code regression (every individual
  # test passed; isolated reruns of the flaky tests passed 100%).
  test-rest:
    name: Test (server/session/config packages)
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 35
    # Main-only -- see test-tmux's identical condition and comment above.
    env:
      GIT_AUTHOR_NAME: stapler-squad-ci
      GIT_AUTHOR_EMAIL: ci@stapler-squad.invalid
      GIT_COMMITTER_NAME: stapler-squad-ci
      GIT_COMMITTER_EMAIL: ci@stapler-squad.invalid
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Runner utilization sampler
        uses: ./.github/actions/runner-utilization

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install gotestsum
        run: |
          go install gotest.tools/gotestsum@v1.13.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact-name }}

      # socat is required by server/services' real-shell approval-relay tests
      # (TestRemoteApprovalHookCommand_*) -- these execute the actual
      # generated hook command through a real shell rather than simulating
      # its wire protocol in Go, specifically so a bug in the command
      # itself (as opposed to the Go code that builds it) gets caught.
      # Without socat on PATH, those tests silently skip instead of
      # running -- see remoteApprovalWriteTool's doc comment
      # (server/services/hook_injector.go) for the production bug this
      # class of test exists to catch.
      - name: Build pinned tmux 3.8
        uses: ./.github/actions/build-tmux
        with:
          install-socat: 'true'

      - name: Set up the tymux fidelity oracle (xterm.js via Bun)
        uses: ./.github/actions/setup-fidelity-oracle

      - name: Run tests with coverage (pinned tmux 3.8)
        env:
          STAPLER_SQUAD_TMUX_CREATE_TIMEOUT_SECONDS: "30"
          FIDELITY_REQUIRE_ORACLE: "1"
        run: |
          # keep this marker prefix in sync with ciBudgetExceededMarker in server/services/github_webhook_pr_fix.go
          run_test_suite() {
            REST_TEST_PKGS="$(go list ./server/... ./session/... ./config/... | grep -vE '^github\.com/tstapler/stapler-squad/(session|session/mux|session/tmux)$')"
            # REST_TEST_PKGS is deliberately unquoted below: it's a
            # newline/space-separated list of package paths that must
            # word-split into separate `go test` arguments.
            # shellcheck disable=SC2086
            TMUX_BIN="$(pwd)/bin/tmux" gotestsum --format github-actions -- -race -timeout=28m -coverprofile=coverage.rest.out \
              -covermode=atomic $REST_TEST_PKGS \
              || (TMUX_BIN="$(pwd)/bin/tmux" gotestsum --format standard-verbose -- -race -timeout=28m $REST_TEST_PKGS; exit 1)
          }
          export -f run_test_suite
          timeout 30m bash -c run_test_suite || { echo "::error::CI-BUDGET-EXCEEDED: 'test-rest' exceeded its 30m budget"; echo "CI-BUDGET-EXCEEDED: 'test-rest' exceeded its 30m budget" >> "$GITHUB_STEP_SUMMARY"; exit 1; }

      - name: Upload rest-group coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-rest
          path: coverage.rest.out
          retention-days: 1

      - name: Runner utilization report
        if: always()
        uses: ./.github/actions/runner-utilization/report
        with:
          label: main-test-rest

  # ─────────────────────────────────────────────────────────────────────────────
  # test: merges test-tmux/test-rest's coverage profiles and runs the global
  # coverage gate. Main-only (push-to-main/workflow_dispatch): PRs are no
  # longer gated on the full suite or a global coverage percentage at all --
  # test-affected (fast, narrow signal) is the PR-time Go test gate instead,
  # with its own incremental/affected-packages-only coverage report (see that
  # job). The registry/RPC-coverage/E2E-coverage checks that used to live here
  # too, and don't depend on test-tmux/test-rest's profiles at all, moved to
  # test-affected so PRs still get them without waiting on the full suite.
  # Does NOT gate the build matrix — binaries are published regardless of test
  # failures so the build artifact is always available for manual
  # verification. Lint runs in its own workflow (lint.yml).
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [ prepare, test-tmux, test-rest ]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Runner utilization sampler
        uses: ./.github/actions/runner-utilization

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact-name }}

      - name: Download tmux-group coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-tmux

      - name: Download rest-group coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-rest

      - name: Merge coverage profiles
        run: |
          head -n 1 coverage.tmux.out > coverage.out
          tail -q -n +2 coverage.tmux.out coverage.rest.out >> coverage.out
          rm -f coverage.tmux.out coverage.rest.out

      - name: Run scanner unit tests
        run: cd tools/scanner && go test ./...

      - name: Coverage gate
        uses: vladopajic/go-test-coverage@v2
        with:
          profile: coverage.out
          global-threshold: 60
          local-threshold: 0
          badge-file-name: coverage.svg

      # Benchmark comparison on PRs is handled by benchmark.yml (tier-1 job),
      # which posts a PR comment via benchstat. Removed dead step that ran
      # BenchmarkNavigation (a non-existent benchmark) for 15 min per PR.

      - name: Runner utilization report
        if: always()
        uses: ./.github/actions/runner-utilization/report
        with:
          label: main-test

  # ─────────────────────────────────────────────────────────────────────────────
  # build: cross-compiles for all supported platforms in parallel.
  # Needs only prepare (not test) so binary artifacts are always uploaded.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 15
    strategy:
      # Legs are independent platforms; one failing must not hide the others (asserted by web-app/scripts/__tests__/workflow-paths.test.mjs).
      fail-fast: false
      # Full cross-compile matrix, push-to-main only: PRs get one native build from the go-guards,
      # test-affected and goreleaser-check jobs, and a cross-compile break lands here within one push.
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact-name }}

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          CGO_CFLAGS: "-Wno-discarded-qualifiers"
        run: |
          BINARY_NAME=stapler-squad
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME=$BINARY_NAME.exe
          fi
          VERSION=$(git describe --tags --always --dirty 2>/dev/null | sed 's/^v//' || git rev-parse --short HEAD)
          go build -v -ldflags "-X main.version=${VERSION}" -o build/${{ matrix.goos }}_${{ matrix.goarch }}/$BINARY_NAME .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stapler-squad-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/${{ matrix.goos }}_${{ matrix.goarch }}/*
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # benchmark-gate: runs on main-merge only. Fails if any benchmark regresses
  # more than 20%. PRs get advisory comments only via benchmark.yml (never blocked).
  # 20% threshold is deliberate — tmux-touching benchmarks have 15-25% natural
  # variance on shared runners. count=5 + utest for statistical significance.
  #
  # Baseline persisted via GitHub Actions cache (key "bench-gate-<run_id>",
  # restored by "bench-gate-" prefix match) — not committed to git; a prior
  # version of this job committed the baseline to `benchmarks/` on every
  # push to main, which flooded the commit history for very little value.
  # Uses same concurrency group as benchmark.yml to prevent 5 concurrent
  # runs colliding.
  # ─────────────────────────────────────────────────────────────────────────────
  benchmark-gate:
    name: Benchmark Gate (main only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only depends on `prepare`'s generated-files artifact (downloaded below) --
    # never consumes anything `test` produces, so it runs in parallel with `test`
    # instead of waiting on it.
    needs: prepare
    permissions:
      contents: read
      pull-requests: read
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: baseline-push-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Runner utilization sampler
        uses: ./.github/actions/runner-utilization

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact-name }}

      - name: Build pinned tmux 3.8
        uses: ./.github/actions/build-tmux

      - name: Run benchmarks (count=5 for significance)
        env:
          # production default is 10s; CI runners are slower/noisier, and the
          # benchmark job's module cache is cold on first run (never populated
          # by a prior success), so tmux session creation needs more headroom
          STAPLER_SQUAD_TMUX_CREATE_TIMEOUT_SECONDS: "30"
        run: |
          # -run='^$'  benchmarks only (no tests)
          # -short     skip integration benchmarks that spawn real processes
          # -count=5   statistically meaningful for ≥20% regression detection
          # -timeout=10m per package (search/unfinished are legitimately slow)
          # | tee      keeps step output visible live instead of buffered
          #            until completion, so a stall shows its last line
          TMUX_BIN="$(pwd)/bin/tmux" go test -bench=. -benchmem -count=5 \
            -run='^$' -short ./... -timeout=10m | tee bench-current.txt

      - name: Install benchstat (pinned)
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260312031701-16a31bc5fbd0

      - name: Restore benchmark baseline
        uses: actions/cache/restore@v4
        with:
          path: benchmarks/go/benchmark-gate-baseline.txt
          key: bench-gate-
          restore-keys: |
            bench-gate-

      - name: Compare against baseline (20% threshold)
        run: |
          BASELINE=benchmarks/go/benchmark-gate-baseline.txt
          if [ ! -f "$BASELINE" ]; then
            echo "No baseline found — will be established on this run (no regression check)"
            exit 0
          fi
          benchstat -delta-test=utest "$BASELINE" bench-current.txt | tee bench-diff.txt
          # Catch regressions ≥20%: match +20.x through +9999.x (two+ digits, first two ≥ 20)
          if grep -E '\+([2-9][0-9]|[1-9][0-9]{2,})\.' bench-diff.txt | grep -v '±'; then
            echo "Benchmark regression ≥20% detected — see bench-diff.txt above"
            exit 1
          fi

      - name: Save benchmark baseline on success
        run: |
          mkdir -p benchmarks/go
          cp bench-current.txt benchmarks/go/benchmark-gate-baseline.txt

      - name: Persist baseline to cache on success
        uses: actions/cache/save@v4
        with:
          path: benchmarks/go/benchmark-gate-baseline.txt
          key: bench-gate-${{ github.run_id }}

      - name: Runner utilization report
        if: always()
        uses: ./.github/actions/runner-utilization/report
        with:
          label: main-benchmark-gate
