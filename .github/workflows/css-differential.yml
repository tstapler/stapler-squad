name: CSS differential

# Story 5.10: proves vanilla-extract output under Bun equals Node's (oracle) on every Bun bump. A separate workflow, not a build.yml job: a nightly
# schedule on build.yml would rerun every job in it.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'web-app/patches/**'
      - 'web-app/bun.lock'
      - '.bun-version'
      - 'web-app/build/oracle/**'
      - '.github/workflows/css-differential.yml'

permissions:
  contents: read

concurrency:
  group: css-differential-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  css-differential:
    name: VE oracle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache buf binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/buf
          key: buf-1.41.0-${{ runner.os }}-${{ runner.arch }}

      - name: Set up buf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: '1.41.0'
          setup_only: 'true'

      - name: Install web-app dependencies
        run: make web-app/node_modules/.ssq-install-stamp

      - name: Oracle - every .css.ts matches Node byte for byte
        working-directory: web-app
        run: bun run oracle:ve
