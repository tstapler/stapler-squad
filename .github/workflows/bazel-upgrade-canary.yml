name: Bazel upgrade canary

# PROVISIONAL (Task 11.8a). Weekly and on demand: tries the latest Bazel 9.x patch and the latest stable
# rules_go and gazelle from the BCR in a discarded checkout, runs the generated-independent subset, runs the pinned
# macOS job, and opens an issue naming the first failing step. Nothing here pushes or edits the repo.
# Action pins are SHAs (version in the trailing comment).
on:
  schedule:
    - cron: '0 7 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: latest Bazel 9.x, rules_go and gazelle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: 'go.mod'

      - name: Set up Bazelisk
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/bazelbuild/bazelisk@v1.28.1
          ln -s "$RUNNER_TEMP/bin/bazelisk" "$RUNNER_TEMP/bin/bazel"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: go.mod toolchain is supported
        id: go_toolchain
        continue-on-error: true
        run: bash tools/bzl/check-go-toolchain.sh

      - name: Fork removal conditions and age
        id: fork_age
        continue-on-error: true
        run: bash tools/bzl/check-fork-age.sh

      # BCR metadata.json lists versions in publication order, not semver order, so sort the stable ones.
      - name: Bump to the latest pins
        id: bump
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest() {
            gh api "repos/bazelbuild/bazel-central-registry/contents/modules/$1/metadata.json" --jq .content | base64 -d \
              | jq -r '.versions | map(select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))) | sort_by(split(".") | map(tonumber)) | last'
          }
          for mod in rules_go gazelle; do
            ver=$(latest "$mod")
            echo "$mod -> $ver"
            sed -i -E "s/(bazel_dep\\(name = \"$mod\", version = \")[^\"]+/\\1$ver/" MODULE.bazel
          done
          # Bazelisk resolves "9.x" to the newest 9 release.
          echo "USE_BAZEL_VERSION=9.x" >> "$GITHUB_ENV"
          git diff --stat MODULE.bazel

      - name: Resolve MODULE.bazel
        id: resolve
        continue-on-error: true
        run: bazel mod tidy --lockfile_mode=update

      - name: Build and test the generated-independent subset
        id: subset
        continue-on-error: true
        run: |
          sed 's#^#//#;s#$#/...#' tools/bzl/no-gen-packages.txt > "$RUNNER_TEMP/targets.txt"
          bazel test --config=ci --lockfile_mode=update --remote_upload_local_results=false --keep_going \
            --target_pattern_file="$RUNNER_TEMP/targets.txt"

      - name: Open an issue naming the first failing step
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STEPS: ${{ toJSON(steps) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          first=$(echo "$STEPS" | jq -r 'to_entries | map(select(.value.outcome == "failure")) | .[0].key // empty')
          [ -n "$first" ] || { echo "canary passed"; exit 0; }
          title="Bazel upgrade canary failed"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq length)
          if [ "$existing" = 0 ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "First failing step: \`$first\`. Run: $RUN_URL. Runbook: docs/how-to/upgrade-bazel.md (skill: bazel-version-upgrades)."
          fi
          echo "::error::canary failed at step $first"
          exit 1

  # The macOS job stays on the pinned versions (pre-mortem #9): it shows whether the repo as committed still
  # builds on the second platform, independent of what the latest-version job found.
  macos-pinned:
    name: pinned versions on macOS
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: 'go.mod'

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-macos
          repository-cache: true

      - name: Build and test the generated-independent subset
        id: subset
        continue-on-error: true
        run: |
          sed 's#^#//#;s#$#/...#' tools/bzl/no-gen-packages.txt > "$RUNNER_TEMP/targets.txt"
          bazel test --config=ci --lockfile_mode=error --remote_upload_local_results=false --keep_going \
            --target_pattern_file="$RUNNER_TEMP/targets.txt"

      - name: Open an issue on failure
        if: steps.subset.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Bazel pinned build failed on macOS"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq length)
          if [ "$existing" = 0 ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "First failing step: \`subset\`. Run: $RUN_URL. Runbook: docs/how-to/troubleshoot-bazel.md."
          fi
          exit 1
