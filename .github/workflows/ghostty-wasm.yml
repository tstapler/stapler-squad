name: Ghostty WASM

# Builds our own ghostty-vt.wasm with Bazel (//third_party/ghostty:ghostty_vt_wasm) and runs the Zig
# unit test for our Ghostty patches. Workflow-level `paths:` (not a job `if:`) so a PR that does not
# touch the pin, patches or Bazel files creates no check at all (docs/reference/ci-job-budget.md).
# One job, no matrix: Linux x86_64 is the reference build; the recorded sha256 is for that host.

on:
  push:
    branches: [ main ]
    paths:
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - '.bazelrc'
      - '.bazelversion'
      - 'third_party/ghostty/**'
      - 'third_party/ghostty-patches/**'
      - 'scripts/build-ghostty-wasm.sh'
      - 'scripts/ghostty-wasm.sha256'
      - '.github/workflows/ghostty-wasm.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - '.bazelrc'
      - '.bazelversion'
      - 'third_party/ghostty/**'
      - 'third_party/ghostty-patches/**'
      - 'scripts/build-ghostty-wasm.sh'
      - 'scripts/ghostty-wasm.sha256'
      - '.github/workflows/ghostty-wasm.yml'
  workflow_dispatch:

concurrency:
  group: ghostty-wasm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: bazel build ghostty-vt.wasm + patch tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Cache Bazel repository and disk cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: ghostty-wasm-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}

      - name: Build (and verify against the recorded sha256 once one is recorded)
        run: |
          export BAZEL_FLAGS="--disk_cache=$HOME/.cache/bazel-disk --repository_cache=$HOME/.cache/bazel-repo"
          flags=(--test)
          if grep -qv '^#' scripts/ghostty-wasm.sha256; then flags+=(--verify); fi
          ./scripts/build-ghostty-wasm.sh "${flags[@]}" | tee "$RUNNER_TEMP/build.log"
          {
            echo '### ghostty-vt.wasm'
            echo '```'
            grep -E 'sha256=|recorded|Matches' "$RUNNER_TEMP/build.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload wasm
        uses: actions/upload-artifact@v4
        with:
          name: ghostty-vt-wasm
          path: web-app/public/ghostty-vt.*.wasm
          retention-days: 14
