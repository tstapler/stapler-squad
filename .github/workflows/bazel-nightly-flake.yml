name: Bazel nightly flake

# PROVISIONAL (Task 4.9c, pre-mortem #3). Nightly on main: every test three times with no cached results, so a
# flake PR CI never reported still becomes a row in soak-ledger.yaml (same schema and attribution classes as
# Story 7.6; rows are written by tools/bzl/soak/soak-append). A nightly failure is left unattributed on purpose
# (infra exit codes aside): a human attributes it (flake with a BUG id, bazel-real, ...) before the soak can be met.
# The ledger row is pushed straight to main with the default token (main has no branch protection, plan.md
# D-PROTECT-MERGE); it is a fast-forward push, never forced, and the workflow does not start other workflows.
# Action pins are SHAs (version in the trailing comment).
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bazel-nightly-flake
  cancel-in-progress: false

jobs:
  flake:
    name: bazel test //... x3, uncached
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: 'go.mod'

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Test three times without cached results
        id: test
        run: |
          set +e
          bazel test //... --config=ci --nocache_test_results --runs_per_test=3 --test_tag_filters=-manual --keep_going 2>&1 | tee "$RUNNER_TEMP/bazel-test.log"
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          {
            echo "### bazel test exit code: $code"
            echo '```'
            grep -E '(FAILED|FLAKY|TIMEOUT)' "$RUNNER_TEMP/bazel-test.log" | sort -u | head -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Append the run to soak-ledger.yaml
        if: always() && steps.test.outputs.exit_code != ''
        env:
          EXIT_CODE: ${{ steps.test.outputs.exit_code }}
          RUN_ID: nightly-${{ github.run_id }}-${{ github.run_attempt }}
          PUSH: ${{ github.ref == 'refs/heads/main' }}
        run: |
          go run ./tools/bzl/soak/soak-append -run-id "$RUN_ID" -exit-code "$EXIT_CODE"
          go run ./tools/bzl/soak/soak-check -validate
          if [ "$PUSH" != "true" ]; then
            git diff -- project_plans/bazel-conversion/implementation/soak-ledger.yaml
            echo "not main: ledger row printed, not pushed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project_plans/bazel-conversion/implementation/soak-ledger.yaml
          git commit -m "chore(build): record nightly flake run $RUN_ID in the soak ledger"
          # Another ledger writer may have pushed meanwhile: rebase onto it and retry, never force.
          for _ in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1

      - name: Fail the job when tests failed
        if: steps.test.outputs.exit_code != '0'
        env:
          EXIT_CODE: ${{ steps.test.outputs.exit_code }}
        run: |
          echo "::error::bazel test exited $EXIT_CODE; see the job summary and soak-ledger.yaml"
          exit 1
