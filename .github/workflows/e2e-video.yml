name: E2E Feature Video Capture

# Runs on PRs that touch feature-marked files.
# Only records feature demo specs (not benchmarks or a11y).
# Sharded across 2 runners for faster execution.
# GIFs are bundled into a single self-contained HTML preview page (archive:false)
# so reviewers can view demos directly in the browser without downloading a ZIP.
# Raw WebM recordings are uploaded as a ZIP for debugging.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

# Guards the delete-on-clean comment mutation against out-of-order runs. This
# cancels the whole run (video recording included), not just the comment
# step — safe here because a superseded PR run's videos are stale too, same
# reasoning ux-analysis.yml uses for its single-job workflow.
concurrency:
  group: e2e-video-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Feature specs recorded — excludes:
#   terminal-flickering.spec.ts  (benchmarks/stress tests)
#   accessibility.spec.ts        (handled by ux-analysis workflow)
#   smoke.spec.ts                (too short for meaningful video)
env:
  FEATURE_SPECS: >-
    demo.spec.ts
    review-queue.spec.ts
    session-lifecycle.spec.ts
    history-search.spec.ts
    workspace-management.spec.ts

jobs:
  detect-feature-changes:
    name: Detect Feature Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      record_features: ${{ steps.detect.outputs.record_features }}
    steps:
      # Default (shallow) checkout: detect-feature-changes.sh greps the
      # *content* of changed files, which a normal HEAD checkout already
      # provides -- it doesn't need history at all once CHANGED_FILES is
      # supplied below, so the `fetch-depth: 0` full-history clone this job
      # used to do (this repo's .git pack is ~16GB, see build.yml's
      # detect-changes job) was pure waste.
      - uses: actions/checkout@v4

      - name: Detect feature-marked file changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          CHANGED_FILES=$(gh api "repos/${{ github.repository }}/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" --paginate --jq '.files[].filename')
          export CHANGED_FILES
          ./tools/ci/detect-feature-changes.sh origin/main
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ]; then
            echo "record_features=true" >> $GITHUB_OUTPUT
            echo "Feature changes detected — video recording will be enabled"
          else
            echo "record_features=false" >> $GITHUB_OUTPUT
            echo "No feature changes — skipping video recording"
          fi

  # Generates protos/ent/web-UI exactly once per run (not once per shard) and
  # shares the result as the `generated-files` artifact — see
  # .github/workflows/_prepare.yml. Both build-binary and, indirectly, every
  # e2e-video shard download that same artifact instead of re-running the
  # pipeline.
  # No timeout-minutes here: GitHub Actions rejects that key on a job that
  # calls a reusable workflow via `uses:` (actionlint syntax-check confirms —
  # only name/uses/with/secrets/needs/if/permissions are allowed). The 15m
  # budget for this stage lives in _prepare.yml's own `prepare` job, out of
  # this file's scope.
  prepare:
    name: Prepare (protos, ent, web UI)
    needs: detect-feature-changes
    if: needs.detect-feature-changes.outputs.record_features == 'true'
    uses: ./.github/workflows/_prepare.yml

  # Builds the stapler-squad binary once per run (not once per shard) from the
  # shared `prepare` output, and shares it as the `e2e-video-binary` artifact.
  build-binary:
    name: Build Binary
    runs-on: ubuntu-latest
    needs: [detect-feature-changes, prepare]
    if: needs.detect-feature-changes.outputs.record_features == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact-name }}

      - name: Build binary
        run: go build -o stapler-squad .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: e2e-video-binary
          path: stapler-squad
          retention-days: 1

  e2e-video:
    name: Record E2E Feature Videos (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-22.04  # Pinned to avoid VP8/VP9 codec surprises
    needs: [detect-feature-changes, prepare, build-binary]
    if: needs.detect-feature-changes.outputs.record_features == 'true'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.27.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: tests/e2e/pnpm-lock.yaml

      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact-name }}

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: e2e-video-binary

      - name: Make binary executable
        run: chmod +x stapler-squad

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/pnpm-lock.yaml') }}

      - name: Install Playwright dependencies
        run: |
          cd tests/e2e
          pnpm install --frozen-lockfile
          npx playwright install chromium --with-deps

      - name: Run feature E2E specs (shard ${{ matrix.shard }}/2)
        env:
          RECORD_FEATURES: 'true'
          TEST_SERVER_URL: http://localhost:8543
        run: |
          DEMO_DIR=$(mktemp -d)
          go run ./tests/demo/seed "$DEMO_DIR" 6
          echo "Seeded demo data into $DEMO_DIR"

          STAPLER_SQUAD_USE_CONTROL_MODE=false \
            ./stapler-squad --tmux-keep-server --test-mode --test-dir "$DEMO_DIR" &
          SERVER_PID=$!

          for i in $(seq 1 30); do
            if curl -s http://localhost:8543/ > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done

          cd tests/e2e
          # Soft-timeout wrapper: fail fast at 20m (soft budget) rather than
          # riding the job's 25m hard timeout-minutes to a SIGTERM with no
          # diagnostic. keep this marker prefix in sync with
          # ciBudgetExceededMarker in server/services/github_webhook_pr_fix.go
          timeout 20m npx playwright test ${{ env.FEATURE_SPECS }} \
            --shard=${{ matrix.shard }}/2 \
            --reporter=list || {
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 124 ]; then
              echo "::error::CI-BUDGET-EXCEEDED: 'e2e-video' exceeded its 20m budget"
              echo "CI-BUDGET-EXCEEDED: 'e2e-video' exceeded its 20m budget" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            true
          }

          kill $SERVER_PID 2>/dev/null || true
          rm -rf "$DEMO_DIR"

      - name: Validate video files were created
        id: validate-videos
        run: |
          VIDEO_COUNT=$(find tests/e2e/test-results -name "*.webm" 2>/dev/null | wc -l || echo 0)
          echo "video_count=${VIDEO_COUNT}" >> $GITHUB_OUTPUT
          echo "Found ${VIDEO_COUNT} video file(s) in shard ${{ matrix.shard }}"

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Convert videos to GIFs
        id: convert-gifs
        if: steps.validate-videos.outputs.video_count != '0'
        run: |
          mkdir -p /tmp/demo-gifs
          NAMES=""
          WEBMS=$(
            # demo first (likely in shard 1)
            find tests/e2e/test-results/demo-Demo-Flow-chromium \
              -maxdepth 1 -name "video.webm" 2>/dev/null | head -1
            # remaining feature flows
            find tests/e2e/test-results -maxdepth 2 -name "video.webm" 2>/dev/null \
              | grep -v "demo-Demo-Flow" \
              | grep -iv "\-retry[0-9]"
          )
          for webm in $WEBMS; do
            dir=$(basename "$(dirname "$webm")")
            name=$(echo "$dir" | sed 's/-chromium$//;s/-firefox$//;s/-webkit$//')
            gif="/tmp/demo-gifs/${name}.gif"
            duration=$(ffprobe -v quiet -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 "$webm" 2>/dev/null)
            if [ -z "$duration" ] || awk "BEGIN{exit !(${duration:-0} < 1.0)}"; then
              echo "Skipping $webm (too short: ${duration:-unknown}s)"
              continue
            fi
            palette=$(mktemp --suffix=.png)
            echo "Converting $webm -> $gif"
            if ffmpeg -y -i "$webm" -vf "fps=8,scale=960:-2,palettegen=max_colors=128" -t 30 "$palette" 2>&1 \
               && ffmpeg -y -i "$webm" -i "$palette" \
                 -lavfi "fps=8,scale=960:-2[x];[x][1:v]paletteuse=dither=bayer:bayer_scale=3" \
                 -loop 0 -t 30 "$gif" 2>&1; then
              NAMES="${NAMES}${name},"
              echo "Created $gif ($(du -h "$gif" | cut -f1))"
            else
              echo "Warning: ffmpeg conversion failed for $webm"
            fi
            rm -f "$palette"
          done
          echo "names=${NAMES%,}" >> $GITHUB_OUTPUT
          if [ -z "$NAMES" ]; then
            echo "::warning::No GIFs produced in shard ${{ matrix.shard }} — WebM artifacts still available"
          fi

      - name: Bundle GIFs into HTML preview (shard ${{ matrix.shard }})
        id: bundle-preview
        if: steps.convert-gifs.outputs.names != ''
        run: |
          PREVIEW="/tmp/demo-preview-shard${{ matrix.shard }}.html"
          cat > "$PREVIEW" << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>E2E Feature Demos</title>
          <style>
            body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                   max-width: 1100px; margin: 0 auto; padding: 24px;
                   background: #0d1117; color: #e6edf3; }
            h1   { color: #58a6ff; margin-bottom: 4px; }
            p.sub { color: #8b949e; margin-top: 0; font-size: .9em; }
            .demo { margin: 32px 0; }
            .demo h2 { color: #79c0ff; font-size: 1em; margin-bottom: 8px; }
            img  { width: 100%; border-radius: 6px; border: 1px solid #30363d; }
          </style>
          </head>
          <body>
          <h1>🎬 E2E Feature Demos</h1>
          <p class="sub">Shard ${{ matrix.shard }}/2 — auto-generated from CI run</p>
          HTMLEOF

          for gif in /tmp/demo-gifs/*.gif; do
            [ -f "$gif" ] || continue
            name=$(basename "$gif" .gif)
            b64=$(base64 -w0 < "$gif")
            printf '<div class="demo"><h2>%s</h2><img src="data:image/gif;base64,%s" alt="%s"></div>\n' \
              "$name" "$b64" "$name" >> "$PREVIEW"
          done

          echo "</body></html>" >> "$PREVIEW"
          SIZE=$(du -h "$PREVIEW" | cut -f1)
          echo "Created $PREVIEW ($SIZE)"
          echo "preview_path=$PREVIEW" >> $GITHUB_OUTPUT

      - name: Upload GIF preview (shard ${{ matrix.shard }})
        id: upload-gifs
        if: steps.bundle-preview.outputs.preview_path != ''
        uses: actions/upload-artifact@v7
        with:
          name: e2e-preview-pr${{ github.event.number }}-shard${{ matrix.shard }}
          path: ${{ steps.bundle-preview.outputs.preview_path }}
          retention-days: 30
          archive: false
        continue-on-error: true

      - name: Upload videos (shard ${{ matrix.shard }})
        id: upload-videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-videos-pr${{ github.event.number }}-shard${{ matrix.shard }}
          path: tests/e2e/test-results/
          retention-days: 30
        continue-on-error: true

  notify:
    name: Post PR Comment
    runs-on: ubuntu-latest
    needs: [detect-feature-changes, e2e-video]
    if: always() && github.event_name == 'pull_request' && needs.detect-feature-changes.outputs.record_features == 'true'
    timeout-minutes: 5
    steps:
      - name: Post PR comment with artifact links
        continue-on-error: true # advisory comment; never fail the job if posting is denied
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            // Inlined rather than require('./tools/ci-gates/video-anomaly.js'):
            // this job has no checkout (pull-requests: write, and adding one
            // just to require() a PR-branch-controlled file would mean
            // executing fork-controlled JS inside a privileged step for a
            // one-line check — see tools/ci-gates/video-anomaly.js, which
            // stays the tested source of truth for this exact logic; keep
            // both in sync if the definition ever changes.
            const videoAnomaly = (artifacts) => artifacts.length === 0;
            const marker = '<!-- e2e-videos -->';
            const pr = context.issue.number;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Find all artifacts for this run matching our naming pattern
            const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });

            const gifArtifacts = artifacts
              .filter(a => a.name.startsWith(`e2e-preview-pr${pr}-shard`))
              .sort((a, b) => a.name.localeCompare(b.name));

            const videoArtifacts = artifacts
              .filter(a => a.name.startsWith(`e2e-videos-pr${pr}-shard`))
              .sort((a, b) => a.name.localeCompare(b.name));

            const shardLinks = videoArtifacts.map((a, i) => {
              const gifArtifact = gifArtifacts[i];
              const shard = i + 1;
              const parts = [];
              if (gifArtifact) parts.push(`[▶ Demo preview shard ${shard}](${gifArtifact.url})`);
              parts.push(`[recordings shard ${shard}](${a.url})`);
              return parts.join(' · ');
            });

            // The normal (non-anomaly) case no longer gets a PR comment, but
            // the demo-preview/recording links it used to carry are still
            // written here so they aren't lost — just moved from "always a
            // comment" to "always in the step summary" (Observability Plan).
            require('fs').appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              [
                '## E2E Video Recording',
                `${videoArtifacts.length} shard(s) produced video artifacts.`,
                ...shardLinks,
                '',
              ].join('\n'),
            );

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (!videoAnomaly(videoArtifacts)) {
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                });
              }
              return;
            }

            const lines = [
              '## ⚠️ E2E Video Recording',
              '',
              'No video artifacts were produced. Check the workflow run for details.',
              '',
              `[View workflow run](${runUrl})`,
            ];

            const body = [marker, ...lines].join('\n');
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body,
              });
            }
