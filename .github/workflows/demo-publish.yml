name: Publish Demo GIFs

# Manually dispatched. Records the curated feature-demo specs (same
# FEATURE_SPECS set as e2e-video.yml), sharded 2-way, and publishes the
# resulting GIFs as assets on a rolling "demo-gifs-latest" GitHub Release —
# not committed to docs/demos/ in git history.
#
# Previously committed GIFs straight into docs/demos/ on main. Multi-MB
# binary GIFs don't delta-compress between re-recordings, so 16 runs of
# this workflow left ~15.6GB of dead blob history behind (docs/demos/ is
# empty in the current tree — every byte of that was pure clone-time cost
# for every future `git clone`/`fetch-depth: 0` on this repo, forever).
# Release assets are durable and get a stable download URL
# (https://github.com/<repo>/releases/download/demo-gifs-latest/<name>.gif)
# without touching git history at all. Note nothing in this repo's docs
# currently links to a docs/demos/ path (checked via grep before this
# change), so there was nothing to migrate.

on:
  workflow_dispatch:

# Feature specs recorded — mirrors e2e-video.yml's curated set (excludes
# terminal-flickering.spec.ts, accessibility.spec.ts, smoke.spec.ts).
env:
  FEATURE_SPECS: >-
    demo.spec.ts
    review-queue.spec.ts
    session-lifecycle.spec.ts
    history-search.spec.ts
    workspace-management.spec.ts

jobs:
  record-demos:
    name: Record Demo Flows (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.27.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: tests/e2e/pnpm-lock.yaml

      - name: Generate protos and build web UI
        uses: ./.github/actions/prepare

      - name: Build binary
        run: go build -o stapler-squad .

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/pnpm-lock.yaml') }}

      - name: Install Playwright dependencies
        run: |
          cd tests/e2e
          pnpm install --frozen-lockfile
          npx playwright install chromium --with-deps

      - name: Record demo flows (shard ${{ matrix.shard }}/2)
        env:
          RECORD_FEATURES: 'true'
          TEST_SERVER_URL: http://localhost:8543
        run: |
          DEMO_DIR=$(mktemp -d)
          go run ./tests/demo/seed "$DEMO_DIR" 6
          echo "Seeded demo data into $DEMO_DIR"

          STAPLER_SQUAD_USE_CONTROL_MODE=false \
            ./stapler-squad --tmux-keep-server --test-mode --test-dir "$DEMO_DIR" &
          SERVER_PID=$!

          for i in $(seq 1 30); do
            if curl -s http://localhost:8543/ > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done

          cd tests/e2e
          npx playwright test ${{ env.FEATURE_SPECS }} \
            --shard=${{ matrix.shard }}/2 \
            --reporter=list || true

          kill $SERVER_PID 2>/dev/null || true
          rm -rf "$DEMO_DIR"

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Convert videos to GIFs
        id: convert-gifs
        run: |
          mkdir -p /tmp/demo-gifs
          NAMES=""
          WEBMS=$(
            find tests/e2e/test-results/demo-Demo-Flow-chromium \
              -maxdepth 1 -name "video.webm" 2>/dev/null | head -1
            find tests/e2e/test-results -maxdepth 2 -name "video.webm" 2>/dev/null \
              | grep -iv "terminal-flickering\|terminal-stress\|stress-test\|-retry[0-9]" \
              | grep -v "demo-Demo-Flow"
          )
          for webm in $WEBMS; do
            dir=$(basename "$(dirname "$webm")")
            name=$(echo "$dir" | sed 's/-chromium$//;s/-firefox$//;s/-webkit$//')
            gif="/tmp/demo-gifs/${name}.gif"
            duration=$(ffprobe -v quiet -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 "$webm" 2>/dev/null)
            if [ -z "$duration" ] || awk "BEGIN{exit !(${duration:-0} < 1.0)}"; then
              echo "Skipping $webm (too short: ${duration:-unknown}s)"
              continue
            fi
            palette=$(mktemp --suffix=.png)
            echo "Converting $webm -> $gif"
            if ffmpeg -y -i "$webm" -vf "fps=8,scale=960:-2,palettegen=max_colors=128" -t 30 "$palette" 2>&1 \
               && ffmpeg -y -i "$webm" -i "$palette" \
                 -lavfi "fps=8,scale=960:-2[x];[x][1:v]paletteuse=dither=bayer:bayer_scale=3" \
                 -loop 0 -t 30 "$gif" 2>&1; then
              NAMES="${NAMES}${name},"
              echo "Created $gif ($(du -h "$gif" | cut -f1))"
            else
              echo "Warning: ffmpeg conversion failed for $webm"
            fi
            rm -f "$palette"
          done
          echo "names=${NAMES%,}" >> $GITHUB_OUTPUT
          if [ -z "$NAMES" ]; then
            echo "::warning::No GIFs were produced in shard ${{ matrix.shard }} — WebM artifacts are still available"
          fi

      - name: Upload GIFs (shard ${{ matrix.shard }})
        if: steps.convert-gifs.outputs.names != ''
        uses: actions/upload-artifact@v7
        with:
          name: demo-gifs-shard${{ matrix.shard }}
          path: /tmp/demo-gifs/*.gif
          retention-days: 5

  publish-gifs:
    name: Publish GIFs to demo-gifs-latest release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: record-demos
    if: always()
    permissions:
      contents: write

    steps:
      - name: Download demo GIFs from both shards
        uses: actions/download-artifact@v4
        with:
          pattern: demo-gifs-shard*
          path: /tmp/demo-gifs
          merge-multiple: true

      - name: Upload GIFs as demo-gifs-latest release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gifs=(/tmp/demo-gifs/*.gif)
          if [ ${#gifs[@]} -eq 0 ]; then
            echo "No GIFs downloaded from either shard — nothing to publish"
            exit 0
          fi
          if ! gh release view demo-gifs-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create demo-gifs-latest \
              --repo "${{ github.repository }}" \
              --title "Demo GIFs (latest)" \
              --notes "Auto-updated by demo-publish.yml. Not a versioned release -- assets here are overwritten on every run; link to https://github.com/${{ github.repository }}/releases/download/demo-gifs-latest/<name>.gif for a stable URL to the current GIF." \
              --latest=false
          fi
          # --clobber replaces an asset with the same filename in place, so
          # the download URL for a given demo name stays stable across runs.
          gh release upload demo-gifs-latest "${gifs[@]}" --repo "${{ github.repository }}" --clobber
