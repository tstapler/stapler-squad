name: 'Fetch pinned tymuxd binary'
description: 'Downloads/restores the pinned tymuxd release binary at session/tymux/embed/tymuxd (ADR-001 — no cargo/rustc build needed)'
runs:
  using: composite
  steps:
    - name: Cache pinned tymuxd binary
      uses: actions/cache@v4
      id: tymuxd-cache
      with:
        path: session/tymux/embed/tymuxd
        # Version is hardcoded, not derived from the Makefile's TYMUX_VERSION
        # default -- mirrors build-tmux's own tmux-3.4-${{ runner.os }}-v1
        # cache key exactly (same manual-bump convention: bump this alongside
        # TYMUX_VERSION in the Makefile, nothing enforces the two staying in
        # sync automatically -- see that variable's own doc comment).
        key: tymuxd-v1.1.0-${{ runner.os }}-v1
    - name: Fetch pinned tymuxd binary
      if: steps.tymuxd-cache.outputs.cache-hit != 'true'
      shell: bash
      run: make fetch-tymuxd
