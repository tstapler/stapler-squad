name: 'Set up Bun'
description: >
  Installs the repo's pinned Bun and restores Bun's global install cache keyed
  on every bun.lock. Bun is only the package manager here; jobs that run
  Jest/Next/ESLint still need actions/setup-node (those binaries use a Node
  shebang and `bun run` hands them to node).

runs:
  using: composite
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version

    - name: Cache Bun install cache
      uses: ./.github/actions/cache-main-writes
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('web-app/bun.lock', 'tests/e2e/bun.lock', 'website/bun.lock', 'tools/*/bun.lock', 'tools/scanner/frontend/bun.lock', 'session/tymux/testdata/fidelity/oracle/bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-
        # Seeding main from an older entry would only accumulate packages no lockfile needs.
        main-fallback: 'false'
