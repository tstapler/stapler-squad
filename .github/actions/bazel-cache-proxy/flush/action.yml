name: Flush Bazel cache proxy
description: Publishes the blobs this job produced to the GitHub Actions cache and prints counters. Run with `if: always()`.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        dir="$RUNNER_TEMP/bazel-cache-proxy"
        [[ -f "$dir/pid" ]] || { echo "proxy was not started"; exit 0; }
        # Cache problems must not fail the build: report and continue.
        {
          echo '### Bazel cache proxy'
          curl -fsS -X POST http://127.0.0.1:9090/admin/flush | sed 's/^/flush: /' || echo "flush failed (see proxy log)"
          echo '```'; curl -fsS http://127.0.0.1:9090/metrics | grep -E '^bazel_cache_(lookups|put)' || true; echo '```'
        } | tee -a "$GITHUB_STEP_SUMMARY"
        kill "$(cat "$dir/pid")" 2>/dev/null || true
        grep -E "restored|no cache manifest|WARN|ERROR" "$dir/proxy.log" | tail -20 || true
