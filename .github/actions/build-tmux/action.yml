name: 'Build pinned tmux 3.8'
description: 'Installs build deps, restores/builds the pinned tmux 3.8 binary at bin/tmux'
inputs:
  install-socat:
    description: 'Also install socat (needed by real-shell approval-relay tests)'
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Install tmux build dependencies
      shell: bash
      run: |
        # Refresh the index: runner images ship a stale one and libevent-dev 404s without it.
        # Retried: a transient DNS failure on the apt mirror (seen on runners) otherwise fails the whole job.
        pkgs="automake libevent-dev libncurses-dev pkg-config"
        if [ "${{ inputs.install-socat }}" = "true" ]; then pkgs="$pkgs socat"; fi
        for attempt in 1 2 3 4; do
          if sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y $pkgs; then
            exit 0
          fi
          echo "apt attempt $attempt failed; retrying in $((attempt * 15))s"
          sleep $((attempt * 15))
        done
        echo "::error::apt-get could not install the tmux build dependencies after 4 attempts"
        exit 1
    - name: Cache pinned tmux binary
      uses: actions/cache@v4
      id: tmux-cache
      with:
        path: bin/tmux
        key: tmux-3.8-${{ runner.os }}-v1
    - name: Build pinned tmux 3.8
      if: steps.tmux-cache.outputs.cache-hit != 'true'
      shell: bash
      run: ./scripts/build-tmux.sh
