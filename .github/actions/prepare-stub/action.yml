name: 'Prepare: Protos, Ent ORM, and Web UI Stub'
description: 'Generates protobuf code and ent ORM code, then stubs server/web/dist/index.html for jobs that only need go build/go test to compile against the go:embed directive, without a real web build'

inputs:
  buf-template:
    description: >
      buf generate --template value. Default buf.gen.go-only.yaml generates
      only Go/ConnectRPC output via remote plugins — no node dependency,
      correct for callers (mcp-integration.yml, goreleaser-check.yml) that
      skip bun/node install entirely. Callers that DO install web-app Bun
      deps first (e.g. lint.yml (prepare step), which needs the TS/ES stubs
      for Jest's `@/gen/...` module resolution — even mocked imports need
      the file to exist) must pass buf.gen.yaml (the default template,
      needs web-app/node_modules/.bin/protoc-gen-es) instead.
    required: false
    default: 'buf.gen.go-only.yaml'

runs:
  using: composite
  steps:
    # Download to a temp file, verify the pinned sha256, only then install. A bare `curl -o /usr/local/bin/buf`
    # let a GitHub 504 HTML page become the "binary". The verified file is cached so most runs skip the network.
    - name: Cache buf binary
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/ci-tools/buf
        key: buf-bin-1.41.0-linux-x86_64-ccbfc1ff

    - name: Install buf
      shell: bash
      env:
        BUF_URL: https://github.com/bufbuild/buf/releases/download/v1.41.0/buf-Linux-x86_64
        BUF_SHA256: ccbfc1ff1aa72de6d36e3b0e72f89db8c1e2f11ec7a0595e86856c34237e9b20
      run: |
        set -euo pipefail
        cached="$HOME/.cache/ci-tools/buf/buf"
        verified() { echo "$BUF_SHA256  $1" | sha256sum --check --status; }
        if [ ! -f "$cached" ] || ! verified "$cached"; then
          mkdir -p "$(dirname "$cached")"
          tmp="$(mktemp)"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors \
            --connect-timeout 15 --max-time 120 "$BUF_URL" -o "$tmp"
          verified "$tmp" || { echo "::error::buf download failed sha256 verification"; head -c 200 "$tmp" >&2; exit 1; }
          install -m 0755 "$tmp" "$cached"
        fi
        sudo install -m 0755 "$cached" /usr/local/bin/buf
        buf --version

    - name: Generate protobuf code
      shell: bash
      run: buf generate proto --template ${{ inputs.buf-template }}

    - name: Generate ent ORM code
      shell: bash
      run: go run -mod=mod entgo.io/ent/cmd/ent generate --feature sql/upsert ./session/ent/schema

    - name: Create web dist stub
      shell: bash
      run: |
        mkdir -p server/web/dist
        printf '<!DOCTYPE html><html><body></body></html>' > server/web/dist/index.html
