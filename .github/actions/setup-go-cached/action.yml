name: 'Set up Go (main-written module + build cache)'
description: >
  actions/setup-go with its built-in cache turned off, replaced by a dated entry that only the default
  branch writes. This action restores; the one writer job per family also ends with save-go-cache.
  Sets GOFLAGS=-count=1 for the job so a restored build cache never replays old test results.

inputs:
  go-version-file:
    default: 'go.mod'
  scope:
    description: Cache family, e.g. test or lint. Each family is one entry per day.
    default: 'test'
  save:
    description: "'true' on the one job per family that populates the entry on main."
    default: 'false'
  golangci-cache:
    description: "'true' also caches ~/.cache/golangci-lint in this entry (lint job)."
    default: 'false'

outputs:
  save:
    description: "'true' when this job should end with save-go-cache (writer, default branch, no entry for today yet)."
    value: ${{ steps.policy.outputs.save }}
  cache-path:
    description: Path list for save-go-cache; must match the restored one or the entry is never found.
    value: ${{ steps.paths.outputs.cache-path }}
  cache-key:
    description: Today's key for this family.
    value: ${{ steps.paths.outputs.cache-key }}

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: false

    - name: Resolve Go cache paths and key
      id: paths
      shell: bash
      env:
        SCOPE: ${{ inputs.scope }}
        GOLANGCI: ${{ inputs.golangci-cache }}
      run: |
        image="${ImageOS:-unknown}"
        arch="$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
        prefix="go-$SCOPE-$image-$arch"
        {
          echo "image=$image"
          echo "arch=$arch"
          echo "prefix=$prefix"
          echo "cache-key=$prefix-$(date -u +%Y%m%d)"
          # Order matches actions/setup-go (the cache version hashes the path list).
          echo "cache-path<<PATHS"
          go env GOMODCACHE
          go env GOCACHE
          if [ "$GOLANGCI" = "true" ]; then echo "~/.cache/golangci-lint"; fi
          echo "PATHS"
        } >> "$GITHUB_OUTPUT"
        if [ "$GOLANGCI" = "true" ]; then
          echo "GOLANGCI_LINT_CACHE=$HOME/.cache/golangci-lint" >> "$GITHUB_ENV"
        fi
        echo "GOFLAGS=${GOFLAGS:+$GOFLAGS }-count=1" >> "$GITHUB_ENV"

    # Restore only: actions/cache's post step gets the wrong inputs when nested two composites deep
    # (actions/runner#2030), which is why nothing was ever saved through cache-main-writes here.
    - name: Restore Go caches
      id: restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.paths.outputs.cache-path }}
        key: ${{ steps.paths.outputs.cache-key }}
        # The last line is the pre-policy setup-go key family. Drop it once main has saved a go-* entry.
        restore-keys: |
          ${{ steps.paths.outputs.prefix }}-
          setup-go-${{ runner.os }}-${{ steps.paths.outputs.arch }}-${{ steps.paths.outputs.image }}-go-

    - name: Decide whether this job saves
      id: policy
      shell: bash
      env:
        WANT: ${{ inputs.save }}
        HIT: ${{ steps.restore.outputs.cache-hit }}
        DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
      run: |
        save=false
        if [ "$WANT" = "true" ] && [ "$GITHUB_REF" = "$DEFAULT_REF" ] && [ "$HIT" != "true" ]; then save=true; fi
        echo "save=$save" >> "$GITHUB_OUTPUT"
        echo "go cache: restore hit=${HIT:-false}, this job saves=$save"
