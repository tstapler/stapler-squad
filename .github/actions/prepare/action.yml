name: 'Prepare: Protos, Ent ORM, and Web UI'
description: 'Generates protobuf code, ent ORM code, and builds the web UI into server/web/dist'

inputs:
  github_token:
    description: 'GitHub token passed to buf-setup-action to avoid its unauthenticated download rate limit'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.0'

    - name: Set up pnpm
      uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      with:
        version: 10.27.0

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
        cache-dependency-path: web-app/pnpm-lock.yaml

    - name: Install web dependencies
      shell: bash
      run: cd web-app && pnpm install --frozen-lockfile

    # Cache the buf binary so most runs skip the network entirely — a cache
    # hit here means "Set up buf" below never touches GitHub Releases.
    - name: Cache buf binary
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/buf-bin
        key: buf-1.41.0-${{ runner.os }}-${{ runner.arch }}

    # On a cache miss, install buf directly instead of via bufbuild/buf-setup-action:
    # that action only retries for ~30s total, which isn't enough during a
    # buf.build/GH Releases blip (observed repeatedly: "socket hang up" from
    # the release asset CDN, 4 consecutive job failures across ~20 minutes).
    # buf also publishes the raw binary (no .tar.gz) per-platform, so install
    # it directly with the same retry-with-backoff.sh convention already used
    # below for the next/font fetch flake.
    - name: Set up buf
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/buf-bin"
        if [ ! -x "$RUNNER_TEMP/buf-bin/buf" ]; then
          scripts/retry-with-backoff.sh -n 5 -s 10 -- \
            curl -sSL -o "$RUNNER_TEMP/buf-bin/buf" \
            "https://github.com/bufbuild/buf/releases/download/v1.41.0/buf-$(uname -s)-$(uname -m)"
          chmod +x "$RUNNER_TEMP/buf-bin/buf"
        fi
        echo "$RUNNER_TEMP/buf-bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/buf-bin/buf" --version

    - name: Generate protobuf code
      shell: bash
      run: buf generate

    - name: Generate ent ORM code
      shell: bash
      run: go run -mod=mod entgo.io/ent/cmd/ent generate --feature sql/upsert ./session/ent/schema

    # Warms webpack's persistent cache (which holds next/font's downloaded
    # font files) across runs, so most builds skip the fonts.gstatic.com
    # network fetch entirely instead of relying on the retry below.
    - name: Cache Next.js build cache
      uses: actions/cache@v4
      with:
        path: web-app/.next/cache
        key: nextjs-${{ runner.os }}-${{ hashFiles('web-app/pnpm-lock.yaml') }}-${{ hashFiles('web-app/src/**') }}
        restore-keys: |
          nextjs-${{ runner.os }}-${{ hashFiles('web-app/pnpm-lock.yaml') }}-
          nextjs-${{ runner.os }}-

    - name: Build web UI
      shell: bash
      working-directory: web-app
      # next/font fetches fonts from fonts.gstatic.com at build time; retry
      # with backoff since that's an external network call, not our code.
      run: ../scripts/retry-with-backoff.sh -n 3 -s 5 -- pnpm run build

    - name: Copy web UI to dist
      shell: bash
      run: cp -r web-app/out server/web/dist
