# The TypeScript half of buf.gen.yaml with the plugin taken from the
# hermetic Bun install. Same managed block as buf.gen.yaml (it changes the descriptors embedded in
# *_pb.ts). @PROTOC_GEN_ES@ is replaced by tools/bzl/proto/ts.bzl with the plugin's execroot path.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/tstapler/stapler-squad/gen/proto/go
plugins:
  - local: ["@PROTOC_GEN_ES@"]
    out: web-app/src/gen
    opt:
      - target=ts
      - ts_nocheck=false
      - keep_empty_files=true
