<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 512">

  <rect width="1024" height="512" fill="#0A0A0F"/>

  <defs>
    <!-- Bottom arc for motto: r=112, center (180,256), clockwise through bottom -->
    <path id="sealBottomArc" d="M 68 256 A 112 112 0 0 1 292 256" fill="none"/>
  </defs>

  <g id="icon">

    <!-- Outer gold rim -->
    <circle cx="180" cy="256" r="148" fill="#C9A84C"/>

    <!-- Dark gap -->
    <circle cx="180" cy="256" r="140" fill="#0A0A0F"/>

    <!-- Purple whisper ring -->
    <circle cx="180" cy="256" r="136" fill="none" stroke="#5B3678" stroke-width="2"/>

    <!-- Seal face -->
    <circle cx="180" cy="256" r="132" fill="#100D14"/>

    <!-- 12 clock-position gold dots on the ring -->
    <circle cx="316" cy="256" r="4" fill="#C9A84C"/>
    <circle cx="297" cy="324" r="4" fill="#C9A84C"/>
    <circle cx="248" cy="374" r="4" fill="#C9A84C"/>
    <circle cx="180" cy="392" r="4" fill="#C9A84C"/>
    <circle cx="112" cy="374" r="4" fill="#C9A84C"/>
    <circle cx="63" cy="324" r="4" fill="#C9A84C"/>
    <circle cx="44" cy="256" r="4" fill="#C9A84C"/>
    <circle cx="63" cy="188" r="4" fill="#C9A84C"/>
    <circle cx="112" cy="138" r="4" fill="#C9A84C"/>
    <circle cx="180" cy="120" r="4" fill="#C9A84C"/>
    <circle cx="248" cy="138" r="4" fill="#C9A84C"/>
    <circle cx="297" cy="188" r="4" fill="#C9A84C"/>

    <!-- Larger, bolder staple signet — centered at (180, 254) -->
    <rect x="108" y="200" width="144" height="22" fill="#8B1A3B" rx="5"/>
    <rect x="108" y="200" width="22" height="108" fill="#8B1A3B" rx="5"/>
    <rect x="230" y="200" width="22" height="108" fill="#8B1A3B" rx="5"/>

    <!-- Curved Latin motto around inner bottom of seal -->
    <text
      font-family="Georgia, 'Times New Roman', serif"
      font-size="14"
      fill="#C9A84C"
      letter-spacing="2">
      <textPath xlink:href="#sealBottomArc" href="#sealBottomArc" startOffset="50%" text-anchor="middle">· COMMITTE MIHI ·</textPath>
    </text>

  </g>

  <line x1="340" y1="90" x2="340" y2="422" stroke="#1E1820" stroke-width="1"/>

  <g id="wordmark">

    <text
      x="692"
      y="234"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="68"
      font-weight="700"
      fill="#EDE0D0"
      letter-spacing="8"
      text-anchor="middle">SENESCHAL</text>

    <text
      x="692"
      y="290"
      font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
      font-size="15"
      font-weight="400"
      fill="#C9A84C"
      letter-spacing="5"
      text-anchor="middle">YOUR AGENTIC ESTATE, MANAGED</text>

  </g>

</svg>
