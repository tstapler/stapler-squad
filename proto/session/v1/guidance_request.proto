syntax = "proto3";

package session.v1;

import "google/protobuf/timestamp.proto";

// GuidanceRequestService lets an agent (an interactive session, headless
// triage, or an automated workflow) ask a human a structured question
// durably — the question survives session restarts/respawns — and lets the
// web UI answer it. Mirrors TymuxRolloutService's registration shape
// (proto/session/v1/tymux_rollout.proto). See
// project_plans/durable-guidance-request/implementation/plan.md Phase 2.
service GuidanceRequestService {
  // CreateGuidanceRequest creates a new durable question, or resolves to a
  // pre-existing IDENTICAL open question for the same scope instead of
  // creating a duplicate (see session.EntRepository.CreateGuidanceRequest's
  // doc comment for the dedup-then-cap ordering).
  rpc CreateGuidanceRequest(CreateGuidanceRequestRequest) returns (CreateGuidanceRequestResponse) {}

  // AnswerGuidanceRequest records a human's answer. Answering an
  // already-answered or already-cancelled request is not an error — the
  // response reflects the CURRENT persisted state (applied=false) instead of
  // a conflict error.
  rpc AnswerGuidanceRequest(AnswerGuidanceRequestRequest) returns (AnswerGuidanceRequestResponse) {}

  // GetGuidanceRequest reads a single GuidanceRequest by id.
  rpc GetGuidanceRequest(GetGuidanceRequestRequest) returns (GetGuidanceRequestResponse) {}

  // ListGuidanceRequests lists open GuidanceRequests for one (scope,
  // scope_key) pair, alongside the current pending count and cap.
  rpc ListGuidanceRequests(ListGuidanceRequestsRequest) returns (ListGuidanceRequestsResponse) {}

  // ListAllPendingGuidanceRequests lists every open GuidanceRequest across
  // every scope — backs the global nav badge (Epic 7).
  rpc ListAllPendingGuidanceRequests(ListAllPendingGuidanceRequestsRequest) returns (ListAllPendingGuidanceRequestsResponse) {}

  // ListSavedGuidanceAnswers lists answers stored for a session that is stopped
  // or archived (delivery_state saved_for_later), agent-created requests only.
  // Backs the read-only "Saved for later (N)" list in Recent activity.
  rpc ListSavedGuidanceAnswers(ListSavedGuidanceAnswersRequest) returns (ListSavedGuidanceAnswersResponse) {}
}

// GuidanceRequest is the wire representation of one durable question/answer
// row. scope/question_type/status are plain strings validated Go-side by
// domain.RequestScope/domain.QuestionType's IsValid() and
// session.GuidanceRequestData.Status() — matching this proto package's
// existing status-as-string convention (e.g. AcCriterion.status,
// BacklogStatusEvent.status in backlog.proto) rather than a proto enum.
message GuidanceRequest {
  string id = 1;
  string scope = 2; // "backlog-item" | "session" | "standalone"
  optional string item_id = 3; // set only when scope == "backlog-item"
  string session_uuid = 4; // set only when scope == "session"
  string question_text = 5;
  string question_type = 6; // "yes-no" | "multiple-choice" | "short-answer"
  repeated string options = 7; // only meaningful when question_type == "multiple-choice"
  string answer = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp notified_at = 10;
  google.protobuf.Timestamp answered_at = 11;
  google.protobuf.Timestamp cancelled_at = 12;
  // status is derived (never stored) from answered_at/cancelled_at — see
  // session.GuidanceRequestData.Status(). "pending" | "answered" | "cancelled".
  string status = 13;

  // Live-question and peer-help fields (ADR-003). Rows written before they
  // existed read back with source "agent_mcp" and answerer_kind "human".
  string source = 14; // "agent_mcp" | "ask_user_question_hook" | "peer"
  string asker_session_uuid = 15;
  string answerer_kind = 16; // "human" | "session"
  string answerer_session_uuid = 17;
  bool multi_select = 18; // question 1's checkbox flag, for old readers
  repeated GuidanceQuestion questions = 19; // 1-4 questions; empty for agent_mcp rows
  string delivery_route = 20; // "" | "hook_reply" | "live_keystroke" | "resume" | "read_only"
  string delivery_state = 21; // "" | "pending" | "sent" | "acknowledged" | "delivery_failed" | "saved_for_later" | "stale" | "aborted_partial"
  int32 delivery_attempts = 22;
  string hook_call_id = 23;
  google.protobuf.Timestamp expires_at = 24; // set only for source == "peer"
  // Derived at read time (never stored); they select the delivery-state line.
  bool unacknowledged = 25; // sent, and the agent has not confirmed it (the Unconfirmed chip)
  string cancel_reason = 26; // why a cancelled row was cancelled, e.g. "answered_in_terminal"
  bool session_ended = 27; // the asker session is gone, archived or stopped; set only for sent or failed rows
  bool session_archived = 28; // the session is archived: an answer is stored, never delivered (UX-AC27)
}

// GuidanceQuestion is one question of a mirrored harness prompt; its shape
// follows the AskUserQuestion tool input.
message GuidanceQuestion {
  string question = 1;
  string header = 2;
  repeated GuidanceOption options = 3;
  bool multi_select = 4;
}

message GuidanceOption {
  string label = 1;
  string description = 2;
}

message CreateGuidanceRequestRequest {
  string scope = 1;
  optional string item_id = 2; // required when scope == "backlog-item"
  string session_uuid = 3; // required when scope == "session" (the target session this question is about)
  string question_text = 4;
  string question_type = 5;
  repeated string options = 6;
  // caller_session_uuid identifies the session asking the question. Used for
  // the ownership check on scope == "backlog-item" (caller must be linked to
  // item_id, via the same check every other mutating backlog MCP tool uses)
  // and scope == "session" (caller must equal session_uuid). Not checked for
  // scope == "standalone".
  string caller_session_uuid = 7;
}

message CreateGuidanceRequestResponse {
  GuidanceRequest request = 1;
}

message AnswerGuidanceRequestRequest {
  string id = 1;
  string answer = 2;
}

message AnswerGuidanceRequestResponse {
  GuidanceRequest request = 1;
  // applied is true when THIS call's answer was the one persisted; false
  // when the request was already answered/cancelled by a prior call, in
  // which case request reflects that pre-existing state.
  bool applied = 2;
}

message GetGuidanceRequestRequest {
  string id = 1;
}

message GetGuidanceRequestResponse {
  GuidanceRequest request = 1;
}

message ListGuidanceRequestsRequest {
  string scope = 1;
  string scope_key = 2; // item_id or session_uuid depending on scope; "" for standalone
  // include_answered also returns answered (not just pending) rows, so a
  // view can show recent answered questions alongside pending ones. Cancelled
  // rows are never returned either way.
  bool include_answered = 3;
}

message ListGuidanceRequestsResponse {
  repeated GuidanceRequest requests = 1;
  int32 pending_count = 2;
  int32 cap = 3;
}

message ListAllPendingGuidanceRequestsRequest {}

message ListAllPendingGuidanceRequestsResponse {
  repeated GuidanceRequest requests = 1;
}

message ListSavedGuidanceAnswersRequest {}

message ListSavedGuidanceAnswersResponse {
  repeated GuidanceRequest requests = 1;
}
