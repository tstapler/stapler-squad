syntax = "proto3";

package session.v1;

import "google/protobuf/timestamp.proto";
import "session/v1/types.proto";

// AcCriterion represents a single acceptance criterion for a backlog item.
message AcCriterion {
  int32 index = 1;
  string text = 2;
  string status = 3; // "pending", "in_progress", "done"
}

// CriterionVerdict holds the review outcome for a single acceptance criterion.
message CriterionVerdict {
  int32 criterion_index = 1;
  string outcome = 2;
  string evidence = 3;
}

// ReviewVerdict captures the overall and per-criterion review outcome for an
// item session.
message ReviewVerdict {
  string id = 1;
  string overall_outcome = 2;
  repeated CriterionVerdict per_criterion = 3;
  string summary = 4;
  string diff_hash = 5;
  int32 diff_token_count = 6;
  bool diff_truncated = 7;
  string override_by = 8;
  string override_reason = 9;
  google.protobuf.Timestamp override_at = 10;
  google.protobuf.Timestamp created_at = 11;
}

// TriageSuggestion represents a single suggestion from the triage agent.
message TriageSuggestion {
  string text = 1;
  string rationale = 2; // "question" marker for R7-lite clarifying questions
}

// TriageTask represents a single implementation task from the triage plan.
message TriageTask {
  string text = 1;     // one-line task description
  string estimate = 2; // e.g. "2h", "30m"
  string category = 3; // e.g. "backend", "frontend", "test", "infra", "docs"
}

// TriageResult holds the output from a completed triage session.
message TriageResult {
  string summary = 1;
  repeated TriageSuggestion suggestions = 2;
  repeated string clarifying_questions = 3;
  repeated TriageTask tasks = 4;
  // iteration is 1 for the initial triage run, incrementing by one for each
  // feedback-driven re-triage of the same item.
  int32 iteration = 5;
  // feedback is the free-text feedback that produced this iteration, empty
  // for the initial (non-refined) triage run.
  string feedback = 6;
}

// ItemSession records a session that was spawned or attached to a backlog item.
message ItemSession {
  string id = 1;
  string session_uuid = 2;
  string session_role = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp ended_at = 5;
  string last_commit_message = 6;
  google.protobuf.Timestamp last_commit_at = 7;
  int32 commit_count_since_spawn = 8;
  google.protobuf.Timestamp last_file_touch_at = 9;
  google.protobuf.Timestamp created_at = 10;
  ReviewVerdict review_verdict = 11;
  TriageResult triage_result = 12;
  double estimated_cost_usd = 13;
  string worktree_branch = 14;
  string worktree_path = 15;
  string pipeline_mode_snapshot = 16;
  string pipeline_mode_snapshot_hash = 17;
  // end_reason is set alongside ended_at for a headless (triage/review) call:
  // classifyHeadlessCallError's bucket ("shutdown", "timeout", "process_error",
  // "claude_not_found", "other"), or empty for a successful end. Already captured
  // durably (session.ItemSessionSummary.EndReason) but previously never surfaced
  // over the wire.
  string end_reason = 18;
  // failure_capture_path is the absolute path to a durable file holding the
  // size-capped raw stdout of a headless triage/review call that errored or
  // whose result failed to parse — see session.WriteHeadlessFailureCapture. Empty
  // when the call succeeded and parsed cleanly, or capture itself failed.
  string failure_capture_path = 19;
}

// BacklogStatusEvent records a single status transition for a backlog item.
message BacklogStatusEvent {
  string id = 1;
  string from_status = 2;
  string to_status = 3;
  string triggered_by = 4; // "user" or "system"
  google.protobuf.Timestamp created_at = 5;
  // note is the human-readable reason for this transition, e.g. "auto-reopened
  // after FAIL verdict" or "PASS verdict — pushed branch and opened PR". Already
  // captured durably (session.BacklogStatusEventData.Note) but previously never
  // surfaced over the wire — the "why" behind reviewer/system decisions.
  optional string note = 6;
}

// BacklogProgressNote records a single report_progress call against one of a
// backlog item's acceptance criteria — the implementer's audit trail. Unlike
// AcCriterion.status (current status per criterion, overwritten on each call),
// this is an append-only history: every call is preserved.
message BacklogProgressNote {
  string id = 1;
  int32 criterion_index = 2;
  string note = 3;
  string status = 4; // "pending", "in_progress", "done", "fail"
  google.protobuf.Timestamp created_at = 5;
}

// BacklogItem represents a unit of work in the backlog.
message BacklogItem {
  string id = 1;
  string title = 2;
  string description = 3;
  repeated AcCriterion acceptance_criteria = 4;
  int32 priority = 5;
  string status = 6;
  string repo_path = 7;
  bool skip_review_gate = 8;
  bool skip_planning = 9;
  bool plan_approved = 10;
  google.protobuf.Timestamp plan_approved_at = 11;
  string plan_artifacts_path = 12;
  string notes = 13;
  string external_id = 14;
  google.protobuf.Timestamp archived_at = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
  repeated ItemSession item_sessions = 18;
  string source_id = 19;
  repeated BacklogStatusEvent status_events = 20;
  double total_estimated_cost_usd = 21;
  string pr_url = 22;
  int32 pr_number = 23;
  bool auto_spawn_session = 24;
  optional string pipeline_mode = 25;
  bool auto_create_pr = 26;
  // progress_notes is the implementer's append-only report_progress audit
  // trail — eagerly loaded alongside status_events (see GetBacklogItem).
  repeated BacklogProgressNote progress_notes = 27;
  // rework_cap_override: unset means "use the global default"
  // (MaxAutoReworkIterationsOrDefault). 0 = unlimited retries for this item.
  // >0 = this item's own cap, replacing the global value.
  optional int32 rework_cap_override = 28;
  // category is a coarse classification (bugfix/feature/chore/refactor) the
  // frontend uses to pre-fill sane automation-toggle defaults at creation
  // time. Unset/empty means uncategorized.
  optional string category = 29;
  // external_url is the source tracker's own URL for this item (e.g. a
  // GitHub issue's html_url), populated for imported items only.
  optional string external_url = 30;
  // labels mirrors the source tracker's labels (e.g. a GitHub issue's label
  // names), populated for imported items only.
  repeated string labels = 31;
  // allowed_transitions is the server's WorkflowEngine.AllowedTransitions(status)
  // for this item's current status — the authoritative set of target statuses
  // a manual status override may choose from. The frontend must render this
  // list verbatim rather than re-encoding the transition graph client-side.
  repeated string allowed_transitions = 32;
  // plan_rejection_reason is the free-text reason from the most recent
  // RejectPlan call. Cleared on ApprovePlan, on the next TriggerTriage
  // completion, and on backward transition to idea/refining. Empty means
  // "no outstanding rejection".
  string plan_rejection_reason = 33;
  google.protobuf.Timestamp plan_rejected_at = 34;
}

// ItemSource represents an external plugin source that syncs items into the
// backlog.
message ItemSource {
  string id = 1;
  string plugin_id = 2;
  string display_name = 3;
  bool enabled = 4;
  google.protobuf.Timestamp last_synced_at = 5;
  bool token_configured = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  bool forward_sync_enabled = 9;
  bool backward_sync_enabled = 10;
  string forward_sync_close_label = 11;
}

// PipelineMode is a named, slug-addressed, user-creatable definition of which
// slash-commands and prompt content a backlog item's pipeline uses.
message PipelineMode {
  string id = 1;
  string slug = 2;
  string name = 3;
  string description = 4;
  bool enabled = 5;
  string status_command_template = 6;
  string done_command_template = 7;
  string fail_command_template = 8;
  string review_command_template = 9;
  string ship_command_template = 10;
  string help_command_template = 11;
  string triage_prompt_template = 12;
  string review_prompt_template = 13;
  string initial_prompt_template = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  // content_hash is DERIVED: computed on read (SHA-256 hex, truncated to 16
  // chars) from the row's live 9 content-template fields, in fixed field
  // order — it is not a stored DB column. Used by the "what ran" UI to
  // detect drift between a session's frozen snapshot hash and this mode's
  // current content.
  string content_hash = 17;
}

// SourceSyncEvent records the result of a single sync run for an ItemSource.
message SourceSyncEvent {
  string id = 1;
  google.protobuf.Timestamp started_at = 2;
  google.protobuf.Timestamp finished_at = 3;
  int32 items_created = 4;
  int32 items_updated = 5;
  int32 items_skipped = 6;
  int32 items_errored = 7;
  string error_message = 8;
}

// --- Request / Response messages ---

message CreateBacklogItemRequest {
  string title = 1;
  string description = 2;
  repeated AcCriterion acceptance_criteria = 3;
  int32 priority = 4;
  bool skip_review_gate = 5;
  bool skip_planning = 6;
  string repo_path = 7;
  string notes = 8;
  bool skip_triage = 9;
  bool auto_spawn_session = 10;
  optional string pipeline_mode = 11;
  bool auto_create_pr = 12;
  // category is a coarse classification (bugfix/feature/chore/refactor).
  // Unset means uncategorized.
  optional string category = 13;
}

message CreateBacklogItemResponse {
  BacklogItem item = 1;
  bool triage_triggered = 2;
}

message GetBacklogItemRequest {
  string item_id = 1;
}

message GetBacklogItemResponse {
  BacklogItem item = 1;
}

// BacklogItemShipStatus answers "did this item's code actually ship" from
// durable evidence (repo_path + the most recent work session's commit),
// rather than a live per-session worktree — the live VCSStatus widget can't
// answer this once a session's worktree has been cleaned up (done items).
message BacklogItemShipStatus {
  // shipped is true when the last work-session commit is confirmed an
  // ancestor of main, locally or via origin — see IsCommitOnMain.
  bool shipped = 1;
  // shipped_via is "pr", "direct", or "" when not shipped.
  string shipped_via = 2;
  string pr_url = 3;
  string branch_name = 4;
  // branch_exists is false once the branch has been deleted (e.g. after a
  // GitHub "delete branch on merge" or manual cleanup) — ahead_of_main /
  // behind_main are only meaningful when this is true.
  bool branch_exists = 5;
  int32 ahead_of_main = 6;
  int32 behind_main = 7;
  string last_commit_sha = 8;
  string last_commit_message = 9;
  google.protobuf.Timestamp last_commit_at = 10;
  // error is set (with all other fields at zero value) when repo_path is
  // inaccessible or no work session ever committed anything.
  string error = 11;
  // commits lists every commit in the shipped range (base..last work-session
  // commit), newest first — like a PR's "Commits" tab, but derived from
  // durable git history rather than the GitHub API, so it works the same
  // whether the code shipped via a merged PR or a direct commit to main.
  repeated ShippedCommit commits = 12;
  // shipped_check_conclusion holds the durable GitHub CI-conclusion snapshot
  // captured at ship time — genuine GitHub CI-conclusion values only (or
  // unset); never a capture-failure sentinel — see snapshot_capture_failed.
  // Populated only when a durable snapshot exists (nil/zero-value otherwise).
  string shipped_check_conclusion = 13;
  // shipped_approved_count is the durable review-approval-count snapshot
  // captured at ship time. Populated only when a durable snapshot exists
  // (nil/zero-value otherwise).
  int32 shipped_approved_count = 14;
  // shipped_changes_req_count is the durable "changes requested" review
  // count snapshot captured at ship time. Populated only when a durable
  // snapshot exists (nil/zero-value otherwise).
  int32 shipped_changes_req_count = 15;
  // file_stats is the durable per-file diff-stat snapshot captured at ship
  // time. Populated only when a durable snapshot exists (nil/zero-value
  // otherwise).
  repeated ShippedFileStat file_stats = 16;
  // snapshot_at is the timestamp the durable snapshot was captured at.
  // Populated only when a durable snapshot exists (nil/zero-value
  // otherwise).
  google.protobuf.Timestamp snapshot_at = 17;
  // snapshot_capture_failed is true when CaptureShipSnapshot's GitHub-data
  // group or file-stats group failed to capture at ship time — distinct
  // from shipped_check_conclusion, which holds only genuine CI-conclusion
  // values. Populated only when a durable snapshot exists (nil/zero-value
  // otherwise).
  bool snapshot_capture_failed = 18;
}

// ShippedCommit is one commit in a BacklogItemShipStatus's shipped range.
message ShippedCommit {
  string sha = 1;
  string summary = 2; // first line of the commit message
  string author_name = 3;
  google.protobuf.Timestamp authored_at = 4;
}

// ShippedFileStat is one file's durable per-file diff-stat snapshot,
// captured at ship time via FileStatsBetween. Mirrors FileChange's field
// shape so the proto<->ent mapping stays mechanical.
message ShippedFileStat {
  string path = 1;
  session.v1.FileStatus status = 2;
  int32 additions = 3;
  int32 deletions = 4;
}

message GetBacklogItemShipStatusRequest {
  string item_id = 1;
}

message GetBacklogItemShipStatusResponse {
  BacklogItemShipStatus status = 1;
}

message ListBacklogItemsRequest {
  repeated string status = 1;
  repeated int32 priority = 2;
  string sort_by = 3;
  // include_terminal, when true, includes items with status "done" in the
  // default (no explicit `status` filter) result set. Independent of
  // include_archived below — this field no longer also controls "archived"
  // visibility (see include_archived's doc comment for why that split
  // exists).
  bool include_terminal = 4;
  // include_archived, when true, includes items with status "archived" in
  // the default (no explicit `status` filter) result set. Split out from
  // include_terminal so a client can show "done" items by default while
  // still hiding "archived" ones unless the user opts in (mirrors the
  // session list's "Show Archived" toggle). Ignored when `status` is set
  // explicitly — an explicit status filter always wins.
  bool include_archived = 5;
}

message ListBacklogItemsResponse {
  repeated BacklogItem items = 1;
}

message UpdateBacklogItemRequest {
  string item_id = 1;
  string title = 2;
  string description = 3;
  repeated AcCriterion acceptance_criteria = 4;
  int32 priority = 5;
  bool skip_review_gate = 6;
  bool skip_planning = 7;
  string repo_path = 8;
  string notes = 9;
  string expected_status = 10;
  google.protobuf.Timestamp expected_updated_at = 11;
  bool auto_spawn_session = 12;
  optional string pipeline_mode = 13;
  bool auto_create_pr = 14;
  // rework_cap_override is a per-item override for the auto-rework cap.
  // Unset = leave the item's stored override untouched. 0 = unlimited retries
  // for this item. >0 = this item's own cap, replacing the global default.
  optional int32 rework_cap_override = 15;
  // category is presence-gated (optional string on the wire): unset means
  // "leave the item's stored category untouched", a non-nil pointer
  // (including one pointing at "") explicitly sets/clears it.
  optional string category = 16;
  // pr_url/pr_number are presence-gated (optional on the wire) and must be
  // set together or not at all: setting exactly one is rejected with
  // CodeInvalidArgument. When both are set, the server validates pr_url
  // parses as a GitHub PR URL whose embedded PR number matches pr_number,
  // then writes through the shared SetBacklogItemPRAndTransition primitive
  // (requires the item to currently be in "review" status).
  optional string pr_url = 17;
  optional int32 pr_number = 18;
}

message UpdateBacklogItemResponse {
  BacklogItem item = 1;
}

message ArchiveBacklogItemRequest {
  string item_id = 1;
}

message ArchiveBacklogItemResponse {
  BacklogItem item = 1;
}

message DeleteBacklogItemRequest {
