// ============================================================================
// Backlog Item Events (for WatchBacklogItems streaming)
// ============================================================================
//
// Defined here (not in events.proto) because the oneof variants reference
// BacklogItem and ReviewVerdict, which are defined in this file — importing
// events.proto from here (or this file from events.proto) would create a
// circular import between the two proto files.

// BacklogItemEvent represents a real-time change to a backlog item.
// Used for the WatchBacklogItems streaming RPC.
message BacklogItemEvent {
  // Timestamp when the event occurred.
  google.protobuf.Timestamp timestamp = 1;

  // Event type (one of the following).
  oneof event {
    BacklogItemStatusChangedEvent status_changed = 2;
    BacklogItemVerdictRecordedEvent verdict_recorded = 3;
    BacklogItemSessionAttachedEvent session_attached = 4;
    BacklogItemUpdatedEvent item_updated = 5;
    BacklogItemArchivedEvent item_archived = 6;
    BacklogItemRemovedEvent item_removed = 7;
    // Synthetic marker (no corresponding bus event) sent exactly once, at the
    // end of WatchBacklogItems' initial phase (fresh snapshot or after_seq
    // replay), but ONLY when that phase sent zero other events — e.g. a
    // genuinely empty backlog, or a status_filter/category_filter matching
    // nothing. Without it, a zero-item connection produces zero bytes on the
    // wire, and the client's `for await` loop never resolves past its first
    // iteration — permanently stuck at connectionState "connecting" even
    // though the stream is healthy and correctly has nothing to report. See
    // useWatchBacklogItems.ts's handling (falls through to a no-op case) and
    // backlog_service_events.go's watchBacklogItems doc comment.
    BacklogSnapshotCompleteEvent snapshot_complete = 9;
  }

  // Monotonically-increasing sequence number assigned by pkg/events.EventBus
  // at Publish time, mirroring SessionEvent.seq. Zero means "no sequence
  // information" — used for the per-item synthetic snapshot events sent on a
  // fresh (non-replay) connection, which don't correspond to a single
  // published bus event and must not participate in the frontend's
  // afterSeq/gap-detection bookkeeping (see useWatchBacklogItems.ts).
  uint64 seq = 8;
}

// BacklogItemStatusChangedEvent is emitted when an item's status transitions
// (e.g. "in_progress" -> "review").
message BacklogItemStatusChangedEvent {
  string item_id = 1;
  string old_status = 2;
  string new_status = 3;
  BacklogItem item = 4;

  // Whether this event is part of an initial snapshot (sent on stream
  // connect/reconnect) rather than a live change. Frontend should not
  // flash/notify for snapshot events.
  bool is_snapshot = 5;
}

// BacklogItemVerdictRecordedEvent is emitted when a review verdict is
// recorded for one of an item's sessions.
message BacklogItemVerdictRecordedEvent {
  string item_id = 1;
  ReviewVerdict verdict = 2;
  BacklogItem item = 3;
  bool is_snapshot = 4;
}

// BacklogItemSessionAttachedEvent is emitted when a session is spawned from
// or attached to a backlog item.
message BacklogItemSessionAttachedEvent {
  string item_id = 1;
  string session_id = 2;
  BacklogItem item = 3;
  bool is_snapshot = 4;
}

// BacklogItemUpdatedEvent is emitted when one or more item fields change
// (title, description, priority, etc.) outside of a status transition.
message BacklogItemUpdatedEvent {
  string item_id = 1;
  repeated string updated_fields = 2;
  BacklogItem item = 3;
  bool is_snapshot = 4;
}

// BacklogItemArchivedEvent is emitted when an item is soft-deleted via
// ArchiveBacklogItem.
message BacklogItemArchivedEvent {
  string item_id = 1;
  google.protobuf.Timestamp archived_at = 2;
  bool is_snapshot = 3;
}

// BacklogItemRemovedEvent is emitted when an item is permanently deleted via
// DeleteBacklogItem. Never part of a snapshot by definition — a removed item
// has nothing left to snapshot.
message BacklogItemRemovedEvent {
  string item_id = 1;
  string reason = 2;
}

// BacklogSnapshotCompleteEvent carries no data — it exists purely so the
// stream has sent at least one message by the time the initial phase
// (fresh snapshot or after_seq replay) finishes with zero real events to
// report. See BacklogItemEvent.snapshot_complete's doc comment.
message BacklogSnapshotCompleteEvent {}

// WatchBacklogItemsRequest configures the WatchBacklogItems streaming RPC.
message WatchBacklogItemsRequest {
  // Optional: only receive events for items with one of these statuses.
  repeated string status_filter = 1;

  // Optional: only receive events for items in one of these categories.
  repeated string category_filter = 2;

  // Optional: resume a stream after this sequence number instead of
  // receiving a fresh initial snapshot (see pkg/events.EventsSince).
  uint64 after_seq = 3;
}

// BacklogService manages backlog items and their lifecycle through AI-assisted
// planning, implementation, and review workflows.
service BacklogService {
  // CreateBacklogItem adds a new item to the backlog.
  rpc CreateBacklogItem(CreateBacklogItemRequest) returns (CreateBacklogItemResponse) {}

  // GetBacklogItem retrieves a single backlog item by ID.
  rpc GetBacklogItem(GetBacklogItemRequest) returns (GetBacklogItemResponse) {}

  // GetBacklogItemShipStatus answers "did this item's code actually ship" from
  // repo_path + the most recent work session's commit — works even once the
  // work session's own worktree has been cleaned up (e.g. a "done" item),
  // unlike the live per-session VCSStatus widget.
  rpc GetBacklogItemShipStatus(GetBacklogItemShipStatusRequest) returns (GetBacklogItemShipStatusResponse) {}

  // ListBacklogItems returns backlog items with optional filtering and sorting.
  rpc ListBacklogItems(ListBacklogItemsRequest) returns (ListBacklogItemsResponse) {}

  // UpdateBacklogItem modifies the properties of an existing backlog item.
  rpc UpdateBacklogItem(UpdateBacklogItemRequest) returns (UpdateBacklogItemResponse) {}

  // ArchiveBacklogItem soft-deletes an item by setting its archived_at timestamp.
  rpc ArchiveBacklogItem(ArchiveBacklogItemRequest) returns (ArchiveBacklogItemResponse) {}

  // DeleteBacklogItem permanently removes an item and all its child records.
  rpc DeleteBacklogItem(DeleteBacklogItemRequest) returns (DeleteBacklogItemResponse) {}

  // TransitionBacklogItemStatus moves an item through the status state machine.
  rpc TransitionBacklogItemStatus(TransitionBacklogItemStatusRequest) returns (TransitionBacklogItemStatusResponse) {}

  // SpawnSessionFromItem creates a new AI agent session for a backlog item.
  rpc SpawnSessionFromItem(SpawnSessionFromItemRequest) returns (SpawnSessionFromItemResponse) {}

  // AttachSessionToItem links an existing session to a backlog item.
  rpc AttachSessionToItem(AttachSessionToItemRequest) returns (AttachSessionToItemResponse) {}

  // TriggerTriage kicks off a triage session for a backlog item.
  rpc TriggerTriage(TriggerTriageRequest) returns (TriggerTriageResponse) {}

  // CancelTriage stops a running triage session for a backlog item.
  rpc CancelTriage(CancelTriageRequest) returns (CancelTriageResponse) {}

  // ApprovePlan marks the planning artifacts for an item as approved.
  rpc ApprovePlan(ApprovePlanRequest) returns (ApprovePlanResponse) {}

  // RejectPlan records a rejection reason for an item's current plan
  // artifacts and clears any existing approval. Does not itself trigger
  // regeneration — see project_plans/plan-approval-ux/decisions/ADR-002.
  rpc RejectPlan(RejectPlanRequest) returns (RejectPlanResponse) {}

  // SuggestNextItem recommends the highest-priority actionable backlog item.
  rpc SuggestNextItem(SuggestNextItemRequest) returns (SuggestNextItemResponse) {}

  // OverrideVerdict manually overrides a review verdict for an item session.
  rpc OverrideVerdict(OverrideVerdictRequest) returns (OverrideVerdictResponse) {}

  // TriggerReReview re-runs the review gate for a backlog item.
  rpc TriggerReReview(TriggerReReviewRequest) returns (TriggerReReviewResponse) {}

  // TriggerShipPR manually runs the same one-shot PR-creation flow the opt-in
  // AutoCreatePR policy uses, for an item sitting in review (or done with no PR
  // yet) with no PR of its own — the self-service "Ship PR" action on the item
  // detail page.
  rpc TriggerShipPR(TriggerShipPRRequest) returns (TriggerShipPRResponse) {}

  // TriggerSync initiates a sync run for an external item source.
  rpc TriggerSync(TriggerSyncRequest) returns (TriggerSyncResponse) {}

  // CreateItemSource registers a new external plugin source.
  rpc CreateItemSource(CreateItemSourceRequest) returns (CreateItemSourceResponse) {}

  // ListItemSources returns all registered external item sources.
  rpc ListItemSources(ListItemSourcesRequest) returns (ListItemSourcesResponse) {}

  // UpdateItemSource modifies configuration for an existing item source.
  rpc UpdateItemSource(UpdateItemSourceRequest) returns (UpdateItemSourceResponse) {}

  // DeleteItemSource removes an external item source registration.
  rpc DeleteItemSource(DeleteItemSourceRequest) returns (DeleteItemSourceResponse) {}

  // GetSyncHistory returns the sync event history for an item source.
  rpc GetSyncHistory(GetSyncHistoryRequest) returns (GetSyncHistoryResponse) {}

  // PreviewBackwardSyncImpact reports how many already-imported items for a
  // source would immediately transition (per ADR-002's determineBackwardSyncTarget)
  // if backward sync were enabled right now — used to gate the Settings UI's
  // first-enable confirmation dialog (Epic 4.4) so a user can see the blast
  // radius of already-closed linked issues before opting in.
  rpc PreviewBackwardSyncImpact(PreviewBackwardSyncImpactRequest) returns (PreviewBackwardSyncImpactResponse) {}

  // CreatePipelineMode registers a new runtime-definable pipeline mode.
  rpc CreatePipelineMode(CreatePipelineModeRequest) returns (CreatePipelineModeResponse) {}

  // UpdatePipelineMode modifies an existing pipeline mode's fields.
  rpc UpdatePipelineMode(UpdatePipelineModeRequest) returns (UpdatePipelineModeResponse) {}

  // DeletePipelineMode removes a pipeline mode definition.
  rpc DeletePipelineMode(DeletePipelineModeRequest) returns (DeletePipelineModeResponse) {}

  // GetPipelineMode retrieves a single pipeline mode by slug.
  rpc GetPipelineMode(GetPipelineModeRequest) returns (GetPipelineModeResponse) {}

  // ListPipelineModes returns all pipeline modes, including disabled ones.
  rpc ListPipelineModes(ListPipelineModesRequest) returns (ListPipelineModesResponse) {}

  // ImportGitHubIssue creates a backlog item pre-populated from a GitHub issue.
  rpc ImportGitHubIssue(ImportGitHubIssueRequest) returns (ImportGitHubIssueResponse) {}

  // SearchGitHubRepos returns GitHub repos accessible to the authenticated user.
  rpc SearchGitHubRepos(SearchGitHubReposRequest) returns (SearchGitHubReposResponse) {}

  // ListGitHubIssues returns issues for a specific GitHub repo.
  rpc ListGitHubIssues(ListGitHubIssuesRequest) returns (ListGitHubIssuesResponse) {}

  // GetBacklogItemDiff returns the committed diff for a backlog item's work sessions
  // (from the earliest work session base SHA to the current HEAD).
  rpc GetBacklogItemDiff(GetBacklogItemDiffRequest) returns (GetBacklogItemDiffResponse) {}

  // GetBacklogItemCost returns the estimated token cost for all sessions linked to an item.
  rpc GetBacklogItemCost(GetBacklogItemCostRequest) returns (GetBacklogItemCostResponse) {}

  // GetSessionBacklogIndex returns all item sessions mapped to their backlog item metadata.
  // Used by the Insights dashboard to annotate sessions with backlog context.
  rpc GetSessionBacklogIndex(GetSessionBacklogIndexRequest) returns (GetSessionBacklogIndexResponse) {}

  // SubmitManualReview allows a user to submit a review verdict directly,
  // without running an AI review session.
  rpc SubmitManualReview(SubmitManualReviewRequest) returns (SubmitManualReviewResponse) {}

  // ListStuckBacklogItems returns open (unresolved, un-snoozed) stuck backlog
  // items — items that have stopped progressing toward merge, with a reason,
  // since-when, and PR context.
  rpc ListStuckBacklogItems(ListStuckBacklogItemsRequest) returns (ListStuckBacklogItemsResponse) {}

  // SnoozeStuckItem suppresses a stuck row from the active view and from
  // re-notification until the given time.
  rpc SnoozeStuckItem(SnoozeStuckItemRequest) returns (SnoozeStuckItemResponse) {}

  // ResetStuckRemediation clears the automated-remediation counters
  // (remediation_attempts, next_remediation_at, notified_at) on a single open
  // stuck row, letting a fresh automated attempt/notification cycle fire
  // immediately instead of waiting on stale backoff/dedup state. Distinct
  // from TriggerRemediationNow: this never itself invokes a remediation
  // action, it only un-parks the row.
  rpc ResetStuckRemediation(ResetStuckRemediationRequest) returns (ResetStuckRemediationResponse) {}

  // BulkResetStuckRemediation applies ResetStuckRemediation's reset to every
  // open stuck row matching the optional reason filter — the "something
  // upstream broke a batch of these, give them all a fresh shot" admin
  // action, e.g. after an OOM-restart storm inflated attempt counts across
  // many items at once.
  rpc BulkResetStuckRemediation(BulkResetStuckRemediationRequest) returns (BulkResetStuckRemediationResponse) {}

  // TriggerRemediationNow immediately runs the reason-specific remediation
  // action for a single open stuck row, bypassing only the next_remediation_at
  // backoff timer — every other safety gate (the 5-attempt cap, the wrapped
  // action's own circuit breaker) still applies, and this attempt still
  // counts toward remediation_attempts like any dispatcher-triggered one.
  // Rejects with an error (rather than silently un-parking) when the row has
  // already exhausted its attempt budget — use ResetStuckRemediation first.
  rpc TriggerRemediationNow(TriggerRemediationNowRequest) returns (TriggerRemediationNowResponse) {}

  // WatchBacklogItems streams real-time backlog item events (status changes,
  // verdicts, session attachments, updates, archival, removal).
  // Server-streaming RPC for live backlog updates without polling.
  rpc WatchBacklogItems(WatchBacklogItemsRequest) returns (stream BacklogItemEvent) {}
}

message ImportGitHubIssueRequest {
  // GitHub issue URL (https://github.com/owner/repo/issues/N) or shorthand (owner/repo#N).
  string issue_url = 1;
  // Optional repo path override; if empty, derived from the issue URL.
  string repo_path = 2;
  // If true, skip automated triage after import.
  bool skip_planning = 3;
  // Optional GitHub account username to authenticate the import with, when
  // multiple accounts are connected for the issue URL's host. Empty resolves
  // to any configured token for that host (see github.GetKeychainTokenForHost).
  string account_username = 4;
}

message ImportGitHubIssueResponse {
  BacklogItem item = 1;
  bool triage_triggered = 2;
}

message CancelTriageRequest {
  string item_id = 1;
}

message CancelTriageResponse {
  bool cancelled = 1;
}

message GitHubRepoEntry {
  string owner = 1;
  string repo = 2;
  bool is_local = 3;
  string local_path = 4;
  string description = 5;
}

message GitHubIssueEntry {
  int32 number = 1;
  string title = 2;
  string state = 3;
  string url = 4;
  repeated string labels = 5;
  string body = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  bool is_pr = 9;
  // GitHub login of the issue's author.
  string author = 10;
}

message SearchGitHubReposRequest {
  string query = 1;
  int32 limit = 2;
}

message SearchGitHubReposResponse {
  repeated GitHubRepoEntry repos = 1;
}

message ListGitHubIssuesRequest {
  string owner = 1;
  string repo = 2;
  string state = 3;
  string search = 4;
  int32 limit = 5;
}

message ListGitHubIssuesResponse {
  repeated GitHubIssueEntry issues = 1;
}

message GetBacklogItemDiffRequest {
  string item_id = 1;
}

message GetBacklogItemDiffResponse {
  string diff = 1;
  int32 added = 2;
  int32 removed = 3;
}

message SessionCostEntry {
  string session_id = 1;
  string session_role = 2; // "work", "triage", "review"
  double estimated_cost_usd = 3;
  int64 input_tokens = 4;
  int64 output_tokens = 5;
}

message GetBacklogItemCostRequest {
  string item_id = 1;
}

message GetBacklogItemCostResponse {
  double total_cost_usd = 1;
  repeated SessionCostEntry sessions = 2;
}

// BacklogSessionEntry maps a tmux session UUID to the backlog item it belongs to.
message BacklogSessionEntry {
  string session_uuid = 1;
  string item_id = 2;
  string item_title = 3;
  string item_status = 4;
  string session_role = 5;
}

message GetSessionBacklogIndexRequest {}

message GetSessionBacklogIndexResponse {
  repeated BacklogSessionEntry entries = 1;
}

message SubmitManualReviewRequest {
  string item_id = 1;
  // overall_outcome must be PASS, FAIL, PARTIAL, or UNVERIFIABLE.
  string overall_outcome = 2;
  string summary = 3;
  // per_criterion_verdicts is optional. When empty, a single synthetic verdict
  // is created using overall_outcome for all AC criteria.
  repeated CriterionVerdict per_criterion_verdicts = 4;
}

message SubmitManualReviewResponse {
  BacklogItem item = 1;
}

// --- Stuck backlog item visibility ---

// StuckReason mirrors domain.StuckReason (session/domain/backlog.go) — the
// validated string-backed enum of classes a backlog item can be "stuck" for.
// STUCK_REASON_UNSPECIFIED is also used as the safe fallback when an unknown
// string is encountered mapping a DB row to proto (never panics).
enum StuckReason {
  STUCK_REASON_UNSPECIFIED = 0;
  STUCK_REASON_PR_READY_UNMERGED = 1;
  STUCK_REASON_REWORK_CAP = 2;
  STUCK_REASON_ABANDONED_REVIEW = 3;
  STUCK_REASON_STALE_WORK = 4;
  STUCK_REASON_BOUNCING = 5;
  STUCK_REASON_PUSH_FAILED = 6;
  STUCK_REASON_ORPHANED_TRIAGE = 7;
  STUCK_REASON_AUTONOMOUS_STUCK = 8;
  STUCK_REASON_SPAWN_FAILED = 9;
  STUCK_REASON_PLAN_NOT_APPROVED = 10;
  STUCK_REASON_PR_PENDING_NO_PR = 11;
  // STUCK_REASON_REWORK_BLOCKED_STALE: see domain.StuckReasonReworkBlockedStale
  // (session/domain/backlog.go) — a review-status item's rework attempt is
  // blocked by a still-alive-but-stale prior work session.
  STUCK_REASON_REWORK_BLOCKED_STALE = 12;
  // STUCK_REASON_PR_NEEDS_FIX: see domain.StuckReasonPRNeedsFix
  // (session/domain/backlog.go) — a pr_pending item's PR has failing CI, a
  // blocking review, a merge conflict, or unaddressed comment feedback, and
  // ReconcilePRPending's comment-feedback-driven fix attempts have exhausted
  // the shared rework cap.
  STUCK_REASON_PR_NEEDS_FIX = 13;
  // STUCK_REASON_RESPAWN_BLOCKED_ACTIVE: see domain.StuckReasonRespawnBlockedActive
  // (session/domain/backlog.go) — an automated respawn attempt
  // (AutoRespawnAutonomousWork, AutoReopenForPRFix, or AutoRespawnReview) was
  // skipped because the item already has an active work or review session.
  STUCK_REASON_RESPAWN_BLOCKED_ACTIVE = 14;
  // STUCK_REASON_LIKELY_FLAKY: see domain.StuckReasonLikelyFlaky
  // (session/domain/backlog.go) — behavioral evidence (a review-verdict
  // flip-flop on an unchanged diff, or a test-file-only rework cycle) that
  // this item's review outcome may be non-deterministic rather than a real
  // pass/fail signal. Purely informational — never gates the reopen/park
  // decision; present as a hint to verify, not a confident verdict.
  STUCK_REASON_LIKELY_FLAKY = 15;
}

// StuckBacklogItem is a single open (unresolved, un-snoozed) BacklogStuckState
// row joined with its parent item's rendering-relevant fields.
message StuckBacklogItem {
  string item_id = 1;
  string title = 2;
  string status = 3;
  StuckReason reason = 4;
  google.protobuf.Timestamp first_detected_at = 5;
  google.protobuf.Timestamp last_checked_at = 6;
  int32 pr_number = 7;
  string pr_url = 8;
  string context = 9;
  // snoozed_until is present only when the row was already scheduled to
  // become un-snoozed at query time (ListStuckBacklogItems only ever returns
  // rows that are currently un-snoozed, so this is normally unset).
  google.protobuf.Timestamp snoozed_until = 10;
  // allow_auto_merge surfaces the repo's GitHub auto-merge setting, read-only
  // and best-effort (see plan.md Story 4.1.4 / ADR discussion). This field is
  // declared here so the Phase 4 frontend work doesn't require a second
  // proto-gen round-trip, but it is intentionally left unset (not populated)
  // by the ListStuckBacklogItems handler added in this change — Phase 4 owns
  // fetching and populating it. Unset means "not fetched / unknown", not
  // "auto-merge disabled".
  optional bool allow_auto_merge = 11;
  // remediation_attempts is how many automated (or operator-triggered via
  // TriggerRemediationNow) remediation attempts have been made for this open
  // row. remediation_attempts >= 5 means the row is "parked" — automated
  // remediation has stopped until ResetStuckRemediation is called.
  int32 remediation_attempts = 12;
  // next_remediation_at is when this row becomes eligible for the next
  // automated remediation attempt. Unset means either no attempt has been
  // made yet (remediation_attempts == 0, eligible immediately) or the row is
  // parked (remediation_attempts >= 5) — check remediation_attempts to tell
  // the two apart.
  optional google.protobuf.Timestamp next_remediation_at = 13;
  // plan_artifacts_path mirrors BacklogItem.plan_artifacts_path — empty means
  // no plan exists yet. Lets the frontend gate the PLAN_NOT_APPROVED
  // "Approve Plan" affordance on an actual plan existing, instead of trusting
  // `reason` alone (which only refreshes on the next ReconcileStuck tick).
  string plan_artifacts_path = 14;
}

message ListStuckBacklogItemsRequest {}

message ListStuckBacklogItemsResponse {
  repeated StuckBacklogItem items = 1;
}

message SnoozeStuckItemRequest {
  string item_id = 1;
  StuckReason reason = 2;
  google.protobuf.Timestamp until = 3;
}

message SnoozeStuckItemResponse {
  // applied is true when an open row matching (item_id, reason) was found
  // and snoozed; false when no such open row exists (not an error).
  bool applied = 1;
}

message ResetStuckRemediationRequest {
  string item_id = 1;
  StuckReason reason = 2;
}

message ResetStuckRemediationResponse {
  // applied is true when an open row matching (item_id, reason) was found
  // and reset; false when no such open row exists (not an error).
  bool applied = 1;
}

message BulkResetStuckRemediationRequest {
  // reason filters to a single stuck reason; unset (STUCK_REASON_UNSPECIFIED)
  // resets matching rows across every reason.
  StuckReason reason = 1;
  // only_parked restricts the reset to rows that actually hit the 5-attempt
  // cap. Defaults to true at the RPC layer when unset — see
  // only_parked_explicitly_set.
  bool only_parked = 2;
  // only_parked_explicitly_set distinguishes "only_parked=false because the
  // caller wants every open row regardless of attempt count" from "the field
  // was left at its zero value" — proto3 bool fields cannot otherwise tell
  // "explicitly false" apart from "unset". Set true whenever the caller
  // deliberately supplied only_parked (either value).
  bool only_parked_explicitly_set = 3;
}

message BulkResetStuckRemediationResponse {
  // reset_count is how many rows were reset by this call.
  int32 reset_count = 1;
}

message TriggerRemediationNowRequest {
  string item_id = 1;
  StuckReason reason = 2;
}

message TriggerRemediationNowResponse {
  // triggered is true when the remediation action was invoked. False is
  // never returned on success — a row that cannot be remediated (no open
  // row, already parked, no action registered for this reason yet) is
  // reported as an RPC error instead, so the frontend can show a specific
  // reason rather than a bare "nothing happened".
  bool triggered = 1;
}
