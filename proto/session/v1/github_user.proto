syntax = "proto3";

package session.v1;

import "session/v1/types.proto";

option go_package = "github.com/tstapler/stapler-squad/gen/proto/go/session/v1";

// GitHubUserService provides access to the authenticated user's GitHub pull
// requests across all repos. Data is served from the in-process UserPRCache
// (which polls the GitHub GraphQL API in the background). No subprocess calls.
service GitHubUserService {
  // ListUserPRs returns all open PRs authored by the authenticated user,
  // annotated with any matching local session IDs and worktree paths.
  // Returns an empty list with auth_state.available=false when unauthenticated.
  rpc ListUserPRs(ListUserPRsRequest) returns (ListUserPRsResponse) {}

  // WatchUserPRs streams UserPREvent messages whenever the UserPRCache
  // refreshes. The first event always contains a full snapshot.
  rpc WatchUserPRs(WatchUserPRsRequest) returns (stream UserPREvent) {}

  // GetGitHubAuthState returns current auth availability and username.
  // Used by the frontend to show/hide the GitHub PRs section and render
  // the auth banner when the user has not authenticated.
  rpc GetGitHubAuthState(GetGitHubAuthStateRequest) returns (GetGitHubAuthStateResponse) {}

  // StartGitHubDeviceAuth initiates the GitHub Device Flow OAuth. Returns the
  // user_code to display and verification_uri to open. The caller should then
  // poll PollGitHubDeviceAuth until auth completes or expires.
  rpc StartGitHubDeviceAuth(StartGitHubDeviceAuthRequest) returns (StartGitHubDeviceAuthResponse) {}

  // PollGitHubDeviceAuth polls GitHub's token endpoint once. Returns the
  // current status: pending, complete (token stored in keychain), or expired.
  rpc PollGitHubDeviceAuth(PollGitHubDeviceAuthRequest) returns (PollGitHubDeviceAuthResponse) {}

  // RevokeGitHubToken removes the keychain-stored GitHub token and clears
  // the auth state. Does not revoke the token on GitHub's side.
  rpc RevokeGitHubToken(RevokeGitHubTokenRequest) returns (RevokeGitHubTokenResponse) {}

  // ListGitHubAccounts returns all connected GitHub accounts (from keychain and env vars).
  rpc ListGitHubAccounts(ListGitHubAccountsRequest) returns (ListGitHubAccountsResponse) {}

  // AddGitHubAccountWithToken validates a personal access token against the
  // host's /user endpoint and stores it in the keychain on success. Use this
  // for hosts that don't support OAuth Device Flow (e.g. some GHES instances).
  rpc AddGitHubAccountWithToken(AddGitHubAccountWithTokenRequest) returns (AddGitHubAccountWithTokenResponse) {}

  // ListGitHubCLIHosts discovers hosts the local `gh` CLI is already
  // authenticated to (via its hosts.yml config), so the UI can offer them as
  // one-click imports instead of requiring the user to paste a token.
  rpc ListGitHubCLIHosts(ListGitHubCLIHostsRequest) returns (ListGitHubCLIHostsResponse) {}

  // AddGitHubAccountFromCLI fetches the token gh CLI already holds for host
  // (via `gh auth token --hostname <host>`), validates it, and stores it in
  // the keychain on success — the same outcome as AddGitHubAccountWithToken
  // but without the user needing to locate/paste the token by hand.
  rpc AddGitHubAccountFromCLI(AddGitHubAccountFromCLIRequest) returns (AddGitHubAccountWithTokenResponse) {}

  // NudgeSessionForPR asks one linked local session to fix what is currently
  // wrong with a PR (failing checks, unresolved threads, merge conflict). The
  // server re-fetches fresh PR state with the PR's owning account, builds the
  // prompt (link, path and author only; never third-party comment bodies) and
  // delivers it through the per-session guard. Outcomes are typed in
  // NudgeOutcome; unsupported programs return FailedPrecondition.
  rpc NudgeSessionForPR(NudgeSessionForPRRequest) returns (NudgeSessionForPRResponse) {}
}

// GitHubAccount is a single connected GitHub account.
message GitHubAccount {
  string username    = 1;
  bool   is_env_token = 2; // true when sourced from GITHUB_TOKEN/GH_TOKEN env var
  string host         = 3; // GitHub host, e.g. "github.com" or a GHES hostname; empty means github.com
}

// GitHubAuthState describes the current GitHub authentication status.
message GitHubAuthState {
  bool   available     = 1; // true when a token is present and /user returned 200
  string username      = 2; // primary (first) GitHub login; empty when available=false
  string error_message = 3; // human-readable reason when available=false
  repeated GitHubAccount accounts = 4; // all connected accounts
}

message ListUserPRsRequest {}

message ListUserPRsResponse {
  repeated UserPR    prs        = 1;
  GitHubAuthState    auth_state = 2;
  repeated AccountPollStatus account_statuses = 3;
}

enum AccountPollState {
  ACCOUNT_POLL_STATE_UNSPECIFIED  = 0;
  ACCOUNT_POLL_STATE_OK           = 1;
  ACCOUNT_POLL_STATE_UNAUTHORIZED = 2;
  ACCOUNT_POLL_STATE_RATE_LIMITED = 3;
  ACCOUNT_POLL_STATE_ERROR        = 4;
}

// AccountPollStatus is the per-account outcome of the last PR poll.
message AccountPollStatus {
  string           host          = 1;
  string           account_login = 2;
  AccountPollState state         = 3;
  string           detail        = 4; // short sanitized reason, never a token
}

message WatchUserPRsRequest {}

message UserPREvent {
  // event_type is "snapshot", "added", "updated", or "removed".
  string          event_type = 1;
  repeated UserPR prs        = 2; // full list for "snapshot"; changed PRs otherwise
  GitHubAuthState auth_state = 3;
  repeated AccountPollStatus account_statuses = 4;
}

message GetGitHubAuthStateRequest {}

message GetGitHubAuthStateResponse {
  GitHubAuthState auth_state = 1;
}

message StartGitHubDeviceAuthRequest {
  string host = 1; // GitHub host to authenticate against; empty means github.com
}

message StartGitHubDeviceAuthResponse {
  string device_code       = 1; // opaque code passed back to PollGitHubDeviceAuth
  string user_code         = 2; // 8-char code the user enters at verification_uri
  string verification_uri  = 3; // URL to open (e.g. https://github.com/login/device)
  int32  expires_in        = 4; // seconds until the device_code expires
  int32  interval          = 5; // minimum poll interval in seconds
}

message PollGitHubDeviceAuthRequest {
  string device_code = 1;
}

// DeviceAuthStatus describes the outcome of a single poll attempt.
enum DeviceAuthStatus {
  DEVICE_AUTH_STATUS_UNSPECIFIED = 0;
  DEVICE_AUTH_STATUS_PENDING     = 1; // waiting for user to authorize
  DEVICE_AUTH_STATUS_COMPLETE    = 2; // token received and stored in keychain
  DEVICE_AUTH_STATUS_EXPIRED     = 3; // device code expired; restart the flow
  DEVICE_AUTH_STATUS_ERROR       = 4; // unexpected error
}

message PollGitHubDeviceAuthResponse {
  DeviceAuthStatus status      = 1;
  string           error       = 2; // set when status == ERROR
  GitHubAuthState  auth_state  = 3; // set when status == COMPLETE
}

message RevokeGitHubTokenRequest {
  string username = 1; // if set, remove only this account; otherwise remove the legacy single-account token
  string host     = 2; // host the account belongs to; empty means github.com
}

message RevokeGitHubTokenResponse {}

message ListGitHubAccountsRequest {}

message ListGitHubAccountsResponse {
  repeated GitHubAccount accounts = 1;
  // enterprise_hosts lists the GHES hostnames configured on the server
  // (github.com is always implicitly available and not included here).
  repeated string enterprise_hosts = 2;
}

message AddGitHubAccountWithTokenRequest {
  string host  = 1; // GitHub host to authenticate against; empty means github.com
  string token = 2; // personal access token
}

message AddGitHubAccountWithTokenResponse {
  GitHubAuthState auth_state = 1; // updated state on success
}

// GitHubCLIHost is a host the local `gh` CLI is already authenticated to.
message GitHubCLIHost {
  string host          = 1; // normalized host, e.g. "github.com" or a GHES hostname
  string username      = 2; // gh CLI's recorded username for this host, if known
  bool   already_added = 3; // true when this host+username is already a connected account
}

message ListGitHubCLIHostsRequest {}

message ListGitHubCLIHostsResponse {
  repeated GitHubCLIHost hosts   = 1;
  bool                   gh_available = 2; // false when the gh CLI config could not be read (not installed / never logged in)
}

message AddGitHubAccountFromCLIRequest {
  string host = 1; // host to import, as returned by ListGitHubCLIHosts
}

// PRKey identifies one pull request. An empty host means github.com.
message PRKey {
  string host   = 1;
  string owner  = 2;
  string repo   = 3;
  int32  number = 4;
}

// NudgeOutcome is the typed result of NudgeSessionForPR.
enum NudgeOutcome {
  NUDGE_OUTCOME_UNSPECIFIED        = 0;
  NUDGE_OUTCOME_DELIVERED          = 1;
  NUDGE_OUTCOME_BUSY               = 2;
  NUDGE_OUTCOME_PAUSED             = 3;
  NUDGE_OUTCOME_DUPLICATE          = 4;
  NUDGE_OUTCOME_NOTHING_TO_FIX     = 5;
  NUDGE_OUTCOME_SESSION_NOT_LINKED = 6;
  NUDGE_OUTCOME_PR_NOT_FOUND       = 7;
  // The linked session no longer exists or is not running (deleted or crashed),
  // as opposed to PAUSED, which Open session can resume.
  NUDGE_OUTCOME_NOT_RUNNING        = 8;
}

// NudgeReason is one kind of problem a nudge prompt covers.
enum NudgeReason {
  NUDGE_REASON_UNSPECIFIED        = 0;
  NUDGE_REASON_FAILING_CHECKS     = 1;
  NUDGE_REASON_UNRESOLVED_THREADS = 2;
  NUDGE_REASON_MERGE_CONFLICT     = 3;
}

message NudgeSessionForPRRequest {
  PRKey  pr         = 1;
  string session_id = 2; // title of a session linked to the PR
}

message NudgeSessionForPRResponse {
  NudgeOutcome outcome = 1;
  repeated NudgeReason reasons = 2; // what the delivered prompt covered
  string session_id = 3;
  string detail     = 4; // human-readable, sanitized; never a token
}
