syntax = "proto3";

package session.v1;

import "session/v1/types.proto";

option go_package = "github.com/tstapler/stapler-squad/gen/proto/go/session/v1";

// GitHubUserService provides access to the authenticated user's GitHub pull
// requests across all repos. Data is served from the in-process UserPRCache
// (which polls the GitHub GraphQL API in the background). No subprocess calls.
service GitHubUserService {
  // ListUserPRs returns all open PRs authored by the authenticated user,
  // annotated with any matching local session IDs and worktree paths.
  // Returns an empty list with auth_state.available=false when unauthenticated.
  rpc ListUserPRs(ListUserPRsRequest) returns (ListUserPRsResponse) {}

  // WatchUserPRs streams UserPREvent messages whenever the UserPRCache
  // refreshes. The first event always contains a full snapshot.
  rpc WatchUserPRs(WatchUserPRsRequest) returns (stream UserPREvent) {}

  // GetGitHubAuthState returns current auth availability and username.
  // Used by the frontend to show/hide the GitHub PRs section and render
  // the auth banner when the user has not authenticated.
  rpc GetGitHubAuthState(GetGitHubAuthStateRequest) returns (GetGitHubAuthStateResponse) {}

  // StartGitHubDeviceAuth initiates the GitHub Device Flow OAuth. Returns the
  // user_code to display and verification_uri to open. The caller should then
  // poll PollGitHubDeviceAuth until auth completes or expires.
  rpc StartGitHubDeviceAuth(StartGitHubDeviceAuthRequest) returns (StartGitHubDeviceAuthResponse) {}

  // PollGitHubDeviceAuth polls GitHub's token endpoint once. Returns the
  // current status: pending, complete (token stored in keychain), or expired.
  rpc PollGitHubDeviceAuth(PollGitHubDeviceAuthRequest) returns (PollGitHubDeviceAuthResponse) {}

  // RevokeGitHubToken removes the keychain-stored GitHub token and clears
  // the auth state. Does not revoke the token on GitHub's side.
  rpc RevokeGitHubToken(RevokeGitHubTokenRequest) returns (RevokeGitHubTokenResponse) {}

  // ListGitHubAccounts returns all connected GitHub accounts (from keychain and env vars).
  rpc ListGitHubAccounts(ListGitHubAccountsRequest) returns (ListGitHubAccountsResponse) {}
}

// GitHubAccount is a single connected GitHub account.
message GitHubAccount {
  string username    = 1;
  bool   is_env_token = 2; // true when sourced from GITHUB_TOKEN/GH_TOKEN env var
}

// GitHubAuthState describes the current GitHub authentication status.
message GitHubAuthState {
  bool   available     = 1; // true when a token is present and /user returned 200
  string username      = 2; // primary (first) GitHub login; empty when available=false
  string error_message = 3; // human-readable reason when available=false
  repeated GitHubAccount accounts = 4; // all connected accounts
}

message ListUserPRsRequest {}

message ListUserPRsResponse {
  repeated UserPR    prs        = 1;
  GitHubAuthState    auth_state = 2;
}

message WatchUserPRsRequest {}

message UserPREvent {
  // event_type is "snapshot", "added", "updated", or "removed".
  string          event_type = 1;
  repeated UserPR prs        = 2; // full list for "snapshot"; changed PRs otherwise
  GitHubAuthState auth_state = 3;
}

message GetGitHubAuthStateRequest {}

message GetGitHubAuthStateResponse {
  GitHubAuthState auth_state = 1;
}

message StartGitHubDeviceAuthRequest {}

message StartGitHubDeviceAuthResponse {
  string device_code       = 1; // opaque code passed back to PollGitHubDeviceAuth
  string user_code         = 2; // 8-char code the user enters at verification_uri
  string verification_uri  = 3; // URL to open (e.g. https://github.com/login/device)
  int32  expires_in        = 4; // seconds until the device_code expires
  int32  interval          = 5; // minimum poll interval in seconds
}

message PollGitHubDeviceAuthRequest {
  string device_code = 1;
}

// DeviceAuthStatus describes the outcome of a single poll attempt.
enum DeviceAuthStatus {
  DEVICE_AUTH_STATUS_UNSPECIFIED = 0;
  DEVICE_AUTH_STATUS_PENDING     = 1; // waiting for user to authorize
  DEVICE_AUTH_STATUS_COMPLETE    = 2; // token received and stored in keychain
  DEVICE_AUTH_STATUS_EXPIRED     = 3; // device code expired; restart the flow
  DEVICE_AUTH_STATUS_ERROR       = 4; // unexpected error
}

message PollGitHubDeviceAuthResponse {
  DeviceAuthStatus status      = 1;
  string           error       = 2; // set when status == ERROR
  GitHubAuthState  auth_state  = 3; // set when status == COMPLETE
}

message RevokeGitHubTokenRequest {
  string username = 1; // if set, remove only this account; otherwise remove the legacy single-account token
}

message RevokeGitHubTokenResponse {}

message ListGitHubAccountsRequest {}

message ListGitHubAccountsResponse {
  repeated GitHubAccount accounts = 1;
}
