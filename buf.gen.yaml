version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/tstapler/stapler-squad/gen/proto/go
plugins:
  # Go protobuf generation
  - remote: buf.build/protocolbuffers/go
    out: gen/proto/go
    opt:
      - paths=source_relative

  # Go ConnectRPC generation. Pinned to v1.20.0 -- matching go.mod's
  # connectrpc.com/connect v1.20.0 exactly -- because the unpinned remote
  # plugin floats to BSR's latest release independently of this repo's
  # dependency pin, and that latest release now generates against
  # connectrpc.com/connect/v2 (a breaking major-version jump: different
  # import path, incompatible with v1.20.0), which doesn't build. Bump this
  # alongside go.mod's connect-go version, not independently.
  - remote: buf.build/connectrpc/go:v1.20.0
    out: gen/proto/go
    opt:
      - paths=source_relative

  # TypeScript protobuf message types generation (for web-app)
  - local: web-app/node_modules/.bin/protoc-gen-es
    out: web-app/src/gen
    opt:
      - target=ts
      - ts_nocheck=false
      - keep_empty_files=true
