            - "!**/server/services/analytics_escape_service.go"
            - "!**/server/services/analytics_escape_service_test.go"
            - "!**/server/services/workflow_service_test.go"
            - "!**/server/services/workflow_service.go"
            - "!**/server/services/backlogsvc/backlog_service_query.go"
            - "!**/server/services/backlogsvc/backlog_service_lifecycle.go"
            - "!**/server/services/backlogsvc/backlog_service_triage.go"
            - "!**/server/services/backlogsvc/backlog_service_headless_run.go"
            # TriggerTriage's ent.IsNotFound check moved here from
