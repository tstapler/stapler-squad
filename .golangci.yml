version: "2"

run:
  # ponytail: single-threaded to avoid golangci-lint v2.11.4 race on //go:build go1.26 files
  concurrency: 1

linters:
  enable:
    - depguard
    - exhaustive
    - forbidigo
    - gochecknoglobals
    - ineffassign
    - nilnil
    - prealloc
    - staticcheck
    - govet
    - unused
  disable:
    - errcheck
  settings:
    exhaustive:
      default-signifies-exhaustive: false
    # Hotspot-analysis follow-up (2026-08-06, session/backlog_lifecycle.go split into
    # backlog_lifecycle_{review,pr,triage,stale,archive}.go): gocyclo/gocognit/funlen/
    # revive(file-length-limit) catch the exact shape that let backlog_lifecycle.go grow
    # to 4930 lines / 91 methods before anyone flagged it — a giant file, a giant function,
    # or a deeply-branching function. Deliberately NOT in the `enable:` list above: the repo
    # already has ~100 pre-existing violations in files this change didn't touch (top
    # offenders: server/services/session_service.go, session/tmux/tmux.go,
    # session/ent_repository.go, pkg/classifier/classifier.go — several are already on the
    # code-hotspot-analysis skill's radar). Enabling them here would fail `make lint` for
    # everyone immediately on unrelated code. Instead, .github/workflows/lint.yml enables
    # them via `--enable` scoped to `only-new-issues: true`, so only NEW violations in
    # changed code fail CI — these settings just configure the thresholds for that step.
    # `make lint` / `make ci` / `make pre-commit` are intentionally unaffected.
    gocyclo:
      min-complexity: 25
    gocognit:
      min-complexity: 40
    funlen:
      lines: 150
      statements: 100
      ignore-comments: true
    revive:
      rules:
        - name: file-length-limit
          arguments:
            - max: 1000
              skipComments: true
              skipBlankLines: true
    # Same rationale/pattern as gocyclo/gocognit/funlen/revive above: dupl flags
    # copy-pasted Go blocks (the "Duplicated/Divergent Logic" failure mode — see
    # quality:reflect-and-fix's Level 0 consolidation gate, added 2026-08-24 after
    # a stapler-squad resize fix shipped at one call site and silently missed two
    # others). Not in `enable:` above — the repo almost certainly has pre-existing
    # duplication nothing has measured yet, and enabling it unscoped would fail
    # `make lint`/`make ci` for everyone immediately. `.github/workflows/lint.yml`'s
    # complexity gate step also enables dupl via --new-from-rev=origin/main, so only
    # duplication introduced in a PR's own diff fails CI; `ready-complexity-gate`
    # mirrors that locally. Threshold is dupl's own default (150 tokens).
    dupl:
      threshold: 150
    depguard:
      rules:
        # files: globs below deliberately avoid the "**/X/**/*.go" shape (double globstar with
        # a trailing suffix): golangci-lint v2.12.2's depguard requires the middle `**` to match
        # at least one path segment, so that shape silently matches zero files whenever a target
        # file sits directly in X with no subdirectory in between (e.g. every file in the flat
        # server/services/ directory, or files directly under session/ like session/storage.go).
        # Confirmed by direct repro: "**/server/services/**/*.go" matched 0 of 8 real
        # session/ent imports in server/services/; "**/server/services/**" (no /*.go suffix)
        # matched all 8. Use the bare "**/X/**" form — it still only selects files depguard's
        # type-checker actually parses (.go files), so dropping /*.go loses no precision.
        no_server_in_core:
          files:
            - "**/session/**"
            - "**/config/**"
            - "**/log/**"
            - "!**/*_test.go" # test files are covered by `make ready-test-inversions` (tools/bzl/scoping), not here
          deny:
            - pkg: "github.com/tstapler/stapler-squad/server"
              desc: "core packages (session/config/log) must not import the server layer"
            - pkg: "github.com/tstapler/stapler-squad/server/**"
              desc: "core packages must not import server subpackages"
        # Packages split out by ADR-010 (Epic 13) stay off the ent ORM: persistence reaches them through the core's
        # interfaces. Transitive reach is checked by `scoping boundaries` (tools/bzl/scoping/boundaries.txt).
        scoped_packages_off_ent:
          files:
            - "**/session/prpoller/**"
            - "**/services/sessionbundle/**"
            - "**/services/devtools/**"
            - "**/services/insights/**"
            - "**/services/debugseed/**"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/tstapler/stapler-squad/session/ent"
              desc: "ADR-010 scoped packages must not import the ent ORM directly"
        # Tracker plugins are leaves: the session core consumes them only through ItemSourcePlugin.
        session_core_off_itemsources:
          files:
            - "**/session/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/tstapler/stapler-squad/session/itemsources"
              desc: "session core must not import tracker plugins; the composition root injects them"
        # Shared test doubles: only _test.go files may import them (the package is testonly in Bazel).
        procbackendtest_test_only:
          files:
            - "**/*.go"
            - "!**/*_test.go"
            - "!**/session/internal/procbackendtest/**"
          deny:
            - pkg: "github.com/tstapler/stapler-squad/session/internal/procbackendtest"
              desc: "session/internal/procbackendtest holds test doubles; import it from _test.go files only"
        memfs_test_only:
          files:
            - "**/*.go"
            - "!**/*_test.go"
            - "!**/server/services/fsops/memfs/**"
          deny:
            - pkg: "github.com/tstapler/stapler-squad/server/services/fsops/memfs"
              desc: "server/services/fsops/memfs holds test doubles; import it from _test.go files only"
        fsopstest_test_only:
          files:
            - "**/*.go"
            - "!**/*_test.go"
            - "!**/server/services/fsops/fsopstest/**"
          deny:
            - pkg: "github.com/tstapler/stapler-squad/server/services/fsops/fsopstest"
              desc: "server/services/fsops/fsopstest holds test fixtures; import it from _test.go files only"
        push_no_services:
          files:
            - "**/server/push/**"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/tstapler/stapler-squad/server/services"
              desc: "server/push owns its web-push service and must not depend on the services hub"
        # Allow-list rather than a deny-list: depguard's `/**` deny globs did not match
        # subpackages (e.g. server/web) in a probe, so a deny rule here would silently pass.
        isolate_threatscan_stdlib_only:
          list-mode: strict
          files:
            - "**/pkg/threatscan/*.go"
          allow:
            - $gostd
        # session/migrations is ent-bound startup-migration infrastructure: session hands it behaviour
        # through Hooks/Env, so it never imports session, github or server (TestNonTestFiles_*, boundaries.txt).
        isolate_migrations:
          list-mode: strict
          files:
            - "**/session/migrations/*.go"
            - "!**/*_test.go"
          allow:
            - $gostd
            - entgo.io/ent/dialect
            - github.com/tstapler/stapler-squad/session/ent
            - github.com/tstapler/stapler-squad/log
        # session/webhookstore is a persistence leaf embedded by session.EntRepository: it never imports
        # session, github or server.
        isolate_webhookstore:
          list-mode: strict
          files:
            - "**/session/webhookstore/*.go"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/google/uuid
            - github.com/tstapler/stapler-squad/session/domain
            - github.com/tstapler/stapler-squad/session/ent
        # session/guidancestore is a persistence leaf embedded by session.EntRepository: it never imports
        # session, github or server; the one call back into backlog publishing is a constructor argument.
        isolate_guidancestore:
          list-mode: strict
          files:
            - "**/session/guidancestore/*.go"
            - "!**/*_test.go"
          allow:
            - $gostd
            - entgo.io/ent/dialect/sql
            - github.com/google/uuid
            - go.opentelemetry.io/otel
            - github.com/tstapler/stapler-squad/log
            - github.com/tstapler/stapler-squad/telemetry
            - github.com/tstapler/stapler-squad/session/domain
            - github.com/tstapler/stapler-squad/session/ent
        # session/flowstore is the flow-analytics ent reader: it never imports session, github or server
        # (the workflow engine is injected through New).
        isolate_flowstore:
          list-mode: strict
          files:
            - "**/session/flowstore/*.go"
            - "!**/*_test.go"
          allow:
            - $gostd
            - entgo.io/ent/dialect/sql
            - github.com/google/uuid
            - github.com/tstapler/stapler-squad/log
            - github.com/tstapler/stapler-squad/session/domain
            - github.com/tstapler/stapler-squad/session/ent
            - github.com/tstapler/stapler-squad/session/flow
        # session/wakestore is a persistence leaf embedded by session.EntRepository: it never imports
        # session, github or server.
        isolate_wakestore:
          list-mode: strict
          files:
            - "**/session/wakestore/*.go"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/google/uuid
            - github.com/tstapler/stapler-squad/session/domain
            - github.com/tstapler/stapler-squad/session/ent
        # session/jsonmigrate is the one-shot JSON-to-Ent import behind the migrate_data and
        # migrate_global scripts: it reaches the database through an injected opener and never
        # imports session, github or server.
        isolate_jsonmigrate:
          list-mode: strict
          files:
            - "**/session/jsonmigrate/*.go"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/tstapler/stapler-squad/log
            - github.com/tstapler/stapler-squad/session/domain
        # session/workspacepeers answers list_workspace_peers and the session-start peer nudge over a
        # consumer-side Store port: it never imports session or server, and no github directly
        # (session/instance reaches it, so boundaries.txt has no !github row).
        isolate_workspacepeers:
          list-mode: strict
          files:
            - "**/session/workspacepeers/*.go"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/tstapler/stapler-squad/executor/safeexec
            - github.com/tstapler/stapler-squad/log
            - github.com/tstapler/stapler-squad/session/domain
            - github.com/tstapler/stapler-squad/session/ent
            - github.com/tstapler/stapler-squad/session/ent/sessiongoal
            - github.com/tstapler/stapler-squad/session/instance
            - github.com/tstapler/stapler-squad/session/tmux
        # session/ptydiscovery backs only the `test-pty` debug command (main.go); it never imports
        # session, github or server.
        isolate_ptydiscovery:
          list-mode: strict
          files:
            - "**/session/ptydiscovery/*.go"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/linkdata/deadlock
            - github.com/tstapler/stapler-squad/executor/safeexec
            - github.com/tstapler/stapler-squad/internal/syncutil
            - github.com/tstapler/stapler-squad/log
            - github.com/tstapler/stapler-squad/session/claudectl
            - github.com/tstapler/stapler-squad/session/domain
            - github.com/tstapler/stapler-squad/session/instance
            - github.com/tstapler/stapler-squad/session/tmux
        # session/shellstore is a persistence leaf embedded by session.EntRepository: it never
        # imports session, github or server.
        isolate_shellstore:
          list-mode: strict
          files:
            - "**/session/shellstore/*.go"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/tstapler/stapler-squad/session/domain
            - github.com/tstapler/stapler-squad/session/ent
            - github.com/tstapler/stapler-squad/session/ent/session
            - github.com/tstapler/stapler-squad/session/ent/shell
        # session/credentialstore is a persistence leaf embedded by session.EntRepository: it never
        # imports session, github or server.
        isolate_credentialstore:
          list-mode: strict
          files:
            - "**/session/credentialstore/*.go"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/tstapler/stapler-squad/session/domain
            - github.com/tstapler/stapler-squad/session/ent
            - github.com/tstapler/stapler-squad/session/ent/integrationcredential
        # session/projectstore is a persistence leaf embedded by session.EntRepository: it never
        # imports session, github or server.
        isolate_projectstore:
          list-mode: strict
          files:
            - "**/session/projectstore/*.go"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/tstapler/stapler-squad/session/domain
            - github.com/tstapler/stapler-squad/session/ent
            - github.com/tstapler/stapler-squad/session/ent/project
            - github.com/tstapler/stapler-squad/session/ent/session
        # session/rulestore is a persistence leaf embedded by session.EntRepository: it never
        # imports session, github or server.
        isolate_rulestore:
          list-mode: strict
          files:
            - "**/session/rulestore/*.go"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/tstapler/stapler-squad/session/domain
            - github.com/tstapler/stapler-squad/session/ent
            - github.com/tstapler/stapler-squad/session/ent/approvalrule
            - github.com/tstapler/stapler-squad/session/ent/taggingrule
            - github.com/tstapler/stapler-squad/session/ent/taggingrulefire
        # session/analyticsstore is a persistence leaf embedded by session.EntRepository: it never
        # imports session, github or server.
        isolate_analyticsstore:
          list-mode: strict
          files:
            - "**/session/analyticsstore/*.go"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/tstapler/stapler-squad/session/domain
            - github.com/tstapler/stapler-squad/session/ent
            - github.com/tstapler/stapler-squad/session/ent/classificationanalytics
            - github.com/tstapler/stapler-squad/session/ent/dismissedfinding
            - github.com/tstapler/stapler-squad/session/ent/predicate
        # session/instancestore is a persistence leaf embedded by session.EntRepository: it never
        # imports session, github or server.
        isolate_instancestore:
          list-mode: strict
          files:
            - "**/session/instancestore/*.go"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/tstapler/stapler-squad/session/domain
            - github.com/tstapler/stapler-squad/session/ent
            - github.com/tstapler/stapler-squad/session/ent/claudemetadata
            - github.com/tstapler/stapler-squad/session/ent/claudesession
            - github.com/tstapler/stapler-squad/session/ent/diffstats
            - github.com/tstapler/stapler-squad/session/ent/itemsession
            - github.com/tstapler/stapler-squad/session/ent/project
            - github.com/tstapler/stapler-squad/session/ent/session
            - github.com/tstapler/stapler-squad/session/ent/shell
            - github.com/tstapler/stapler-squad/session/ent/tag
            - github.com/tstapler/stapler-squad/session/ent/worktree
        # session/markerstore is a persistence leaf embedded by session.EntRepository: it never
        # imports session, github or server.
        isolate_markerstore:
          list-mode: strict
          files:
            - "**/session/markerstore/*.go"
            - "!**/*_test.go"
          allow:
            - $gostd
            - entgo.io/ent/dialect/sql
            - github.com/google/uuid
            - github.com/tstapler/stapler-squad/log
            - github.com/tstapler/stapler-squad/session/ent
            - github.com/tstapler/stapler-squad/session/ent/backlogflowmarker
            - github.com/tstapler/stapler-squad/session/ent/backlogitem
            - github.com/tstapler/stapler-squad/session/ent/backlogstuckepisode
        # session/sessionpr persists PullRequestState, session PR links and tombstones and is embedded by
        # session.EntRepository: it never imports session or server.
        isolate_sessionpr:
          list-mode: strict
          files:
            - "**/session/sessionpr/*.go"
            - "!**/*_test.go"
          allow:
            - $gostd
            - entgo.io/ent/dialect
            - entgo.io/ent/dialect/sql
            - github.com/google/uuid
            - github.com/tstapler/stapler-squad/config
            - github.com/tstapler/stapler-squad/github
            - github.com/tstapler/stapler-squad/log
            - github.com/tstapler/stapler-squad/session/domain
            - github.com/tstapler/stapler-squad/session/ent
            - github.com/tstapler/stapler-squad/session/ent/backlogitem
            - github.com/tstapler/stapler-squad/session/ent/itemsession
            - github.com/tstapler/stapler-squad/session/ent/predicate
            - github.com/tstapler/stapler-squad/session/ent/pullrequeststate
            - github.com/tstapler/stapler-squad/session/ent/session
            - github.com/tstapler/stapler-squad/session/ent/sessionpr
            - github.com/tstapler/stapler-squad/session/ent/sessionprtombstone
            - github.com/tstapler/stapler-squad/session/instance
        # session/backlogstore persists backlog item sources, sync events and (as E10 proceeds) backlog items; it is
        # embedded by session.EntRepository and never imports session, github or server.
        isolate_backlogstore:
