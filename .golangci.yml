    forbidigo:
      analyze-types: false
      forbid:
        - pattern: ^fmt\.Print(f|ln)?$
          msg: "use the log package instead of fmt.Print* in production code"
        - pattern: '(?m)\bexec\.Command$'
          msg: "use exec.CommandContext with context.WithTimeout; raw exec.Command can hang indefinitely"
        - pattern: 'log\.(InfoLog|WarningLog|ErrorLog|DebugLog)\.Printf'
          msg: "use slog.InfoContext(ctx, ...) in new code; legacy log.XxxLog.Printf is being migrated"
        - pattern: '^LoadInstances$'
          msg: "LoadInstances() re-hydrates all sessions from disk and spawns PTY/tmux subprocesses — use FindLiveInstance fast path instead (see PerfFix-1)"
        - pattern: 'ent\.IsNotFound'
          msg: "use errors.Is(err, session.ErrNotFound) in server/services — wrap ent errors at the storage layer"
        - pattern: 'gitignore\.ReadPatterns'
          msg: "use ignorewalk.ReadPatterns: go-git's version lists every ignored subtree (node_modules) — ~260x slower and 35% of idle CPU in profiles"
      exclude-godoc-examples: true
  exclusions:
    paths:
      - "^\\.\\."
      - session/tmux/tmux_windows
      - web-app
      - \.stapler-squad
      - \.claude-squad
    rules:
      # ──────────────────────────────────────────────────────────────────────────
      # gocyclo/gocognit/funlen/revive(file-length-limit): table-driven tests and
      # generated code naturally run long/branchy without being a maintenance smell —
      # exclude them the same way this file already exempts _test.go from SA5011 and
      # forbidigo above.
      # ──────────────────────────────────────────────────────────────────────────
      - path: "_test\\.go"
        linters: [gocyclo, gocognit, funlen, revive, dupl]
      - path: "^gen/"
        linters: [gocyclo, gocognit, funlen, revive, dupl]
      - path: "\\.pb\\.go"
        linters: [gocyclo, gocognit, funlen, revive, dupl]
      - path: "\\.connect\\.go"
        linters: [gocyclo, gocognit, funlen, revive, dupl]
      - path: "session/ent/"
        linters: [gocyclo, gocognit, funlen, revive, dupl]
      # tools/bzl and tools/ci are standalone Bazel/CI developer CLIs (never linked into the product
      # binary): run-once main packages with flag-style globals, shell-outs and long run() functions.
      - path: "^tools/(bzl|ci)/"
        linters: [forbidigo, gochecknoglobals, gocyclo, gocognit, funlen, revive, dupl, prealloc]
      # exhaustive enforces DetectedStatus switch coverage in session/detection/
      # and Reason switch coverage in session/lifecycle/ only. All other
      # packages use iota types with intentional default: clauses.
      - path: "^server/"
        linters: [exhaustive]
      - path: "^session/[^dl]"
        linters: [exhaustive]
      - path: "^session/d[^e]"
        linters: [exhaustive]
      - path: "^session/de[^t]"
        linters: [exhaustive]
      - path: "^session/det[^e]"
        linters: [exhaustive]
      - path: "^session/dete[^c]"
        linters: [exhaustive]
      - path: "^session/l[^i]"
        linters: [exhaustive]
      - path: "^session/li[^f]"
        linters: [exhaustive]
      - path: "^session/lif[^e]"
        linters: [exhaustive]
      - path: "^session/life[^c]"
        linters: [exhaustive]
      - path: "^session/lifec[^y]"
        linters: [exhaustive]
      - path: "^main\\.go"
        linters: [exhaustive]
      - path: "^github/"
        linters: [exhaustive]
      - path: "^executor/"
        linters: [exhaustive]
      - path: "^cmd/"
        linters: [exhaustive]
      - path: "^pkg/"
        linters: [exhaustive]
      - path: "^daemon/"
        linters: [exhaustive]
      - path: "^telemetry/"
        linters: [exhaustive]
      - path: "^testutil/"
        linters: [exhaustive]
      - path: "^profiling/"
        linters: [exhaustive]
      # infoplist_darwin.go uses import "C" to force CGO linking for macOS codesigning.
      # The CGO preamble comment causes a C compiler parse error when golangci-lint
      # runs typecheck without the macOS build flags. Suppress the typecheck issue.
      - path: "infoplist_darwin\\.go"
        linters: [typecheck]
      - linters: [typecheck]
        text: "could not import C"
      - linters: [typecheck]
        text: "unknown type name 'cgo'"
      - linters: [typecheck]
        text: "expected ';' after top level declarator"
      - linters: [typecheck]
        text: "requires newer Go version"
      # LoadInstances: allow in the storage implementation itself, in bulk-startup wiring,
      # and in the fallback path of findInstanceFast (workspace_service.go) which is
      # intentionally guarded by the live-finder fast path.
      - path: "(_test\\.go|session/git/ignorewalk/)"
        linters: [forbidigo]
        text: "ignorewalk.ReadPatterns"
      - path: "session/storage\\.go"
        linters: [forbidigo]
        text: "LoadInstances"
      - path: "server/dependencies\\.go"
        linters: [forbidigo]
        text: "LoadInstances"
      - path: "server/services/workspace_service\\.go"
        linters: [forbidigo]
        text: "LoadInstances"
      - path: "server/services/session_service\\.go"
        linters: [forbidigo]
        text: "LoadInstances"
      # Same intentional LoadInstances uses as session_service.go above, moved
      # verbatim into these files by the session_service_*.go file-size split
      # (2026-10) — not newly introduced.
      - path: "server/services/session_service_(crud|lifecycle)\\.go"
        linters: [forbidigo]
        text: "LoadInstances"
      # MCP tools have their own per-tool LoadInstances calls that are aware of the
      # side-effect but have not yet been migrated to FindLiveInstance.
      - path: "server/mcp/"
        linters: [forbidigo]
        text: "LoadInstances"
      # Remaining services with intentional LoadInstances uses (health, backlog, etc.)
      - path: "server/services/([a-z]+/)?(approval_handler|review_queue_service|notification_service|backlog_service|backlog_service_sync|unfinished_work_service|terminal_websocket|github_service|session_image_upload_handler)\\.go"
        linters: [forbidigo]
        text: "LoadInstances"
      - path: "session/autonomous/health\\.go"
        linters: [forbidigo]
        text: "LoadInstances"
      # hibernation_sweeper uses the liveProvider fast path when wired; LoadInstances
      # is only reached in the fallback path (e.g. tests without the poller).
      - path: "session/sweeper/hibernation_sweeper\\.go"
        linters: [forbidigo]
        text: "LoadInstances"
      - path: "_test\\.go"
        linters: [forbidigo]
        text: "LoadInstances"
      - path: "_test\\.go"
        linters: [forbidigo]
        text: "exec\\.Command"
      # Allow fmt.Print* in main.go, test files, cmd/, and tests/demo/ (CLI/test output)
      - path: "main\\.go"
        linters: [forbidigo]
        text: "fmt\\.Print"
      - path: "_test\\.go"
        linters: [forbidigo]
        text: "fmt\\.Print"
      - path: "^cmd/"
        linters: [forbidigo]
        text: "fmt\\.Print"
      - path: "^tests/demo/"
        linters: [forbidigo]
        text: "fmt\\.Print"
      # SA5011 false positives: staticcheck doesn't model t.Fatal/t.Fatalf as non-returning,
      # so nil-guard patterns like "if x == nil { t.Fatal(...) }; x.Field" get flagged.
      - path: "_test\\.go"
        linters: [staticcheck]
        text: "SA5011"
      # Allow fmt.Print* in session/mux/picker.go (terminal UI rendering with escape codes)
      - path: "^session/mux/picker\\.go"
        linters: [forbidigo]
      # ──────────────────────────────────────────────────────────────────────────
      # forbidigo: legacy log.XxxLog.Printf — migrated incrementally.
      # New packages (pkg/warren, pkg/events, pkg/analytics) are NOT excluded;
      # they must use slog from the start.
      # ──────────────────────────────────────────────────────────────────────────
      - path: "^log/"
        linters: [forbidigo]
        text: "log\\."
      - path: "^session/"
        linters: [forbidigo]
        text: "log\\."
      - path: "^server/"
        linters: [forbidigo]
        text: "log\\."
      - path: "^cmd/"
        linters: [forbidigo]
        text: "log\\."
      - path: "^daemon/"
        linters: [forbidigo]
        text: "log\\."
      - path: "^config/"
