            - "!**/server/services/backlogsvc/backlog_service_trigger_triage.go"
            - "!**/server/services/session_service.go"
            # Newly surfaced (2026-08-23) by fixing the files: glob bug above — this rule was
            # silently matching 0 files in server/services/ before the fix, so these pre-existing
            # session/ent imports were never actually checked despite not being on the exclusion
            # list. Same family as the backlog_service_*.go / session_summary_service.go splits
            # already grandfathered above; not newly introduced.
            - "!**/server/services/backlogsvc/backlog_service_pipeline_mode.go"
            - "!**/server/services/backlogsvc/backlog_service_ship.go"
            - "!**/server/services/backlogsvc/backlog_service_ship_status.go"
            - "!**/server/services/summaryrpc/session_summary_service_test.go"
            - "!**/server/services/backlogsvc/backlog_service_sync.go"
            - "!**/server/services/webhooktrigger/github_webhook_handler.go"
            - "!**/server/services/summaryrpc/session_summary_service.go"
            - "!**/server/services/backlogsvc/backlog_service_pipeline_mode_test.go"
            - "!**/server/services/webhooktrigger/webhook_trigger_common.go"
            - "!**/server/services/webhooktrigger/github_webhook_handler_test.go"
            - "!**/server/services/webhooktrigger/generic_webhook_handler_test.go"
            # The shared webhook fixture returns the *ent.Workflow rows the handlers read (moved from generic_webhook_handler_test.go).
            - "!**/server/services/internal/svctest/webhook_infra.go"
            # handoff_summary_service_test.go legitimately needs raw ent access
            # to construct precise fixtures (e.g. a stale GENERATING row with a
            # controlled generation_started_at in the past) that the generator's
            # public API has no way to set up — same justification already
            # accepted for session_summary_service_test.go above. The production
            # file (handoff_summary_service.go) does NOT need this exclusion —
