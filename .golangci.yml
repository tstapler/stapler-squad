        # Story 1.1.0c (go-git fork plan, package topology). Strict allow-lists: anything not
        # listed is rejected. Test files are excluded so fixtures can use testify, gittest,
        # safeexec etc. The `go list -deps` acceptance checks in the plan are the second
        # line of defense (they also catch transitive imports, which depguard cannot).
        # backend is a leaf: no session/*, config or go-git in its API.
        git_backend_leaf:
          list-mode: strict
          files:
            - "**/session/git/backend/*.go"
            - "!**/*_test.go"
          allow:
            - $gostd
            - go.opentelemetry.io/otel
            - github.com/tstapler/stapler-squad/log
            - github.com/tstapler/stapler-squad/telemetry
            - github.com/tstapler/stapler-squad/session/git/redact
            - github.com/tstapler/stapler-squad/session/git/backend
        # native holds the on-disk worktree/merge code; collaborators are injected (MergeDeps).
