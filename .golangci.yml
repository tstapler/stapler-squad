              desc: "pkg/ must not import session"
            - pkg: "github.com/tstapler/stapler-squad/session/git"
              desc: "pkg/ must not import session/git; take an injected backend or a narrow local port"
            - pkg: "github.com/tstapler/stapler-squad/session/git/native"
              desc: "pkg/ must not import session/git/native"
            - pkg: "github.com/tstapler/stapler-squad/session/tmux"
