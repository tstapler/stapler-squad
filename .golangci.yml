              desc: "session/gitwiring is the composition root; session/git, session/vcs, session/vc and pkg/ receive collaborators by injection and must not import it"
        # pkg/ must not reach into session/. depguard matches `pkg` exactly here: a bare
        # ".../session" did not deny ".../session/tmux", and trailing "/**" and "/*" globs
        # matched nothing in a failing-fixture check, so the packages that matter are named.
        # The `go list -deps ./pkg/classifier` check in the plan covers the transitive case.
        pkg_no_session:
          files:
